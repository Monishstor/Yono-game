<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Emerald Green Quilted Background Gradient -->
    <radialGradient id="rumbleBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e4f32"/>
      <stop offset="60%" stop-color="#063521"/>
      <stop offset="100%" stop-color="#021d12"/>
    </radialGradient>

    <!-- Diamond Badge Inner Gradient -->
    <linearGradient id="rumbleDiamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#147046"/>
      <stop offset="50%" stop-color="#0c4f30"/>
      <stop offset="100%" stop-color="#042e1a"/>
    </linearGradient>

    <!-- Golden Crown & Text Gradient -->
    <linearGradient id="goldCrown" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff699"/>
      <stop offset="35%" stop-color="#ffd700"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Gold Ring Outline Gradient -->
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#fff480"/>
    </linearGradient>

    <!-- Slot Machine Reel Metallic Gradient -->
    <linearGradient id="reelGradRumble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9aa5ad"/>
      <stop offset="15%" stop-color="#f2f6f9"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#e2e8ed"/>
      <stop offset="100%" stop-color="#8a96a0"/>
    </linearGradient>

    <!-- Chrome Border -->
    <linearGradient id="chromeBorderRumble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#11998e"/>
    </linearGradient>

    <!-- Heavy Drop Shadow -->
    <filter id="rumbleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.65"/>
    </filter>

    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Rounded Green Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#rumbleBg)" />

  <!-- Quilted Diamond Pattern subtle overlay -->
  <g opacity="0.18" stroke="#38ef7d" stroke-width="1.5" fill="none">
    <path d="M 0 128 L 512 128 M 0 256 L 512 256 M 0 384 L 512 384" />
    <path d="M 128 0 L 128 512 M 256 0 L 256 512 M 384 0 L 384 512" />
    <path d="M 0 0 L 512 512 M 512 0 L 0 512" />
    <path d="M -256 256 L 256 768 M 256 -256 L 768 256" />
    <path d="M 256 -256 L -256 256 M 768 256 L 256 768" />
  </g>

  <!-- Gold Circular Embellished Ring Behind Diamond -->
  <g filter="url(#rumbleShadow)">
    <circle cx="256" cy="270" r="176" fill="none" stroke="url(#goldRing)" stroke-width="8" />
    <circle cx="256" cy="270" r="166" fill="none" stroke="#2ce075" stroke-width="2" opacity="0.6" />
    <!-- Golden dots around ring -->
    <circle cx="112" cy="180" r="4" fill="#ffd700" />
    <circle cx="400" cy="180" r="4" fill="#ffd700" />
    <circle cx="95" cy="290" r="4" fill="#ffd700" />
    <circle cx="417" cy="290" r="4" fill="#ffd700" />
    <circle cx="150" cy="400" r="4" fill="#ffd700" />
    <circle cx="362" cy="400" r="4" fill="#ffd700" />
  </g>

  <!-- Center Dark Green Diamond Badge -->
  <g filter="url(#rumbleShadow)">
    <rect x="76" y="90" width="360" height="360" rx="36" transform="rotate(45 256 270)" fill="url(#rumbleDiamond)" stroke="#2ce075" stroke-width="6" />
    <rect x="92" y="106" width="328" height="328" rx="28" transform="rotate(45 256 270)" fill="none" stroke="#0a4628" stroke-width="3" />
  </g>

  <!-- Golden 3D Royal Crown with Rubies and Jewels on Top -->
  <g filter="url(#rumbleShadow)" transform="translate(146, 80)">
    <!-- Crown Base Band -->
    <path d="M 12 110 C 70 126 150 126 208 110 L 218 88 C 156 104 64 104 2 88 Z" fill="url(#goldCrown)" stroke="#78350f" stroke-width="3"/>
    <ellipse cx="110" cy="105" rx="98" ry="14" fill="#d97706" opacity="0.4"/>
    <ellipse cx="110" cy="100" rx="94" ry="10" fill="url(#goldCrown)"/>
    
    <!-- Crown Spikes (5 Points with Golden Spheres) -->
    <!-- Center Peak -->
    <path d="M 85 92 L 110 8 L 135 92 Z" fill="url(#goldCrown)" stroke="#b45309" stroke-width="2"/>
    <!-- Left Inner Peak -->
    <path d="M 45 90 L 58 26 L 85 90 Z" fill="url(#goldCrown)" stroke="#b45309" stroke-width="2"/>
    <!-- Right Inner Peak -->
    <path d="M 135 90 L 162 26 L 175 90 Z" fill="url(#goldCrown)" stroke="#b45309" stroke-width="2"/>
    <!-- Left Outer Peak -->
    <path d="M 8 88 L 14 46 L 45 90 Z" fill="url(#goldCrown)" stroke="#b45309" stroke-width="2"/>
    <!-- Right Outer Peak -->
    <path d="M 175 90 L 206 46 L 212 88 Z" fill="url(#goldCrown)" stroke="#b45309" stroke-width="2"/>

    <!-- Pearls/Jewels on Peaks -->
    <circle cx="110" cy="8" r="10" fill="#fff699" stroke="#b45309" stroke-width="2"/>
    <circle cx="58" cy="26" r="8" fill="#fff699" stroke="#b45309" stroke-width="2"/>
    <circle cx="162" cy="26" r="8" fill="#fff699" stroke="#b45309" stroke-width="2"/>
    <circle cx="14" cy="46" r="7" fill="#fff699" stroke="#b45309" stroke-width="2"/>
    <circle cx="206" cy="46" r="7" fill="#fff699" stroke="#b45309" stroke-width="2"/>

    <!-- Crown Front Jewels (Red Rubies and Emeralds) -->
    <ellipse cx="110" cy="100" rx="8" ry="10" fill="#dc2626" stroke="#fff" stroke-width="1.5"/>
    <ellipse cx="60" cy="98" rx="6" ry="8" fill="#16a34a" stroke="#fff" stroke-width="1.5"/>
    <ellipse cx="160" cy="98" rx="6" ry="8" fill="#16a34a" stroke="#fff" stroke-width="1.5"/>
    <ellipse cx="25" cy="95" rx="5" ry="6" fill="#2563eb" stroke="#fff" stroke-width="1.5"/>
    <ellipse cx="195" cy="95" rx="5" ry="6" fill="#2563eb" stroke="#fff" stroke-width="1.5"/>

    <!-- Crown Sparkles -->
    <polygon points="190,14 194,22 202,26 194,30 190,38 186,30 178,26 186,22" fill="#ffffff" filter="url(#glowGold)"/>
    <polygon points="30,10 34,18 42,22 34,26 30,34 26,26 18,22 26,18" fill="#ffffff" filter="url(#glowGold)"/>
  </g>

  <!-- Golden 3D "RUMBLE" Text -->
  <g filter="url(#rumbleShadow)">
    <!-- Deep Red/Orange 3D Extrusions -->
    <text x="256" y="260" font-family="'Arial Black', 'Impact', sans-serif" font-size="108" font-weight="900" text-anchor="middle" letter-spacing="-2" fill="#8f2400">RUMBLE</text>
    <text x="256" y="256" font-family="'Arial Black', 'Impact', sans-serif" font-size="108" font-weight="900" text-anchor="middle" letter-spacing="-2" fill="#b83800">RUMBLE</text>
    <text x="256" y="252" font-family="'Arial Black', 'Impact', sans-serif" font-size="108" font-weight="900" text-anchor="middle" letter-spacing="-2" fill="#e05300">RUMBLE</text>
    <text x="256" y="248" font-family="'Arial Black', 'Impact', sans-serif" font-size="108" font-weight="900" text-anchor="middle" letter-spacing="-2" fill="#ff7300">RUMBLE</text>
    
    <!-- Top Gold Gradient Face with White Stroke -->
    <text x="256" y="244" font-family="'Arial Black', 'Impact', sans-serif" font-size="108" font-weight="900" text-anchor="middle" letter-spacing="-2" fill="url(#goldCrown)" stroke="#ffffff" stroke-width="4">RUMBLE</text>

    <!-- Sparkles on RUMBLE -->
    <polygon points="120,188 124,196 132,200 124,204 120,212 116,204 108,200 116,196" fill="#ffffff" />
    <polygon points="410,240 414,248 422,252 414,256 410,264 406,256 398,252 406,248" fill="#ffffff" />
  </g>

  <!-- Slot Reel Container for "RUMMY" -->
  <g filter="url(#rumbleShadow)">
    <!-- Outer Glow Capsule -->
    <rect x="24" y="278" width="464" height="126" rx="63" fill="#042e1a" stroke="url(#chromeBorderRumble)" stroke-width="8" />
    <!-- Metallic Reel Cylinders Body -->
    <rect x="32" y="286" width="448" height="110" rx="55" fill="url(#reelGradRumble)" stroke="#b8c4ce" stroke-width="2" />

    <!-- Slot Divider Lines for 5 letters (R - U - M - M - Y) -->
    <!-- R (32 to 120) -->
    <line x1="120" y1="286" x2="120" y2="396" stroke="#8a96a0" stroke-width="4" />
    <line x1="122" y1="286" x2="122" y2="396" stroke="#ffffff" stroke-width="2" />

    <!-- U (120 to 210) -->
    <line x1="210" y1="286" x2="210" y2="396" stroke="#8a96a0" stroke-width="4" />
    <line x1="212" y1="286" x2="212" y2="396" stroke="#ffffff" stroke-width="2" />

    <!-- M (210 to 300) -->
    <line x1="300" y1="286" x2="300" y2="396" stroke="#8a96a0" stroke-width="4" />
    <line x1="302" y1="286" x2="302" y2="396" stroke="#ffffff" stroke-width="2" />

    <!-- M (300 to 390) -->
    <line x1="390" y1="286" x2="390" y2="396" stroke="#8a96a0" stroke-width="4" />
    <line x1="392" y1="286" x2="392" y2="396" stroke="#ffffff" stroke-width="2" />
    <!-- Y (390 to 480) -->

    <!-- Top & Bottom Reel Cylinder Curved Shadows -->
    <path d="M 32 286 Q 256 306 480 286 L 480 302 Q 256 322 32 302 Z" fill="#000000" opacity="0.25" />
    <path d="M 32 396 Q 256 376 480 396 L 480 380 Q 256 360 32 380 Z" fill="#000000" opacity="0.25" />

    <!-- "RUMMY" Bold Green Letters -->
    <!-- R -->
    <text x="76" y="374" font-family="'Arial Black', 'Impact', sans-serif" font-size="80" font-weight="900" text-anchor="middle" fill="#04562c" stroke="#ffffff" stroke-width="6" stroke-linejoin="round">R</text>
    <text x="76" y="374" font-family="'Arial Black', 'Impact', sans-serif" font-size="80" font-weight="900" text-anchor="middle" fill="#0b7a42">R</text>

    <!-- U -->
    <text x="165" y="374" font-family="'Arial Black', 'Impact', sans-serif" font-size="80" font-weight="900" text-anchor="middle" fill="#04562c" stroke="#ffffff" stroke-width="6" stroke-linejoin="round">U</text>
    <text x="165" y="374" font-family="'Arial Black', 'Impact', sans-serif" font-size="80" font-weight="900" text-anchor="middle" fill="#0b7a42">U</text>

    <!-- M -->
    <text x="256" y="374" font-family="'Arial Black', 'Impact', sans-serif" font-size="80" font-weight="900" text-anchor="middle" fill="#04562c" stroke="#ffffff" stroke-width="6" stroke-linejoin="round">M</text>
    <text x="256" y="374" font-family="'Arial Black', 'Impact', sans-serif" font-size="80" font-weight="900" text-anchor="middle" fill="#0b7a42">M</text>

    <!-- M -->
    <text x="345" y="374" font-family="'Arial Black', 'Impact', sans-serif" font-size="80" font-weight="900" text-anchor="middle" fill="#04562c" stroke="#ffffff" stroke-width="6" stroke-linejoin="round">M</text>
    <text x="345" y="374" font-family="'Arial Black', 'Impact', sans-serif" font-size="80" font-weight="900" text-anchor="middle" fill="#0b7a42">M</text>

    <!-- Y -->
    <text x="435" y="374" font-family="'Arial Black', 'Impact', sans-serif" font-size="80" font-weight="900" text-anchor="middle" fill="#04562c" stroke="#ffffff" stroke-width="6" stroke-linejoin="round">Y</text>
    <text x="435" y="374" font-family="'Arial Black', 'Impact', sans-serif" font-size="80" font-weight="900" text-anchor="middle" fill="#0b7a42">Y</text>
  </g>
</svg>

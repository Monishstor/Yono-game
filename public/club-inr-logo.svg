<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Emerald Green Quilted Radial Gradient -->
    <radialGradient id="clubInrBgRadial" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#0c633c"/>
      <stop offset="40%" stop-color="#064828"/>
      <stop offset="80%" stop-color="#022816"/>
      <stop offset="100%" stop-color="#01130a"/>
    </radialGradient>

    <!-- Center Rotated Diamond Plate Gradient -->
    <linearGradient id="clubInrDiamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#117547"/>
      <stop offset="50%" stop-color="#095532"/>
      <stop offset="100%" stop-color="#04311c"/>
    </linearGradient>

    <!-- 3D Golden "CLUB" Typography Gradient -->
    <linearGradient id="clubGoldFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="15%" stop-color="#fff59d"/>
      <stop offset="45%" stop-color="#ffd600"/>
      <stop offset="75%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>

    <!-- Slot Roller Outer Metallic Green Frame -->
    <linearGradient id="clubReelGreenFrame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#16a34a"/>
      <stop offset="85%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>

    <!-- Slot Reel Cylinder (White/Silver) -->
    <linearGradient id="clubReelSilver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="12%" stop-color="#e2e8f0"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Deep Green Letter "INR" Face Gradient -->
    <linearGradient id="clubLetterGreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="40%" stop-color="#065f46"/>
      <stop offset="80%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c19"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="clubShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Base Squircle with Deep Green Texture -->
  <rect width="512" height="512" rx="112" fill="url(#clubInrBgRadial)"/>

  <!-- Checkerboard / Diamond Quilted Pattern -->
  <g opacity="0.25" stroke="#22c55e" stroke-width="1.2" fill="none">
    <path d="M-60 256 L256 -60 L572 256 L256 572 Z" />
    <path d="M0 256 L256 0 L512 256 L256 512 Z" />
    <path d="M64 256 L256 64 L448 256 L256 448 Z" />
    <path d="M128 256 L256 128 L384 256 L256 384 Z" />
    <path d="M192 256 L256 192 L320 256 L256 320 Z" />
    <line x1="64" y1="0" x2="512" y2="448" />
    <line x1="0" y1="64" x2="448" y2="512" />
    <line x1="0" y1="192" x2="320" y2="512" />
    <line x1="192" y1="0" x2="512" y2="320" />
    <line x1="448" y1="0" x2="0" y2="448" />
    <line x1="512" y1="64" x2="64" y2="512" />
    <line x1="320" y1="0" x2="0" y2="320" />
    <line x1="512" y1="192" x2="192" y2="512" />
  </g>

  <!-- Outer Rounded Neon Green Accent Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#22c55e" stroke-width="4.5" opacity="0.4"/>

  <!-- Center Rotated Diamond Plate with Neon Green Glow Border -->
  <g filter="url(#clubShadow)">
    <rect x="76" y="76" width="360" height="360" rx="44" transform="rotate(45 256 256)" fill="url(#clubInrDiamondGrad)" stroke="#22c55e" stroke-width="5" stroke-opacity="0.85"/>
  </g>

  <!-- ==================== 3D "CLUB" TOP SECTION ==================== -->
  <g filter="url(#clubShadow)">
    <!-- 3D Extrusions -->
    <text x="256" y="246" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="152" letter-spacing="3" fill="#2d0c00" stroke="#2d0c00" stroke-width="20" stroke-linejoin="round">CLUB</text>
    <text x="256" y="240" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="152" letter-spacing="3" fill="#7c2d12" stroke="#7c2d12" stroke-width="16" stroke-linejoin="round">CLUB</text>
    <text x="256" y="234" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="152" letter-spacing="3" fill="#c2410c" stroke="#c2410c" stroke-width="12" stroke-linejoin="round">CLUB</text>
    <text x="256" y="228" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="152" letter-spacing="3" fill="#ea580c" stroke="#ea580c" stroke-width="8" stroke-linejoin="round">CLUB</text>
    <text x="256" y="222" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="152" letter-spacing="3" fill="#f59e0b" stroke="#f59e0b" stroke-width="5" stroke-linejoin="round">CLUB</text>
    <!-- Golden Top Face -->
    <text x="256" y="216" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="152" letter-spacing="3" fill="url(#clubGoldFace)" stroke="#fef08a" stroke-width="3" stroke-linejoin="round">CLUB</text>

    <!-- Metallic Star Sparkles (Left 'C' and Right 'B') -->
    <!-- Sparkle on C -->
    <g transform="translate(76, 132)">
      <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4" fill="#ffffff"/>
      <polygon points="0,-10 2.5,-2.5 10,0 2.5,2.5 0,10 -2.5,2.5 -10,0 -2.5,-2.5" fill="#fef08a"/>
      <circle cx="0" cy="0" r="3" fill="#ffffff"/>
    </g>
    <!-- Sparkle on B -->
    <g transform="translate(352, 122)">
      <polygon points="0,-20 5,-5 20,0 5,5 0,20 -5,5 -20,0 -5,-5" fill="#ffffff"/>
      <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="#fef08a"/>
      <circle cx="0" cy="0" r="4" fill="#ffffff"/>
    </g>
  </g>

  <!-- ==================== 5-SLOT CYLINDER REEL [CHERRY] [I] [N] [R] [CHERRY] ==================== -->
  <g filter="url(#clubShadow)">
    <!-- Slot Outer Dark Rim -->
    <rect x="22" y="268" width="468" height="132" rx="66" fill="#011b10" stroke="#000000" stroke-width="6"/>

    <!-- Shiny Chrome Green Rim -->
    <rect x="26" y="272" width="460" height="124" rx="62" fill="url(#clubReelGreenFrame)" stroke="#166534" stroke-width="2"/>

    <!-- 5-Slot Silver Cylinder Body -->
    <rect x="34" y="278" width="444" height="112" rx="56" fill="url(#clubReelSilver)"/>

    <!-- 4 Reel Column Dividers -->
    <!-- Col 1 (Cherry) / Col 2 (I) -->
    <path d="M122 278 L122 390" stroke="#94a3b8" stroke-width="3" opacity="0.75"/>
    <path d="M124 278 L124 390" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Col 2 (I) / Col 3 (N) -->
    <path d="M212 278 L212 390" stroke="#94a3b8" stroke-width="3" opacity="0.75"/>
    <path d="M214 278 L214 390" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Col 3 (N) / Col 4 (R) -->
    <path d="M300 278 L300 390" stroke="#94a3b8" stroke-width="3" opacity="0.75"/>
    <path d="M302 278 L302 390" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Col 4 (R) / Col 5 (Cherry) -->
    <path d="M388 278 L388 390" stroke="#94a3b8" stroke-width="3" opacity="0.75"/>
    <path d="M390 278 L390 390" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Reel Gloss Highlight -->
    <rect x="54" y="282" width="404" height="20" rx="10" fill="#ffffff" opacity="0.75"/>
    <rect x="64" y="286" width="384" height="6" rx="3" fill="#ffffff" opacity="0.95"/>
    <rect x="74" y="374" width="364" height="8" rx="4" fill="#ffffff" opacity="0.3"/>

    <!-- ==================== REEL ITEMS ==================== -->

    <!-- SLOT 1: GREEN CHERRIES (cx: 78) -->
    <g transform="translate(78, 334)">
      <!-- Left Cherry Stem -->
      <path d="M -3 -22 C -8 -10, -18 -2, -16 6" fill="none" stroke="#047857" stroke-width="4.5" stroke-linecap="round"/>
      <!-- Right Cherry Stem -->
      <path d="M -3 -22 C 4 -10, 14 -2, 16 6" fill="none" stroke="#047857" stroke-width="4.5" stroke-linecap="round"/>
      <!-- Top Stem Junction Leaf -->
      <path d="M -3 -22 C 3 -28, 12 -26, 14 -20 C 6 -20, 0 -22, -3 -22 Z" fill="#22c55e"/>
      <!-- Left Cherry Body -->
      <circle cx="-16" cy="10" r="16" fill="#065f46" stroke="#012417" stroke-width="3"/>
      <circle cx="-16" cy="10" r="14" fill="#047857"/>
      <circle cx="-20" cy="6" r="4.5" fill="#4ade80" opacity="0.9"/>
      <!-- Right Cherry Body -->
      <circle cx="16" cy="10" r="16" fill="#065f46" stroke="#012417" stroke-width="3"/>
      <circle cx="16" cy="10" r="14" fill="#047857"/>
      <circle cx="12" cy="6" r="4.5" fill="#4ade80" opacity="0.9"/>
    </g>

    <!-- SLOT 2: LETTER 'I' (cx: 167) -->
    <g>
      <text x="167" y="370" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">I</text>
      <text x="167" y="366" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">I</text>
      <text x="167" y="366" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="url(#clubLetterGreenGrad)">I</text>
    </g>

    <!-- SLOT 3: LETTER 'N' (cx: 256) -->
    <g>
      <text x="256" y="370" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">N</text>
      <text x="256" y="366" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">N</text>
      <text x="256" y="366" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="url(#clubLetterGreenGrad)">N</text>
    </g>

    <!-- SLOT 4: LETTER 'R' (cx: 345) -->
    <g>
      <text x="345" y="370" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">R</text>
      <text x="345" y="366" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">R</text>
      <text x="345" y="366" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="url(#clubLetterGreenGrad)">R</text>
    </g>

    <!-- SLOT 5: GREEN CHERRIES (cx: 434) -->
    <g transform="translate(434, 334)">
      <!-- Left Cherry Stem -->
      <path d="M -3 -22 C -8 -10, -18 -2, -16 6" fill="none" stroke="#047857" stroke-width="4.5" stroke-linecap="round"/>
      <!-- Right Cherry Stem -->
      <path d="M -3 -22 C 4 -10, 14 -2, 16 6" fill="none" stroke="#047857" stroke-width="4.5" stroke-linecap="round"/>
      <!-- Top Stem Junction Leaf -->
      <path d="M -3 -22 C 3 -28, 12 -26, 14 -20 C 6 -20, 0 -22, -3 -22 Z" fill="#22c55e"/>
      <!-- Left Cherry Body -->
      <circle cx="-16" cy="10" r="16" fill="#065f46" stroke="#012417" stroke-width="3"/>
      <circle cx="-16" cy="10" r="14" fill="#047857"/>
      <circle cx="-20" cy="6" r="4.5" fill="#4ade80" opacity="0.9"/>
      <!-- Right Cherry Body -->
      <circle cx="16" cy="10" r="16" fill="#065f46" stroke="#012417" stroke-width="3"/>
      <circle cx="16" cy="10" r="14" fill="#047857"/>
      <circle cx="12" cy="6" r="4.5" fill="#4ade80" opacity="0.9"/>
    </g>
  </g>

  <!-- ==================== "DAILY BONUSES AVAILABLE" BOTTOM RIBBON ==================== -->
  <g filter="url(#clubShadow)">
    <text x="256" y="440" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="28" letter-spacing="1.5" fill="#022c19" stroke="#011a0e" stroke-width="6" stroke-linejoin="round">DAILY BONUSES AVAILABLE</text>
    <text x="256" y="438" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="28" letter-spacing="1.5" fill="#4ade80" stroke="#15803d" stroke-width="2" stroke-linejoin="round">DAILY BONUSES AVAILABLE</text>
    <text x="256" y="438" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="28" letter-spacing="1.5" fill="#ffffff">DAILY BONUSES AVAILABLE</text>
  </g>
</svg>

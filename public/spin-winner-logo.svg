<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Emerald Green Background Gradient -->
    <radialGradient id="winnerBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e4d30"/>
      <stop offset="60%" stop-color="#06321f"/>
      <stop offset="100%" stop-color="#021c10"/>
    </radialGradient>

    <!-- Diamond Badge Inner Gradient -->
    <linearGradient id="winnerDiamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#146c43"/>
      <stop offset="50%" stop-color="#0c4a2c"/>
      <stop offset="100%" stop-color="#042a17"/>
    </linearGradient>

    <!-- Golden 3D Text Gradient for SPIN -->
    <linearGradient id="winnerGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff480"/>
      <stop offset="45%" stop-color="#ffd000"/>
      <stop offset="55%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#e65c00"/>
    </linearGradient>

    <!-- Slot Machine Reel Metallic Gradient -->
    <linearGradient id="winnerReel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a0aab2"/>
      <stop offset="15%" stop-color="#f0f5f8"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#e2e8ed"/>
      <stop offset="100%" stop-color="#8a96a0"/>
    </linearGradient>

    <!-- Slot border chrome -->
    <linearGradient id="winnerBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#11998e"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="winnerShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- App Rounded Green Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#winnerBg)" />

  <!-- Quilted Diamond Pattern subtle overlay -->
  <g opacity="0.18" stroke="#38ef7d" stroke-width="1.5" fill="none">
    <path d="M 0 128 L 512 128 M 0 256 L 512 256 M 0 384 L 512 384" />
    <path d="M 128 0 L 128 512 M 256 0 L 256 512 M 384 0 L 384 512" />
    <path d="M 0 0 L 512 512 M 512 0 L 0 512" />
    <path d="M -256 256 L 256 768 M 256 -256 L 768 256" />
    <path d="M 256 -256 L -256 256 M 768 256 L 256 768" />
  </g>

  <!-- Center Diamond Badge -->
  <g filter="url(#winnerShadow)">
    <rect x="76" y="76" width="360" height="360" rx="36" transform="rotate(45 256 256)" fill="url(#winnerDiamond)" stroke="#2ce075" stroke-width="6" />
    <rect x="92" y="92" width="328" height="328" rx="28" transform="rotate(45 256 256)" fill="none" stroke="#105a34" stroke-width="3" />
  </g>

  <!-- Golden 3D "SPIN" Text -->
  <g filter="url(#winnerShadow)">
    <!-- 3D Extrusions -->
    <text x="256" y="246" font-family="'Arial Black', 'Impact', sans-serif" font-size="134" font-weight="900" text-anchor="middle" letter-spacing="-3" fill="#b33600">SPIN</text>
    <text x="256" y="243" font-family="'Arial Black', 'Impact', sans-serif" font-size="134" font-weight="900" text-anchor="middle" letter-spacing="-3" fill="#d94b00">SPIN</text>
    <text x="256" y="240" font-family="'Arial Black', 'Impact', sans-serif" font-size="134" font-weight="900" text-anchor="middle" letter-spacing="-3" fill="#ff6600">SPIN</text>
    <text x="256" y="236" font-family="'Arial Black', 'Impact', sans-serif" font-size="134" font-weight="900" text-anchor="middle" letter-spacing="-3" fill="url(#winnerGold)" stroke="#ffffff" stroke-width="4">SPIN</text>
    
    <!-- Sparkles on SPIN -->
    <polygon points="328,118 334,134 350,140 334,146 328,162 322,146 306,140 322,134" fill="#ffffff" />
    <circle cx="328" cy="140" r="3" fill="#ffd700" />
    
    <polygon points="106,236 110,246 120,250 110,254 106,264 102,254 92,250 102,246" fill="#ffffff" />
  </g>

  <!-- Slot Reel Container for "WINNER" (6 letters) -->
  <g filter="url(#winnerShadow)">
    <!-- Outer Glow Capsule -->
    <rect x="18" y="260" width="476" height="126" rx="63" fill="#042a17" stroke="url(#winnerBorder)" stroke-width="8" />
    <!-- Metallic Reel Cylinders Body -->
    <rect x="26" y="268" width="460" height="110" rx="55" fill="url(#winnerReel)" stroke="#b8c4ce" stroke-width="2" />

    <!-- Slot Divider Lines for 6 letters (W - I - N - N - E - R) -->
    <!-- W (26 to 105) -->
    <line x1="105" y1="268" x2="105" y2="378" stroke="#8a96a0" stroke-width="3" />
    <line x1="106" y1="268" x2="106" y2="378" stroke="#ffffff" stroke-width="1.5" />

    <!-- I (105 to 175) -->
    <line x1="175" y1="268" x2="175" y2="378" stroke="#8a96a0" stroke-width="3" />
    <line x1="176" y1="268" x2="176" y2="378" stroke="#ffffff" stroke-width="1.5" />

    <!-- N1 (175 to 256) -->
    <line x1="256" y1="268" x2="256" y2="378" stroke="#8a96a0" stroke-width="3" />
    <line x1="257" y1="268" x2="257" y2="378" stroke="#ffffff" stroke-width="1.5" />

    <!-- N2 (256 to 337) -->
    <line x1="337" y1="268" x2="337" y2="378" stroke="#8a96a0" stroke-width="3" />
    <line x1="338" y1="268" x2="338" y2="378" stroke="#ffffff" stroke-width="1.5" />

    <!-- E (337 to 407) -->
    <line x1="407" y1="268" x2="407" y2="378" stroke="#8a96a0" stroke-width="3" />
    <line x1="408" y1="268" x2="408" y2="378" stroke="#ffffff" stroke-width="1.5" />
    <!-- R (407 to 486) -->

    <!-- Top & Bottom Reel Curved Shadows -->
    <path d="M 26 268 Q 256 288 486 268 L 486 284 Q 256 304 26 284 Z" fill="#000000" opacity="0.25" />
    <path d="M 26 378 Q 256 358 486 378 L 486 362 Q 256 342 26 362 Z" fill="#000000" opacity="0.25" />

    <!-- "WINNER" Bold Green Letters -->
    <!-- W -->
    <text x="66" y="354" font-family="'Arial Black', 'Impact', sans-serif" font-size="70" font-weight="900" text-anchor="middle" fill="#04562c" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">W</text>
    <text x="66" y="354" font-family="'Arial Black', 'Impact', sans-serif" font-size="70" font-weight="900" text-anchor="middle" fill="#0b7a42">W</text>

    <!-- I -->
    <text x="140" y="354" font-family="'Arial Black', 'Impact', sans-serif" font-size="70" font-weight="900" text-anchor="middle" fill="#04562c" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">I</text>
    <text x="140" y="354" font-family="'Arial Black', 'Impact', sans-serif" font-size="70" font-weight="900" text-anchor="middle" fill="#0b7a42">I</text>

    <!-- N -->
    <text x="216" y="354" font-family="'Arial Black', 'Impact', sans-serif" font-size="70" font-weight="900" text-anchor="middle" fill="#04562c" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">N</text>
    <text x="216" y="354" font-family="'Arial Black', 'Impact', sans-serif" font-size="70" font-weight="900" text-anchor="middle" fill="#0b7a42">N</text>

    <!-- N -->
    <text x="297" y="354" font-family="'Arial Black', 'Impact', sans-serif" font-size="70" font-weight="900" text-anchor="middle" fill="#04562c" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">N</text>
    <text x="297" y="354" font-family="'Arial Black', 'Impact', sans-serif" font-size="70" font-weight="900" text-anchor="middle" fill="#0b7a42">N</text>

    <!-- E -->
    <text x="372" y="354" font-family="'Arial Black', 'Impact', sans-serif" font-size="70" font-weight="900" text-anchor="middle" fill="#04562c" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">E</text>
    <text x="372" y="354" font-family="'Arial Black', 'Impact', sans-serif" font-size="70" font-weight="900" text-anchor="middle" fill="#0b7a42">E</text>

    <!-- R -->
    <text x="447" y="354" font-family="'Arial Black', 'Impact', sans-serif" font-size="70" font-weight="900" text-anchor="middle" fill="#04562c" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">R</text>
    <text x="447" y="354" font-family="'Arial Black', 'Impact', sans-serif" font-size="70" font-weight="900" text-anchor="middle" fill="#0b7a42">R</text>
  </g>
</svg>

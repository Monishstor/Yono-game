<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Emerald Green Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e4d30"/>
      <stop offset="60%" stop-color="#06321f"/>
      <stop offset="100%" stop-color="#021c10"/>
    </radialGradient>

    <!-- Diamond Badge Inner Gradient -->
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#146c43"/>
      <stop offset="50%" stop-color="#0c4a2c"/>
      <stop offset="100%" stop-color="#042a17"/>
    </linearGradient>

    <!-- Golden 3D Text Gradient for SPIN -->
    <linearGradient id="goldTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff480"/>
      <stop offset="45%" stop-color="#ffd000"/>
      <stop offset="55%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#e65c00"/>
    </linearGradient>

    <!-- Slot Machine Reel Metallic Gradient -->
    <linearGradient id="reelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a0aab2"/>
      <stop offset="15%" stop-color="#f0f5f8"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#e2e8ed"/>
      <stop offset="100%" stop-color="#8a96a0"/>
    </linearGradient>

    <!-- Slot border chrome -->
    <linearGradient id="chromeBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#11998e"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- App Rounded Green Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Quilted Diamond Pattern subtle overlay -->
  <g opacity="0.18" stroke="#38ef7d" stroke-width="1.5" fill="none">
    <path d="M 0 128 L 512 128 M 0 256 L 512 256 M 0 384 L 512 384" />
    <path d="M 128 0 L 128 512 M 256 0 L 256 512 M 384 0 L 384 512" />
    <path d="M 0 0 L 512 512 M 512 0 L 0 512" />
    <path d="M -256 256 L 256 768 M 256 -256 L 768 256" />
    <path d="M 256 -256 L -256 256 M 768 256 L 256 768" />
  </g>

  <!-- Center Diamond Badge -->
  <g filter="url(#dropShadow)">
    <rect x="76" y="76" width="360" height="360" rx="36" transform="rotate(45 256 256)" fill="url(#diamondGrad)" stroke="#2ce075" stroke-width="6" />
    <rect x="92" y="92" width="328" height="328" rx="28" transform="rotate(45 256 256)" fill="none" stroke="#105a34" stroke-width="3" />
  </g>

  <!-- Golden 3D "SPIN" Text -->
  <g filter="url(#dropShadow)">
    <!-- 3D Extrusion Shadow Layer in Deep Crimson/Orange -->
    <text x="256" y="246" font-family="'Arial Black', 'Impact', sans-serif" font-size="134" font-weight="900" text-anchor="middle" letter-spacing="-3" fill="#b33600">SPIN</text>
    <text x="256" y="243" font-family="'Arial Black', 'Impact', sans-serif" font-size="134" font-weight="900" text-anchor="middle" letter-spacing="-3" fill="#d94b00">SPIN</text>
    <text x="256" y="240" font-family="'Arial Black', 'Impact', sans-serif" font-size="134" font-weight="900" text-anchor="middle" letter-spacing="-3" fill="#ff6600">SPIN</text>
    <!-- Top Highlighted Gold Text -->
    <text x="256" y="236" font-family="'Arial Black', 'Impact', sans-serif" font-size="134" font-weight="900" text-anchor="middle" letter-spacing="-3" fill="url(#goldTop)" stroke="#ffffff" stroke-width="4">SPIN</text>
    
    <!-- Sparkles on SPIN -->
    <polygon points="328,118 334,134 350,140 334,146 328,162 322,146 306,140 322,134" fill="#ffffff" />
    <circle cx="328" cy="140" r="3" fill="#ffd700" />
    
    <polygon points="106,236 110,246 120,250 110,254 106,264 102,254 92,250 102,246" fill="#ffffff" />
  </g>

  <!-- Slot Reel Container for "CRUSH" -->
  <g filter="url(#dropShadow)">
    <!-- Outer Glow Capsule -->
    <rect x="22" y="260" width="468" height="126" rx="63" fill="#042a17" stroke="url(#chromeBorder)" stroke-width="8" />
    <!-- Metallic Reel Cylinders Body -->
    <rect x="30" y="268" width="452" height="110" rx="55" fill="url(#reelGrad)" stroke="#b8c4ce" stroke-width="2" />

    <!-- Slot Divider Lines between letters -->
    <line x1="126" y1="268" x2="126" y2="378" stroke="#8a96a0" stroke-width="4" />
    <line x1="128" y1="268" x2="128" y2="378" stroke="#ffffff" stroke-width="2" />

    <line x1="212" y1="268" x2="212" y2="378" stroke="#8a96a0" stroke-width="4" />
    <line x1="214" y1="268" x2="214" y2="378" stroke="#ffffff" stroke-width="2" />

    <line x1="298" y1="268" x2="298" y2="378" stroke="#8a96a0" stroke-width="4" />
    <line x1="300" y1="268" x2="300" y2="378" stroke="#ffffff" stroke-width="2" />

    <line x1="384" y1="268" x2="384" y2="378" stroke="#8a96a0" stroke-width="4" />
    <line x1="386" y1="268" x2="386" y2="378" stroke="#ffffff" stroke-width="2" />

    <!-- Top & Bottom Reel Cylinder Shadows -->
    <path d="M 30 268 Q 256 288 482 268 L 482 284 Q 256 304 30 284 Z" fill="#000000" opacity="0.25" />
    <path d="M 30 378 Q 256 358 482 378 L 482 362 Q 256 342 30 362 Z" fill="#000000" opacity="0.25" />

    <!-- "CRUSH" Bold Green Letters -->
    <!-- C -->
    <text x="78" y="356" font-family="'Arial Black', 'Impact', sans-serif" font-size="80" font-weight="900" text-anchor="middle" fill="#04562c" stroke="#ffffff" stroke-width="6" stroke-linejoin="round">C</text>
    <text x="78" y="356" font-family="'Arial Black', 'Impact', sans-serif" font-size="80" font-weight="900" text-anchor="middle" fill="#0b7a42">C</text>

    <!-- R -->
    <text x="169" y="356" font-family="'Arial Black', 'Impact', sans-serif" font-size="80" font-weight="900" text-anchor="middle" fill="#04562c" stroke="#ffffff" stroke-width="6" stroke-linejoin="round">R</text>
    <text x="169" y="356" font-family="'Arial Black', 'Impact', sans-serif" font-size="80" font-weight="900" text-anchor="middle" fill="#0b7a42">R</text>

    <!-- U -->
    <text x="256" y="356" font-family="'Arial Black', 'Impact', sans-serif" font-size="80" font-weight="900" text-anchor="middle" fill="#04562c" stroke="#ffffff" stroke-width="6" stroke-linejoin="round">U</text>
    <text x="256" y="356" font-family="'Arial Black', 'Impact', sans-serif" font-size="80" font-weight="900" text-anchor="middle" fill="#0b7a42">U</text>

    <!-- S -->
    <text x="341" y="356" font-family="'Arial Black', 'Impact', sans-serif" font-size="80" font-weight="900" text-anchor="middle" fill="#04562c" stroke="#ffffff" stroke-width="6" stroke-linejoin="round">S</text>
    <text x="341" y="356" font-family="'Arial Black', 'Impact', sans-serif" font-size="80" font-weight="900" text-anchor="middle" fill="#0b7a42">S</text>

    <!-- H -->
    <text x="428" y="356" font-family="'Arial Black', 'Impact', sans-serif" font-size="80" font-weight="900" text-anchor="middle" fill="#04562c" stroke="#ffffff" stroke-width="6" stroke-linejoin="round">H</text>
    <text x="428" y="356" font-family="'Arial Black', 'Impact', sans-serif" font-size="80" font-weight="900" text-anchor="middle" fill="#0b7a42">H</text>
  </g>
</svg>

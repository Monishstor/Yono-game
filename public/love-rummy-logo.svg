<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Emerald Green Quilted Background Radial Gradient -->
    <radialGradient id="loveBgRadial" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#0b5e39"/>
      <stop offset="40%" stop-color="#054425"/>
      <stop offset="80%" stop-color="#022414"/>
      <stop offset="100%" stop-color="#011209"/>
    </radialGradient>

    <!-- Center Rotated Diamond Plate Gradient -->
    <linearGradient id="loveDiamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f6b41"/>
      <stop offset="50%" stop-color="#084d2d"/>
      <stop offset="100%" stop-color="#032a18"/>
    </linearGradient>

    <!-- 3D Gold Typography Face Gradient -->
    <linearGradient id="loveGoldFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="15%" stop-color="#fff59d"/>
      <stop offset="50%" stop-color="#ffd600"/>
      <stop offset="80%" stop-color="#ff9100"/>
      <stop offset="100%" stop-color="#ff6d00"/>
    </linearGradient>

    <!-- 3D Gold Extrusion / Bevel Gradient -->
    <linearGradient id="loveGoldBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="50%" stop-color="#ff8f00"/>
      <stop offset="100%" stop-color="#bf360c"/>
    </linearGradient>

    <!-- Golden Coin Disc Behind Heart Gradient -->
    <radialGradient id="loveCoinGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fff59d"/>
      <stop offset="60%" stop-color="#ffc107"/>
      <stop offset="85%" stop-color="#ff8f00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </radialGradient>

    <!-- 3D Ruby Heart Gradient -->
    <radialGradient id="loveHeartGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff8a80"/>
      <stop offset="20%" stop-color="#ff1744"/>
      <stop offset="60%" stop-color="#d50000"/>
      <stop offset="90%" stop-color="#880e4f"/>
      <stop offset="100%" stop-color="#4a001a"/>
    </radialGradient>

    <!-- Slot Roller Outer Metallic Green Frame -->
    <linearGradient id="loveReelGreenFrame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#16a34a"/>
      <stop offset="85%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>

    <!-- Slot Reel Body (White/Silver Cylinder) -->
    <linearGradient id="loveReelSilverCylinder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="12%" stop-color="#e2e8f0"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Emerald Green "RUMMY" Letter Face Gradient -->
    <linearGradient id="loveRummyGreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="40%" stop-color="#065f46"/>
      <stop offset="80%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c19"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="loveMainShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <filter id="loveHeartGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#b71c1c" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Base Squircle with Deep Green Texture -->
  <rect width="512" height="512" rx="112" fill="url(#loveBgRadial)"/>

  <!-- Checkerboard / Diamond Quilted Pattern -->
  <g opacity="0.25" stroke="#22c55e" stroke-width="1.2" fill="none">
    <path d="M-60 256 L256 -60 L572 256 L256 572 Z" />
    <path d="M0 256 L256 0 L512 256 L256 512 Z" />
    <path d="M64 256 L256 64 L448 256 L256 448 Z" />
    <path d="M128 256 L256 128 L384 256 L256 384 Z" />
    <path d="M192 256 L256 192 L320 256 L256 320 Z" />
    <line x1="64" y1="0" x2="512" y2="448" />
    <line x1="0" y1="64" x2="448" y2="512" />
    <line x1="0" y1="192" x2="320" y2="512" />
    <line x1="192" y1="0" x2="512" y2="320" />
    <line x1="448" y1="0" x2="0" y2="448" />
    <line x1="512" y1="64" x2="64" y2="512" />
    <line x1="320" y1="0" x2="0" y2="320" />
    <line x1="512" y1="192" x2="192" y2="512" />
  </g>

  <!-- Outer Rounded Neon Green Accent Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#22c55e" stroke-width="4.5" opacity="0.4"/>

  <!-- Center Rotated Diamond Plate with Neon Green Glow Border -->
  <g filter="url(#loveMainShadow)">
    <rect x="76" y="76" width="360" height="360" rx="44" transform="rotate(45 256 256)" fill="url(#loveDiamondGrad)" stroke="#22c55e" stroke-width="5" stroke-opacity="0.85"/>
  </g>

  <!-- ==================== 3D "LOVE" TOP SECTION ==================== -->
  
  <!-- Group for LOVE with Drop Shadow -->
  <g filter="url(#loveMainShadow)">
    
    <!-- ========== LETTER 'L' ========== -->
    <!-- 3D Extrusions -->
    <path d="M72 116 L124 116 L124 196 L154 196 L154 246 L72 246 Z" fill="#4a1800"/>
    <path d="M72 116 L88 100 L140 100 L140 180 L170 180 L170 230 L154 246 L154 196 L124 196 L124 116 Z" fill="url(#loveGoldBevel)"/>
    <path d="M70 114 L122 114 L122 194 L152 194 L152 244 L70 244 Z" fill="#e65100"/>
    <!-- Front Face -->
    <path d="M68 112 L120 112 L120 192 L150 192 L150 242 L68 242 Z" fill="url(#loveGoldFace)" stroke="#ffe082" stroke-width="2"/>
    <!-- Top Highlights -->
    <rect x="72" y="115" width="44" height="6" fill="#ffffff" opacity="0.75" rx="3"/>

    <!-- ========== LETTER 'O' -> GOLDEN DISC + GLOSSY RUBY HEART ========== -->
    <!-- Gold Medallion Outer Coin Shadow & Rim -->
    <circle cx="204" cy="180" r="62" fill="#3e1b00"/>
    <circle cx="204" cy="178" r="61" fill="#b26a00"/>
    <circle cx="204" cy="176" r="59" fill="url(#loveCoinGrad)" stroke="#ffecb3" stroke-width="3"/>
    
    <!-- Coin Inner Inset Ring -->
    <circle cx="204" cy="176" r="48" fill="none" stroke="#e65100" stroke-width="3" opacity="0.6"/>

    <!-- 3D Glossy Ruby Heart -->
    <g filter="url(#loveHeartGlow)">
      <!-- Heart Dark 3D Depth Shadow -->
      <path d="M204 222 C186 206 156 182 156 156 C156 138 170 126 188 126 C198 126 204 134 204 134 C204 134 210 126 220 126 C238 126 252 138 252 156 C252 182 222 206 204 222 Z" fill="#3a000a" transform="translate(0, 6)"/>
      
      <!-- Heart Main Body -->
      <path d="M204 220 C186 204 156 180 156 154 C156 136 170 124 188 124 C198 124 204 132 204 132 C204 132 210 124 220 124 C238 124 252 136 252 154 C252 180 222 204 204 220 Z" fill="url(#loveHeartGrad)" stroke="#ffcdd2" stroke-width="2.5"/>

      <!-- Heart Left Top Gloss Highlight -->
      <ellipse cx="178" cy="144" rx="10" ry="7" transform="rotate(-30 178 144)" fill="#ffffff" opacity="0.75"/>
      <!-- Heart Small Bottom Gloss -->
      <circle cx="172" cy="158" r="3.5" fill="#ffffff" opacity="0.6"/>

      <!-- Golden Sparkle Star on Heart -->
      <path d="M228 146 Q228 154 236 154 Q228 154 228 162 Q228 154 220 154 Q228 154 228 146 Z" fill="#ffffff"/>
      <path d="M228 148 Q228 154 234 154 Q228 154 228 160 Q228 154 222 154 Q228 154 228 148 Z" fill="#fff59d"/>
    </g>


    <!-- ========== LETTER 'V' ========== -->
    <!-- 3D Extrusions -->
    <path d="M276 116 L310 116 L332 192 L354 116 L388 116 L350 246 L314 246 Z" fill="#4a1800"/>
    <path d="M276 116 L292 100 L326 100 L346 176 L366 100 L400 100 L388 116 L354 116 L332 192 L310 116 Z" fill="url(#loveGoldBevel)"/>
    <path d="M274 114 L308 114 L330 190 L352 114 L386 114 L348 244 L312 244 Z" fill="#e65100"/>
    <!-- Front Face -->
    <path d="M272 112 L306 112 L328 188 L350 112 L384 112 L346 242 L310 242 Z" fill="url(#loveGoldFace)" stroke="#ffe082" stroke-width="2"/>
    <!-- Top Highlights -->
    <rect x="276" y="115" width="28" height="5" fill="#ffffff" opacity="0.75" rx="2.5"/>
    <rect x="352" y="115" width="28" height="5" fill="#ffffff" opacity="0.75" rx="2.5"/>


    <!-- ========== LETTER 'E' ========== -->
    <!-- 3D Extrusions -->
    <path d="M396 116 L456 116 L456 156 L426 156 L426 168 L452 168 L452 200 L426 200 L426 208 L458 208 L458 246 L396 246 Z" fill="#4a1800"/>
    <path d="M396 116 L412 100 L472 100 L472 140 L456 156 L456 116 Z" fill="url(#loveGoldBevel)"/>
    <path d="M394 114 L454 114 L454 154 L424 154 L424 166 L450 166 L450 198 L424 198 L424 206 L456 206 L456 244 L394 244 Z" fill="#e65100"/>
    <!-- Front Face -->
    <path d="M392 112 L452 112 L452 152 L422 152 L422 164 L448 164 L448 196 L422 196 L422 204 L454 204 L454 242 L392 242 Z" fill="url(#loveGoldFace)" stroke="#ffe082" stroke-width="2"/>
    <!-- Top Highlight -->
    <rect x="396" y="115" width="52" height="5" fill="#ffffff" opacity="0.75" rx="2.5"/>

    <!-- Gold Sparkles near LOVE -->
    <path d="M46 206 Q46 216 56 216 Q46 216 46 226 Q46 216 36 216 Q46 216 46 206 Z" fill="#fff59d"/>
    <path d="M324 218 Q324 225 330 225 Q324 225 324 232 Q324 225 318 225 Q324 225 324 218 Z" fill="#ffffff"/>
  </g>


  <!-- ==================== 5-SLOT "RUMMY" CYLINDER REEL ==================== -->
  <g filter="url(#loveMainShadow)">
    <!-- Slot Roller Outer Dark Rim -->
    <rect x="36" y="270" width="440" height="136" rx="68" fill="#011b10" stroke="#000000" stroke-width="6"/>

    <!-- Shiny Chrome Green Rim -->
    <rect x="40" y="274" width="432" height="128" rx="64" fill="url(#loveReelGreenFrame)" stroke="#166534" stroke-width="2"/>

    <!-- 5-Slot White/Silver Cylinder Reel Body -->
    <rect x="48" y="282" width="416" height="112" rx="56" fill="url(#loveReelSilverCylinder)"/>

    <!-- 5 Individual Reel Column Dividers -->
    <!-- Col 1 (R) / Col 2 (U) -->
    <path d="M128 282 L128 394" stroke="#94a3b8" stroke-width="3.5" opacity="0.75"/>
    <path d="M131 282 L131 394" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Col 2 (U) / Col 3 (M) -->
    <path d="M212 282 L212 394" stroke="#94a3b8" stroke-width="3.5" opacity="0.75"/>
    <path d="M215 282 L215 394" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Col 3 (M) / Col 4 (M) -->
    <path d="M298 282 L298 394" stroke="#94a3b8" stroke-width="3.5" opacity="0.75"/>
    <path d="M301 282 L301 394" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Col 4 (M) / Col 5 (Y) -->
    <path d="M382 282 L382 394" stroke="#94a3b8" stroke-width="3.5" opacity="0.75"/>
    <path d="M385 282 L385 394" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Reel Cylindrical Gloss Highlight (Top white reflection) -->
    <rect x="68" y="286" width="376" height="20" rx="10" fill="#ffffff" opacity="0.75"/>
    <rect x="78" y="290" width="356" height="6" rx="3" fill="#ffffff" opacity="0.95"/>

    <!-- Bottom subtle reflection -->
    <rect x="88" y="376" width="336" height="8" rx="4" fill="#ffffff" opacity="0.3"/>

    <!-- ==================== 5 EMERALD GREEN BOLD LETTERS: R - U - M - M - Y ==================== -->
    
    <!-- LETTER 1: "R" (x: 88) -->
    <g>
      <text x="88" y="376" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">R</text>
      <text x="88" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">R</text>
      <text x="88" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="url(#loveRummyGreenGrad)">R</text>
    </g>

    <!-- LETTER 2: "U" (x: 170) -->
    <g>
      <text x="170" y="376" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">U</text>
      <text x="170" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">U</text>
      <text x="170" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="url(#loveRummyGreenGrad)">U</text>
    </g>

    <!-- LETTER 3: "M" (x: 255) -->
    <g>
      <text x="255" y="376" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">M</text>
      <text x="255" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">M</text>
      <text x="255" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="url(#loveRummyGreenGrad)">M</text>
    </g>

    <!-- LETTER 4: "M" (x: 340) -->
    <g>
      <text x="340" y="376" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">M</text>
      <text x="340" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">M</text>
      <text x="340" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="url(#loveRummyGreenGrad)">M</text>
    </g>

    <!-- LETTER 5: "Y" (x: 424) -->
    <g>
      <text x="424" y="376" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">Y</text>
      <text x="424" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">Y</text>
      <text x="424" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="url(#loveRummyGreenGrad)">Y</text>
    </g>
  </g>
</svg>

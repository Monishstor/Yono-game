<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient (Deep Luxury Black/Gold) -->
    <radialGradient id="dhanBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1c1611"/>
      <stop offset="60%" stop-color="#0e0b08"/>
      <stop offset="100%" stop-color="#050403"/>
    </radialGradient>

    <!-- Outer Golden Bevel Border Gradient -->
    <linearGradient id="dhanGoldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe885"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="75%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- 3D "DHAN" Gold Face Gradient -->
    <linearGradient id="dhanTextGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8a6"/>
      <stop offset="20%" stop-color="#fed035"/>
      <stop offset="60%" stop-color="#eab308"/>
      <stop offset="85%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>

    <linearGradient id="dhanTextStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Crown Gold Gradient -->
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff4b8"/>
      <stop offset="30%" stop-color="#facc15"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <!-- Ruby Gem Gradient -->
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b7b"/>
      <stop offset="35%" stop-color="#dc2626"/>
      <stop offset="75%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>

    <!-- Slot Machine Cylinder Background (Red) -->
    <linearGradient id="reelRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6d0b0b"/>
      <stop offset="25%" stop-color="#b91c1c"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="75%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>

    <!-- Silver 3D Text Gradient for "GAME" -->
    <linearGradient id="gameSilver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="75%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <linearGradient id="gameSilverStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Deep Drop Shadow -->
    <filter id="dhanShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.8"/>
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Rounded Squircle Container -->
  <rect width="512" height="512" rx="112" fill="url(#dhanBg)"/>

  <!-- Outer Heavy Golden Beveled Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#dhanGoldBorder)" stroke-width="16"/>
  <rect x="20" y="20" width="472" height="472" rx="92" fill="none" stroke="#fef08a" stroke-width="2" opacity="0.6"/>

  <!-- Luxury Quilted Diamond Crosshatch Pattern -->
  <g opacity="0.25" stroke="#f59e0b" stroke-width="1.5" fill="none">
    <path d="M-60 256 L256 -60 L572 256 L256 572 Z" />
    <path d="M0 256 L256 0 L512 256 L256 512 Z" />
    <path d="M64 256 L256 64 L448 256 L256 448 Z" />
    <path d="M128 256 L256 128 L384 256 L256 384 Z" />
    <path d="M192 256 L256 192 L320 256 L256 320 Z" />
    <!-- Reverse diagonal grid lines -->
    <line x1="64" y1="0" x2="512" y2="448" />
    <line x1="0" y1="64" x2="448" y2="512" />
    <line x1="0" y1="192" x2="320" y2="512" />
    <line x1="192" y1="0" x2="512" y2="320" />
    <line x1="448" y1="0" x2="0" y2="448" />
    <line x1="512" y1="64" x2="64" y2="512" />
    <line x1="320" y1="0" x2="0" y2="320" />
    <line x1="512" y1="192" x2="192" y2="512" />
  </g>

  <!-- Tiny Gold Stitching Dots on Grid -->
  <g fill="#fef08a" opacity="0.4">
    <circle cx="256" cy="64" r="3"/>
    <circle cx="256" cy="128" r="3"/>
    <circle cx="256" cy="192" r="3"/>
    <circle cx="256" cy="320" r="3"/>
    <circle cx="256" cy="384" r="3"/>
    <circle cx="256" cy="448" r="3"/>
    <circle cx="192" cy="128" r="3"/>
    <circle cx="320" cy="128" r="3"/>
    <circle cx="128" cy="192" r="3"/>
    <circle cx="384" cy="192" r="3"/>
    <circle cx="64" cy="256" r="3"/>
    <circle cx="448" cy="256" r="3"/>
  </g>

  <!-- ================= TOP ROYAL GOLDEN CROWN ================= -->
  <g filter="url(#dhanShadow)" transform="translate(0, -6)">
    <!-- Crown Base Spikes -->
    <path d="M 148 152 
             L 168 84 
             L 212 120 
             L 256 42 
             L 300 120 
             L 344 84 
             L 364 152 
             Z" 
          fill="url(#crownGrad)" 
          stroke="#451a03" 
          stroke-width="5"
          stroke-linejoin="round"
    />

    <!-- Crown Arched Base Band -->
    <path d="M 144 146 Q 256 166 368 146 L 366 164 Q 256 184 146 164 Z" fill="url(#crownGrad)" stroke="#451a03" stroke-width="3"/>

    <!-- Pearl Jewels on 5 Spikes -->
    <circle cx="168" cy="80" r="9" fill="#fef08a" stroke="#d97706" stroke-width="2"/>
    <circle cx="212" cy="116" r="7" fill="#fef08a" stroke="#d97706" stroke-width="2"/>
    <circle cx="256" cy="38" r="12" fill="#fff" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="300" cy="116" r="7" fill="#fef08a" stroke="#d97706" stroke-width="2"/>
    <circle cx="344" cy="80" r="9" fill="#fef08a" stroke="#d97706" stroke-width="2"/>

    <!-- Center Ruby Diamond on Crown -->
    <polygon points="256,66 270,86 256,106 242,86" fill="url(#rubyGrad)" stroke="#fff" stroke-width="2"/>
    <!-- Left & Right Ruby Diamonds on Crown -->
    <polygon points="190,118 198,130 190,142 182,130" fill="url(#rubyGrad)" stroke="#fff" stroke-width="1.5"/>
    <polygon points="322,118 330,130 322,142 314,130" fill="url(#rubyGrad)" stroke="#fff" stroke-width="1.5"/>

    <!-- Jewels on Band -->
    <circle cx="180" cy="157" r="5" fill="url(#rubyGrad)" stroke="#fff" stroke-width="1"/>
    <circle cx="220" cy="162" r="5" fill="url(#rubyGrad)" stroke="#fff" stroke-width="1"/>
    <circle cx="256" cy="164" r="6" fill="url(#rubyGrad)" stroke="#fff" stroke-width="1.5"/>
    <circle cx="292" cy="162" r="5" fill="url(#rubyGrad)" stroke="#fff" stroke-width="1"/>
    <circle cx="332" cy="157" r="5" fill="url(#rubyGrad)" stroke="#fff" stroke-width="1"/>

    <!-- Sparkle on Crown Top -->
    <g transform="translate(332, 70)">
      <path d="M0 -18 Q1.5 -3 18 0 Q1.5 3 0 18 Q-1.5 3 -18 0 Q-1.5 -3 0 -18 Z" fill="#ffffff" />
      <circle cx="0" cy="0" r="3" fill="#fff" />
    </g>
  </g>

  <!-- ================= 3D GOLDEN "DHAN" TEXT ================= -->
  <g filter="url(#dhanShadow)">
    <!-- 3D Extrusion Shadows (Layered for Depth) -->
    <text x="256" y="278" font-family="'Impact', 'Arial Black', sans-serif" font-size="132" font-weight="900" text-anchor="middle" fill="#3a1300" letter-spacing="6">DHAN</text>
    <text x="256" y="274" font-family="'Impact', 'Arial Black', sans-serif" font-size="132" font-weight="900" text-anchor="middle" fill="#571c00" letter-spacing="6">DHAN</text>
    <text x="256" y="270" font-family="'Impact', 'Arial Black', sans-serif" font-size="132" font-weight="900" text-anchor="middle" fill="#782700" letter-spacing="6">DHAN</text>
    <text x="256" y="266" font-family="'Impact', 'Arial Black', sans-serif" font-size="132" font-weight="900" text-anchor="middle" fill="#993400" letter-spacing="6">DHAN</text>
    <text x="256" y="262" font-family="'Impact', 'Arial Black', sans-serif" font-size="132" font-weight="900" text-anchor="middle" fill="#b94300" letter-spacing="6">DHAN</text>
    <text x="256" y="258" font-family="'Impact', 'Arial Black', sans-serif" font-size="132" font-weight="900" text-anchor="middle" fill="#d95800" letter-spacing="6">DHAN</text>

    <!-- Main Beveled Gold Face of DHAN -->
    <text x="256" y="254" font-family="'Impact', 'Arial Black', sans-serif" font-size="132" font-weight="900" text-anchor="middle" fill="url(#dhanTextGold)" stroke="url(#dhanTextStroke)" stroke-width="6" stroke-linejoin="round" letter-spacing="6">DHAN</text>
  </g>

  <!-- ================= SLOT MACHINE CYLINDER FOR "GAME" ================= -->
  <g filter="url(#dhanShadow)">
    <!-- Slot Reel Outer Gold Frame -->
    <rect x="42" y="284" width="428" height="152" rx="44" fill="url(#dhanGoldBorder)" stroke="#451a03" stroke-width="8"/>

    <!-- Inner Red Cylinder Drum -->
    <rect x="54" y="296" width="404" height="128" rx="34" fill="url(#reelRed)" stroke="#78350f" stroke-width="4"/>

    <!-- 4 Reel Segment Golden Dividers -->
    <line x1="152" y1="298" x2="152" y2="422" stroke="url(#dhanGoldBorder)" stroke-width="6"/>
    <line x1="256" y1="298" x2="256" y2="422" stroke="url(#dhanGoldBorder)" stroke-width="6"/>
    <line x1="360" y1="298" x2="360" y2="422" stroke="url(#dhanGoldBorder)" stroke-width="6"/>

    <!-- Cylinder Highlight Gloss -->
    <rect x="60" y="302" width="392" height="16" rx="8" fill="#ffffff" opacity="0.45"/>
    <rect x="60" y="400" width="392" height="16" rx="8" fill="#000000" opacity="0.45"/>

    <!-- Side Golden Hubs / Knobs with Rubies -->
    <!-- Left Knob -->
    <circle cx="52" cy="360" r="28" fill="url(#dhanGoldBorder)" stroke="#451a03" stroke-width="4"/>
    <polygon points="52,342 66,360 52,378 38,360" fill="url(#rubyGrad)" stroke="#fff" stroke-width="1.5"/>

    <!-- Right Knob -->
    <circle cx="460" cy="360" r="28" fill="url(#dhanGoldBorder)" stroke="#451a03" stroke-width="4"/>
    <polygon points="460,342 474,360 460,378 446,360" fill="url(#rubyGrad)" stroke="#fff" stroke-width="1.5"/>

    <!-- Slot Machine Handle Lever (Top Right) -->
    <path d="M 466 338 L 490 268" stroke="url(#dhanGoldBorder)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="494" cy="260" r="16" fill="url(#rubyGrad)" stroke="url(#dhanGoldBorder)" stroke-width="4"/>
    <circle cx="490" cy="256" r="4" fill="#ffffff" opacity="0.8"/>

    <!-- ================= 3D SILVER "G A M E" TEXT ================= -->
    <!-- G -->
    <text x="103" y="394" font-family="'Impact', 'Arial Black', sans-serif" font-size="88" font-weight="900" text-anchor="middle" fill="#0f172a">G</text>
    <text x="103" y="390" font-family="'Impact', 'Arial Black', sans-serif" font-size="88" font-weight="900" text-anchor="middle" fill="url(#gameSilver)" stroke="url(#gameSilverStroke)" stroke-width="3">G</text>

    <!-- A -->
    <text x="204" y="394" font-family="'Impact', 'Arial Black', sans-serif" font-size="88" font-weight="900" text-anchor="middle" fill="#0f172a">A</text>
    <text x="204" y="390" font-family="'Impact', 'Arial Black', sans-serif" font-size="88" font-weight="900" text-anchor="middle" fill="url(#gameSilver)" stroke="url(#gameSilverStroke)" stroke-width="3">A</text>

    <!-- M -->
    <text x="308" y="394" font-family="'Impact', 'Arial Black', sans-serif" font-size="88" font-weight="900" text-anchor="middle" fill="#0f172a">M</text>
    <text x="308" y="390" font-family="'Impact', 'Arial Black', sans-serif" font-size="88" font-weight="900" text-anchor="middle" fill="url(#gameSilver)" stroke="url(#gameSilverStroke)" stroke-width="3">M</text>

    <!-- E -->
    <text x="410" y="394" font-family="'Impact', 'Arial Black', sans-serif" font-size="88" font-weight="900" text-anchor="middle" fill="#0f172a">E</text>
    <text x="410" y="390" font-family="'Impact', 'Arial Black', sans-serif" font-size="88" font-weight="900" text-anchor="middle" fill="url(#gameSilver)" stroke="url(#gameSilverStroke)" stroke-width="3">E</text>
  </g>

  <!-- ================= BOTTOM ORNATE FILIGREE & RUBY DIAMOND ================= -->
  <g filter="url(#dhanShadow)" transform="translate(0, 10)">
    <!-- Filigree Golden Scroll Curves -->
    <path d="M 120 440 Q 180 470 236 450 Q 256 478 276 450 Q 332 470 392 440" fill="none" stroke="url(#dhanGoldBorder)" stroke-width="6" stroke-linecap="round"/>
    <path d="M 160 450 Q 210 472 256 462 Q 302 472 352 450" fill="none" stroke="url(#dhanGoldBorder)" stroke-width="4" stroke-linecap="round"/>

    <!-- Center Ruby Diamond Badge -->
    <polygon points="256,432 278,458 256,484 234,458" fill="url(#rubyGrad)" stroke="url(#dhanGoldBorder)" stroke-width="4"/>
    <polygon points="256,438 272,458 256,478 240,458" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
  </g>
</svg>

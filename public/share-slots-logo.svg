<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient (Rich Emerald Green) -->
    <radialGradient id="shareBgRadial" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#05532b"/>
      <stop offset="40%" stop-color="#03381d"/>
      <stop offset="75%" stop-color="#022312"/>
      <stop offset="100%" stop-color="#01130a"/>
    </radialGradient>

    <!-- Quilted Diamond Pattern -->
    <pattern id="quiltedDiamond" width="48" height="48" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="48" height="48" fill="none" stroke="#085a30" stroke-width="1.8" opacity="0.45"/>
      <circle cx="24" cy="24" r="2.5" fill="#10b981" opacity="0.3"/>
    </pattern>

    <!-- Center Diamond Gradient -->
    <linearGradient id="centerDiamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#085e33"/>
      <stop offset="50%" stop-color="#043a1e"/>
      <stop offset="100%" stop-color="#022413"/>
    </linearGradient>

    <!-- Glowing Diamond Border Gradient -->
    <linearGradient id="diamondBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Outer Squircle Rim Gradient -->
    <linearGradient id="outerRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#059669" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#022c17" stop-opacity="0.8"/>
    </linearGradient>

    <!-- 3D "SHARE" Gold Gradient -->
    <linearGradient id="shareGoldFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="15%" stop-color="#fffb99"/>
      <stop offset="45%" stop-color="#ffcc00"/>
      <stop offset="80%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>

    <!-- Reel 3D Cylindrical Metallic Gradient -->
    <linearGradient id="reelCylinderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="8%" stop-color="#94a3b8"/>
      <stop offset="22%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="78%" stop-color="#cbd5e1"/>
      <stop offset="92%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Reel Outer Metallic Border Gradient -->
    <linearGradient id="reelBorderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="30%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- "SLOTS" Letter Deep Green Gradient -->
    <linearGradient id="slotsGreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a6b3b"/>
      <stop offset="40%" stop-color="#054a27"/>
      <stop offset="80%" stop-color="#03351b"/>
      <stop offset="100%" stop-color="#022412"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="mainShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="sparkleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Background Squircle Base -->
  <rect width="512" height="512" rx="104" fill="url(#shareBgRadial)"/>

  <!-- 2. Quilted Diamond Texture Overlay -->
  <rect width="512" height="512" rx="104" fill="url(#quiltedDiamond)"/>

  <!-- 3. Outer Subtle Squircle Rim -->
  <rect x="8" y="8" width="496" height="496" rx="96" fill="none" stroke="url(#outerRimGrad)" stroke-width="4"/>
  <rect x="14" y="14" width="484" height="484" rx="90" fill="none" stroke="#000000" stroke-width="2" opacity="0.6"/>

  <!-- 4. Center Rotated Green Diamond Frame with Glow -->
  <g filter="url(#mainShadow)">
    <!-- Outer Diamond Glow/Stroke -->
    <rect x="126" y="126" width="260" height="260" rx="34" transform="rotate(45 256 256)" fill="url(#centerDiamondGrad)" stroke="url(#diamondBorderGrad)" stroke-width="8"/>
    <!-- Inner Diamond Inset Line -->
    <rect x="134" y="134" width="244" height="244" rx="28" transform="rotate(45 256 256)" fill="none" stroke="#6ee7b7" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- ========================================================
       5. 3D GOLDEN "SHARE" TYPOGRAPHY
  ======================================================== -->
  <g filter="url(#mainShadow)">
    <!-- Deep Dark Base Shadow -->
    <text x="256" y="238" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="124" letter-spacing="1" fill="#1b0800" stroke="#1b0800" stroke-width="16" stroke-linejoin="round">SHARE</text>

    <!-- Deep Red-Brown Extrusion -->
    <text x="256" y="234" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="124" letter-spacing="1" fill="#7c2d12" stroke="#7c2d12" stroke-width="14" stroke-linejoin="round">SHARE</text>

    <!-- Warm Amber-Orange Bevel Layer -->
    <text x="256" y="228" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="124" letter-spacing="1" fill="#c2410c" stroke="#c2410c" stroke-width="10" stroke-linejoin="round">SHARE</text>
    <text x="256" y="222" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="124" letter-spacing="1" fill="#d97706" stroke="#d97706" stroke-width="6" stroke-linejoin="round">SHARE</text>
    <text x="256" y="216" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="124" letter-spacing="1" fill="#f59e0b" stroke="#f59e0b" stroke-width="3" stroke-linejoin="round">SHARE</text>

    <!-- Bright Glossy Golden Face -->
    <text x="256" y="214" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="124" letter-spacing="1" fill="url(#shareGoldFace)" stroke="#ffffff" stroke-width="2" stroke-linejoin="round">SHARE</text>
  </g>

  <!-- Golden Flare Sparkle on 'E' -->
  <g transform="translate(390, 142)" filter="url(#sparkleGlow)">
    <!-- 4-point star -->
    <path d="M0 -22 Q2 -2 22 0 Q2 2 0 22 Q-2 2 -22 0 Q-2 -2 0 -22 Z" fill="#ffffff"/>
    <path d="M0 -12 Q1 -1 12 0 Q1 1 0 12 Q-1 1 -12 0 Q-1 -1 0 -12 Z" fill="#fef08a"/>
    <circle cx="0" cy="0" r="3.5" fill="#ffffff"/>
  </g>

  <!-- ========================================================
       6. 3D METALLIC SLOT MACHINE REEL "SLOTS"
  ======================================================== -->
  <g filter="url(#mainShadow)">
    <!-- Reel Outer Capsule Shadow -->
    <rect x="36" y="260" width="440" height="128" rx="64" fill="#000000" opacity="0.6"/>

    <!-- Reel Metallic Frame Outer Rim -->
    <rect x="34" y="256" width="444" height="132" rx="66" fill="url(#reelBorderGrad)" stroke="#1e293b" stroke-width="4"/>

    <!-- Reel Cylinder Body -->
    <rect x="42" y="262" width="428" height="120" rx="60" fill="url(#reelCylinderGrad)"/>

    <!-- Cylindrical Top Glass Highlight -->
    <path d="M102 270 Q256 266 410 270" stroke="#ffffff" stroke-width="6" opacity="0.85" stroke-linecap="round"/>

    <!-- 4 Vertical Reel Dividers (5 Slot Columns) -->
    <!-- Col 1 / Col 2 Divider -->
    <g transform="translate(126, 262)">
      <line x1="0" y1="2" x2="0" y2="118" stroke="#334155" stroke-width="4"/>
      <line x1="2" y1="2" x2="2" y2="118" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
    </g>

    <!-- Col 2 / Col 3 Divider -->
    <g transform="translate(212, 262)">
      <line x1="0" y1="0" x2="0" y2="120" stroke="#334155" stroke-width="4"/>
      <line x1="2" y1="0" x2="2" y2="120" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
    </g>

    <!-- Col 3 / Col 4 Divider -->
    <g transform="translate(298, 262)">
      <line x1="0" y1="0" x2="0" y2="120" stroke="#334155" stroke-width="4"/>
      <line x1="2" y1="0" x2="2" y2="120" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
    </g>

    <!-- Col 4 / Col 5 Divider -->
    <g transform="translate(384, 262)">
      <line x1="0" y1="2" x2="0" y2="118" stroke="#334155" stroke-width="4"/>
      <line x1="2" y1="2" x2="2" y2="118" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
    </g>

    <!-- ==================== "SLOTS" 5 LETTERS ==================== -->
    <!-- Letter S (Slot 1: Center ~ 84) -->
    <g>
      <text x="84" y="348" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="76" fill="#011f0f" stroke="#011f0f" stroke-width="6" stroke-linejoin="round">S</text>
      <text x="84" y="344" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="76" fill="url(#slotsGreenGrad)" stroke="#10b981" stroke-width="1.5">S</text>
    </g>

    <!-- Letter L (Slot 2: Center ~ 169) -->
    <g>
      <text x="169" y="348" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="76" fill="#011f0f" stroke="#011f0f" stroke-width="6" stroke-linejoin="round">L</text>
      <text x="169" y="344" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="76" fill="url(#slotsGreenGrad)" stroke="#10b981" stroke-width="1.5">L</text>
    </g>

    <!-- Letter O (Slot 3: Center ~ 255) -->
    <g>
      <text x="255" y="348" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="76" fill="#011f0f" stroke="#011f0f" stroke-width="6" stroke-linejoin="round">O</text>
      <text x="255" y="344" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="76" fill="url(#slotsGreenGrad)" stroke="#10b981" stroke-width="1.5">O</text>
    </g>

    <!-- Letter T (Slot 4: Center ~ 341) -->
    <g>
      <text x="341" y="348" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="76" fill="#011f0f" stroke="#011f0f" stroke-width="6" stroke-linejoin="round">T</text>
      <text x="341" y="344" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="76" fill="url(#slotsGreenGrad)" stroke="#10b981" stroke-width="1.5">T</text>
    </g>

    <!-- Letter S (Slot 5: Center ~ 427) -->
    <g>
      <text x="427" y="348" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="76" fill="#011f0f" stroke="#011f0f" stroke-width="6" stroke-linejoin="round">S</text>
      <text x="427" y="344" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="76" fill="url(#slotsGreenGrad)" stroke="#10b981" stroke-width="1.5">S</text>
    </g>

    <!-- Reel Lower Curve Shadow -->
    <path d="M52 360 C52 376 96 380 256 380 C416 380 460 376 460 360" stroke="#475569" stroke-width="3" opacity="0.6" fill="none"/>
  </g>
</svg>

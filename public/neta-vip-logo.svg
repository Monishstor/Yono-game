<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Emerald Green Luxury Casino Background Gradient -->
    <radialGradient id="netaBgGrad" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#0b5e39"/>
      <stop offset="45%" stop-color="#053e24"/>
      <stop offset="85%" stop-color="#022414"/>
      <stop offset="100%" stop-color="#01140b"/>
    </radialGradient>

    <!-- Center Rotated Diamond Plate Gradient -->
    <linearGradient id="netaDiamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e683f"/>
      <stop offset="50%" stop-color="#084d2d"/>
      <stop offset="100%" stop-color="#032e1a"/>
    </linearGradient>

    <!-- 3D "NETA" Gold Face Gradient -->
    <linearGradient id="netaGoldFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffed6"/>
      <stop offset="15%" stop-color="#ffea3b"/>
      <stop offset="60%" stop-color="#fdb813"/>
      <stop offset="100%" stop-color="#f27d00"/>
    </linearGradient>

    <linearGradient id="netaGoldBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ffec8b"/>
      <stop offset="75%" stop-color="#ffa000"/>
      <stop offset="100%" stop-color="#b73a00"/>
    </linearGradient>

    <!-- Slot Cylinder White/Silver Reel Gradient -->
    <linearGradient id="netaReelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="12%" stop-color="#e2e8f0"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Cylinder Outer Green Bevel Border -->
    <linearGradient id="netaReelBorderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="35%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <!-- Letters "VIP" Green Gradient -->
    <linearGradient id="netaVipTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="60%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="netaMainShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <filter id="netaTextGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="netaStarGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Icon Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#netaBgGrad)"/>

  <!-- Diamond Quilted Background Grid Lines -->
  <g opacity="0.28" stroke="#22c55e" stroke-width="1.5" fill="none">
    <path d="M-60 256 L256 -60 L572 256 L256 572 Z" />
    <path d="M0 256 L256 0 L512 256 L256 512 Z" />
    <path d="M64 256 L256 64 L448 256 L256 448 Z" />
    <path d="M128 256 L256 128 L384 256 L256 384 Z" />
    <path d="M192 256 L256 192 L320 256 L256 320 Z" />
    <line x1="64" y1="0" x2="512" y2="448" />
    <line x1="0" y1="64" x2="448" y2="512" />
    <line x1="0" y1="192" x2="320" y2="512" />
    <line x1="192" y1="0" x2="512" y2="320" />
    <line x1="448" y1="0" x2="0" y2="448" />
    <line x1="512" y1="64" x2="64" y2="512" />
    <line x1="320" y1="0" x2="0" y2="320" />
    <line x1="512" y1="192" x2="192" y2="512" />
  </g>

  <!-- Outer Rounded Green Neon Accent Line -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#22c55e" stroke-width="5" opacity="0.45"/>

  <!-- Center Rotated Diamond Plate with Neon Green Glow Border -->
  <g filter="url(#netaMainShadow)">
    <rect x="76" y="76" width="360" height="360" rx="44" transform="rotate(45 256 256)" fill="url(#netaDiamondGrad)" stroke="#22c55e" stroke-width="5" stroke-opacity="0.85"/>
  </g>

  <!-- Sparkle Stars -->
  <g filter="url(#netaStarGlow)">
    <path d="M482 222 Q482 238 498 238 Q482 238 482 254 Q482 238 466 238 Q482 238 482 222 Z" fill="#fff" />
    <path d="M482 226 Q482 238 494 238 Q482 238 482 250 Q482 238 470 238 Q482 238 482 226 Z" fill="#ffd700" />
    
    <path d="M386 102 Q386 114 398 114 Q386 114 386 126 Q386 114 374 114 Q386 114 386 102 Z" fill="#fff" />
    <path d="M386 105 Q386 114 395 114 Q386 114 386 123 Q386 114 377 114 Q386 114 386 105 Z" fill="#ffd700" />
  </g>

  <!-- ==================== 3D "NETA" TEXT HEADER ==================== -->
  <g filter="url(#netaMainShadow)">
    <!-- Deep Red/Dark Brown 3D Extrusion Shadow Layer -->
    <text x="256" y="250" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="142" letter-spacing="4" fill="#3f0e02" stroke="#3f0e02" stroke-width="16" stroke-linejoin="round">NETA</text>
    <text x="256" y="246" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="142" letter-spacing="4" fill="#601602" stroke="#601602" stroke-width="14" stroke-linejoin="round">NETA</text>
    <text x="256" y="242" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="142" letter-spacing="4" fill="#992600" stroke="#992600" stroke-width="12" stroke-linejoin="round">NETA</text>
    <text x="256" y="238" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="142" letter-spacing="4" fill="#c43800" stroke="#c43800" stroke-width="10" stroke-linejoin="round">NETA</text>

    <!-- Warm Orange Gold Border Outline -->
    <text x="256" y="234" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="142" letter-spacing="4" fill="url(#netaGoldBevel)" stroke="url(#netaGoldBevel)" stroke-width="8" stroke-linejoin="round">NETA</text>

    <!-- Crisp Yellow Gold Front Face -->
    <text x="256" y="234" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="142" letter-spacing="4" fill="url(#netaGoldFace)">NETA</text>
  </g>

  <!-- ==================== SLOT CYLINDER "VIP" PODIUM ==================== -->
  <g filter="url(#netaMainShadow)">
    <!-- Slot Roller Outer Dark Rim -->
    <rect x="24" y="260" width="464" height="128" rx="64" fill="#022414" stroke="#000000" stroke-width="6"/>

    <!-- Slot Roller Shiny Chrome Green Rim -->
    <rect x="28" y="264" width="456" height="120" rx="60" fill="url(#netaReelBorderGrad)" stroke="#166534" stroke-width="2"/>

    <!-- Slot Roller Inner White/Silver Gradient Body -->
    <rect x="36" y="272" width="440" height="104" rx="52" fill="url(#netaReelGrad)"/>

    <!-- Reel Section Separator Dividers (Slot Machine Columns) -->
    <path d="M128 272 L128 376" stroke="#94a3b8" stroke-width="4" opacity="0.6"/>
    <path d="M132 272 L132 376" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
    
    <path d="M228 272 L228 376" stroke="#94a3b8" stroke-width="4" opacity="0.6"/>
    <path d="M232 272 L232 376" stroke="#ffffff" stroke-width="2" opacity="0.8"/>

    <path d="M284 272 L284 376" stroke="#94a3b8" stroke-width="4" opacity="0.6"/>
    <path d="M288 272 L288 376" stroke="#ffffff" stroke-width="2" opacity="0.8"/>

    <path d="M384 272 L384 376" stroke="#94a3b8" stroke-width="4" opacity="0.6"/>
    <path d="M388 272 L388 376" stroke="#ffffff" stroke-width="2" opacity="0.8"/>

    <!-- Reel Cylindrical Gloss Highlight (Top white reflection) -->
    <rect x="52" y="276" width="408" height="18" rx="9" fill="#ffffff" opacity="0.75"/>
    <rect x="60" y="280" width="392" height="6" rx="3" fill="#ffffff" opacity="0.95"/>

    <!-- Left Spade Casino Icon -->
    <g transform="translate(80, 324) scale(1.15)">
      <!-- Spade Shadow -->
      <path d="M0 -22 C-14 -6 -18 3 -18 10 C-18 17 -13 22 -6 22 C-2 22 0 19 0 19 C0 19 2 22 6 22 C13 22 18 17 18 10 C18 3 14 -6 0 -22 Z M-3 18 L-7 27 L7 27 L3 18 Z" fill="#022c22" opacity="0.6" transform="translate(0, 2)"/>
      <!-- Spade Body -->
      <path d="M0 -22 C-14 -6 -18 3 -18 10 C-18 17 -13 22 -6 22 C-2 22 0 19 0 19 C0 19 2 22 6 22 C13 22 18 17 18 10 C18 3 14 -6 0 -22 Z" fill="#15803d" stroke="#052e16" stroke-width="1.5"/>
      <path d="M-3 18 L-7 27 L7 27 L3 18 Z" fill="#15803d" stroke="#052e16" stroke-width="1.5"/>
      <path d="M0 -18 C-10 -5 -13 2 -13 8 C-13 13 -9 17 -4 17 C-1 17 0 15 0 15 Z" fill="#4ade80" opacity="0.5"/>
    </g>

    <!-- Right Spade Casino Icon -->
    <g transform="translate(432, 324) scale(1.15)">
      <!-- Spade Shadow -->
      <path d="M0 -22 C-14 -6 -18 3 -18 10 C-18 17 -13 22 -6 22 C-2 22 0 19 0 19 C0 19 2 22 6 22 C13 22 18 17 18 10 C18 3 14 -6 0 -22 Z M-3 18 L-7 27 L7 27 L3 18 Z" fill="#022c22" opacity="0.6" transform="translate(0, 2)"/>
      <!-- Spade Body -->
      <path d="M0 -22 C-14 -6 -18 3 -18 10 C-18 17 -13 22 -6 22 C-2 22 0 19 0 19 C0 19 2 22 6 22 C13 22 18 17 18 10 C18 3 14 -6 0 -22 Z" fill="#15803d" stroke="#052e16" stroke-width="1.5"/>
      <path d="M-3 18 L-7 27 L7 27 L3 18 Z" fill="#15803d" stroke="#052e16" stroke-width="1.5"/>
      <path d="M0 -18 C-10 -5 -13 2 -13 8 C-13 13 -9 17 -4 17 C-1 17 0 15 0 15 Z" fill="#4ade80" opacity="0.5"/>
    </g>

    <!-- 3D "VIP" Text -->
    <!-- Extruded Green Outline -->
    <text x="256" y="360" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" letter-spacing="12" fill="#011b14" stroke="#011b14" stroke-width="8" stroke-linejoin="round">VIP</text>

    <!-- Light Bevel Outer Layer -->
    <text x="256" y="356" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" letter-spacing="12" fill="#15803d" stroke="#4ade80" stroke-width="4" stroke-linejoin="round">VIP</text>

    <!-- Rich Emerald Gradient Face -->
    <text x="256" y="356" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" letter-spacing="12" fill="url(#netaVipTextGrad)">VIP</text>
  </g>
</svg>

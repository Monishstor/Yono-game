<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Emerald Green Quilted Background Gradient -->
    <radialGradient id="indBgRadial" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#0b5e39"/>
      <stop offset="40%" stop-color="#054425"/>
      <stop offset="80%" stop-color="#022414"/>
      <stop offset="100%" stop-color="#011209"/>
    </radialGradient>

    <!-- Center Rotated Diamond Plate Gradient -->
    <linearGradient id="indDiamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f6b41"/>
      <stop offset="50%" stop-color="#084d2d"/>
      <stop offset="100%" stop-color="#032a18"/>
    </linearGradient>

    <!-- 3D "IND" Typography Gradients -->
    <linearGradient id="indGoldFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffde7"/>
      <stop offset="15%" stop-color="#fff176"/>
      <stop offset="50%" stop-color="#fbc02d"/>
      <stop offset="85%" stop-color="#f57f17"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="indGoldBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fff59d"/>
      <stop offset="65%" stop-color="#ffa000"/>
      <stop offset="100%" stop-color="#8a2b00"/>
    </linearGradient>

    <!-- Slot Roller Outer Metallic Green Frame -->
    <linearGradient id="indReelGreenFrame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#16a34a"/>
      <stop offset="85%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>

    <!-- Slot Reel Body (White/Silver Cylinder) -->
    <linearGradient id="indReelSilverCylinder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="12%" stop-color="#e2e8f0"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Emerald Green "CLUB" Letter Face Gradient -->
    <linearGradient id="indClubGreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="30%" stop-color="#059669"/>
      <stop offset="70%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="indMainShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <filter id="indStarGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Squircle with Deep Green Texture -->
  <rect width="512" height="512" rx="112" fill="url(#indBgRadial)"/>

  <!-- Checkerboard / Diamond Quilted Pattern -->
  <g opacity="0.25" stroke="#22c55e" stroke-width="1.2" fill="none">
    <path d="M-60 256 L256 -60 L572 256 L256 572 Z" />
    <path d="M0 256 L256 0 L512 256 L256 512 Z" />
    <path d="M64 256 L256 64 L448 256 L256 448 Z" />
    <path d="M128 256 L256 128 L384 256 L256 384 Z" />
    <path d="M192 256 L256 192 L320 256 L256 320 Z" />
    <line x1="64" y1="0" x2="512" y2="448" />
    <line x1="0" y1="64" x2="448" y2="512" />
    <line x1="0" y1="192" x2="320" y2="512" />
    <line x1="192" y1="0" x2="512" y2="320" />
    <line x1="448" y1="0" x2="0" y2="448" />
    <line x1="512" y1="64" x2="64" y2="512" />
    <line x1="320" y1="0" x2="0" y2="320" />
    <line x1="512" y1="192" x2="192" y2="512" />
  </g>

  <!-- Outer Rounded Neon Green Accent Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#22c55e" stroke-width="4.5" opacity="0.4"/>

  <!-- Center Rotated Diamond Plate with Neon Green Glow Border -->
  <g filter="url(#indMainShadow)">
    <rect x="76" y="76" width="360" height="360" rx="44" transform="rotate(45 256 256)" fill="url(#indDiamondGrad)" stroke="#22c55e" stroke-width="5" stroke-opacity="0.85"/>
  </g>

  <!-- Sparkle Star near IND text (top right of D) -->
  <g filter="url(#indStarGlow)">
    <path d="M326 198 Q326 212 340 212 Q326 212 326 226 Q326 212 312 212 Q326 212 326 198 Z" fill="#ffffff" />
    <path d="M326 201 Q326 212 336 212 Q326 212 326 223 Q326 212 316 212 Q326 212 326 201 Z" fill="#ffd700" />
  </g>

  <!-- ==================== 3D "IND" BOLD TYPOGRAPHY ==================== -->
  <g filter="url(#indMainShadow)">
    <!-- Deep Crimson/Brown 3D Extrusion Shadow Layers -->
    <text x="256" y="248" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="160" letter-spacing="4" fill="#3b0800" stroke="#3b0800" stroke-width="22" stroke-linejoin="round">IND</text>
    <text x="256" y="243" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="160" letter-spacing="4" fill="#6b1200" stroke="#6b1200" stroke-width="18" stroke-linejoin="round">IND</text>
    <text x="256" y="238" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="160" letter-spacing="4" fill="#9e1e00" stroke="#9e1e00" stroke-width="14" stroke-linejoin="round">IND</text>
    <text x="256" y="233" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="160" letter-spacing="4" fill="#d82d00" stroke="#d82d00" stroke-width="10" stroke-linejoin="round">IND</text>

    <!-- Warm Golden Bevel Outline -->
    <text x="256" y="228" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="160" letter-spacing="4" fill="url(#indGoldBevel)" stroke="url(#indGoldBevel)" stroke-width="8" stroke-linejoin="round">IND</text>

    <!-- Crisp Rich Yellow Gold Front Face -->
    <text x="256" y="228" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="160" letter-spacing="4" fill="url(#indGoldFace)">IND</text>
  </g>

  <!-- ==================== 4-SLOT "CLUB" CYLINDER REEL ==================== -->
  <g filter="url(#indMainShadow)">
    <!-- Slot Roller Outer Dark Rim -->
    <rect x="36" y="260" width="440" height="136" rx="68" fill="#011b10" stroke="#000000" stroke-width="6"/>

    <!-- Shiny Chrome Green Rim -->
    <rect x="40" y="264" width="432" height="128" rx="64" fill="url(#indReelGreenFrame)" stroke="#166534" stroke-width="2"/>

    <!-- 4-Slot White/Silver Cylinder Reel Body -->
    <rect x="48" y="272" width="416" height="112" rx="56" fill="url(#indReelSilverCylinder)"/>

    <!-- 4 Individual Reel Column Dividers -->
    <!-- Col 1 (C) / Col 2 (L) -->
    <path d="M148 272 L148 384" stroke="#94a3b8" stroke-width="3.5" opacity="0.75"/>
    <path d="M151 272 L151 384" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Col 2 (L) / Col 3 (U) -->
    <path d="M254 272 L254 384" stroke="#94a3b8" stroke-width="3.5" opacity="0.75"/>
    <path d="M257 272 L257 384" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Col 3 (U) / Col 4 (B) -->
    <path d="M360 272 L360 384" stroke="#94a3b8" stroke-width="3.5" opacity="0.75"/>
    <path d="M363 272 L363 384" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Reel Cylindrical Gloss Highlight (Top white reflection) -->
    <rect x="68" y="276" width="376" height="20" rx="10" fill="#ffffff" opacity="0.75"/>
    <rect x="78" y="280" width="356" height="6" rx="3" fill="#ffffff" opacity="0.95"/>

    <!-- Bottom subtle reflection -->
    <rect x="88" y="366" width="336" height="8" rx="4" fill="#ffffff" opacity="0.3"/>

    <!-- ==================== 4 EMERALD GREEN BOLD LETTERS: C - L - U - B ==================== -->
    
    <!-- LETTER 1: "C" (x: 100) -->
    <g>
      <text x="100" y="366" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="96" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">C</text>
      <text x="100" y="362" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="96" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">C</text>
      <text x="100" y="362" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="96" fill="url(#indClubGreenGrad)">C</text>
    </g>

    <!-- LETTER 2: "L" (x: 202) -->
    <g>
      <text x="202" y="366" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="96" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">L</text>
      <text x="202" y="362" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="96" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">L</text>
      <text x="202" y="362" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="96" fill="url(#indClubGreenGrad)">L</text>
    </g>

    <!-- LETTER 3: "U" (x: 308) -->
    <g>
      <text x="308" y="366" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="96" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">U</text>
      <text x="308" y="362" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="96" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">U</text>
      <text x="308" y="362" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="96" fill="url(#indClubGreenGrad)">U</text>
    </g>

    <!-- LETTER 4: "B" (x: 412) -->
    <g>
      <text x="412" y="366" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="96" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">B</text>
      <text x="412" y="362" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="96" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">B</text>
      <text x="412" y="362" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="96" fill="url(#indClubGreenGrad)">B</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Emerald Green Quilted Background Radial Gradient -->
    <radialGradient id="arcadeBgRadial" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#0c633c"/>
      <stop offset="40%" stop-color="#064828"/>
      <stop offset="80%" stop-color="#022816"/>
      <stop offset="100%" stop-color="#01130a"/>
    </radialGradient>

    <!-- Center Rotated Diamond Plate Gradient -->
    <linearGradient id="arcadeDiamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#117547"/>
      <stop offset="50%" stop-color="#095532"/>
      <stop offset="100%" stop-color="#04311c"/>
    </linearGradient>

    <!-- 3D Gold Typography Face Gradient -->
    <linearGradient id="arcadeGoldFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="15%" stop-color="#fff59d"/>
      <stop offset="45%" stop-color="#ffd600"/>
      <stop offset="75%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>

    <!-- Slot Roller Outer Metallic Green Frame -->
    <linearGradient id="arcadeReelGreenFrame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#16a34a"/>
      <stop offset="85%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>

    <!-- Slot Reel Body (White/Silver Cylinder) -->
    <linearGradient id="arcadeReelSilverCylinder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="12%" stop-color="#e2e8f0"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Bright Green "ARCADE" Letter Face Gradient -->
    <linearGradient id="arcadeLetterGreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="40%" stop-color="#065f46"/>
      <stop offset="80%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c19"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="arcadeMainShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Base Squircle with Deep Green Texture -->
  <rect width="512" height="512" rx="112" fill="url(#arcadeBgRadial)"/>

  <!-- Checkerboard / Diamond Quilted Pattern -->
  <g opacity="0.25" stroke="#22c55e" stroke-width="1.2" fill="none">
    <path d="M-60 256 L256 -60 L572 256 L256 572 Z" />
    <path d="M0 256 L256 0 L512 256 L256 512 Z" />
    <path d="M64 256 L256 64 L448 256 L256 448 Z" />
    <path d="M128 256 L256 128 L384 256 L256 384 Z" />
    <path d="M192 256 L256 192 L320 256 L256 320 Z" />
    <line x1="64" y1="0" x2="512" y2="448" />
    <line x1="0" y1="64" x2="448" y2="512" />
    <line x1="0" y1="192" x2="320" y2="512" />
    <line x1="192" y1="0" x2="512" y2="320" />
    <line x1="448" y1="0" x2="0" y2="448" />
    <line x1="512" y1="64" x2="64" y2="512" />
    <line x1="320" y1="0" x2="0" y2="320" />
    <line x1="512" y1="192" x2="192" y2="512" />
  </g>

  <!-- Outer Rounded Neon Green Accent Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#22c55e" stroke-width="4.5" opacity="0.4"/>

  <!-- Center Rotated Diamond Plate with Neon Green Glow Border -->
  <g filter="url(#arcadeMainShadow)">
    <rect x="76" y="76" width="360" height="360" rx="44" transform="rotate(45 256 256)" fill="url(#arcadeDiamondGrad)" stroke="#22c55e" stroke-width="5" stroke-opacity="0.85"/>
  </g>

  <!-- ==================== 3D "YONO" TOP SECTION ==================== -->
  <g filter="url(#arcadeMainShadow)">
    <!-- Bottom Deep 3D Shadow -->
    <text x="256" y="232" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="142" letter-spacing="3" fill="#2d0c00" stroke="#2d0c00" stroke-width="16" stroke-linejoin="round">YONO</text>
    <!-- Extrusion Bevels -->
    <text x="256" y="226" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="142" letter-spacing="3" fill="#7c2d12" stroke="#7c2d12" stroke-width="14" stroke-linejoin="round">YONO</text>
    <text x="256" y="220" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="142" letter-spacing="3" fill="#c2410c" stroke="#c2410c" stroke-width="10" stroke-linejoin="round">YONO</text>
    <text x="256" y="215" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="142" letter-spacing="3" fill="#ea580c" stroke="#ea580c" stroke-width="8" stroke-linejoin="round">YONO</text>
    <text x="256" y="210" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="142" letter-spacing="3" fill="#f59e0b" stroke="#f59e0b" stroke-width="5" stroke-linejoin="round">YONO</text>
    <!-- Top Glowing Golden Face with Outline -->
    <text x="256" y="206" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="142" letter-spacing="3" fill="url(#arcadeGoldFace)" stroke="#fef08a" stroke-width="3" stroke-linejoin="round">YONO</text>

    <!-- Sparkle on Y (Bottom Left) -->
    <path d="M108 230 Q108 240 116 240 Q108 240 108 250 Q108 240 100 240 Q108 240 108 230 Z" fill="#ffffff"/>
    <path d="M108 232 Q108 240 114 240 Q108 240 108 248 Q108 240 102 240 Q108 240 108 232 Z" fill="#fef08a"/>

    <!-- Sparkle on N (Top Right / Center) -->
    <path d="M330 116 Q330 130 342 130 Q330 130 330 144 Q330 130 318 130 Q330 130 330 116 Z" fill="#ffffff"/>
    <path d="M330 120 Q330 130 339 130 Q330 130 330 140 Q330 130 321 130 Q330 130 330 120 Z" fill="#fef08a"/>
  </g>

  <!-- ==================== 6-SLOT "[A] [R] [C] [A] [D] [E]" CYLINDER REEL ==================== -->
  <g filter="url(#arcadeMainShadow)">
    <!-- Slot Roller Outer Dark Rim -->
    <rect x="18" y="268" width="476" height="140" rx="70" fill="#011b10" stroke="#000000" stroke-width="6"/>

    <!-- Shiny Chrome Green Rim -->
    <rect x="22" y="272" width="468" height="132" rx="66" fill="url(#arcadeReelGreenFrame)" stroke="#166534" stroke-width="2"/>

    <!-- 6-Slot White/Silver Cylinder Reel Body -->
    <rect x="30" y="280" width="452" height="116" rx="58" fill="url(#arcadeReelSilverCylinder)"/>

    <!-- 5 Reel Column Dividers for 6 Slots -->
    <!-- Col 1 (A) / Col 2 (R) -->
    <path d="M105 280 L105 396" stroke="#94a3b8" stroke-width="3" opacity="0.75"/>
    <path d="M107 280 L107 396" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Col 2 (R) / Col 3 (C) -->
    <path d="M180 280 L180 396" stroke="#94a3b8" stroke-width="3" opacity="0.75"/>
    <path d="M182 280 L182 396" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Col 3 (C) / Col 4 (A) -->
    <path d="M255 280 L255 396" stroke="#94a3b8" stroke-width="3" opacity="0.75"/>
    <path d="M257 280 L257 396" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Col 4 (A) / Col 5 (D) -->
    <path d="M330 280 L330 396" stroke="#94a3b8" stroke-width="3" opacity="0.75"/>
    <path d="M332 280 L332 396" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Col 5 (D) / Col 6 (E) -->
    <path d="M405 280 L405 396" stroke="#94a3b8" stroke-width="3" opacity="0.75"/>
    <path d="M407 280 L407 396" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Reel Cylindrical Gloss Highlight (Top white reflection) -->
    <rect x="50" y="284" width="412" height="22" rx="11" fill="#ffffff" opacity="0.75"/>
    <rect x="60" y="288" width="392" height="7" rx="3.5" fill="#ffffff" opacity="0.95"/>

    <!-- Bottom subtle reflection -->
    <rect x="70" y="378" width="372" height="8" rx="4" fill="#ffffff" opacity="0.3"/>

    <!-- ==================== 6 SLOTS: A - R - C - A - D - E ==================== -->
    
    <!-- SLOT 1: LETTER 'A' (cx: 68) -->
    <g>
      <text x="68" y="376" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">A</text>
      <text x="68" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">A</text>
      <text x="68" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="url(#arcadeLetterGreenGrad)">A</text>
    </g>

    <!-- SLOT 2: LETTER 'R' (cx: 143) -->
    <g>
      <text x="143" y="376" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">R</text>
      <text x="143" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">R</text>
      <text x="143" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="url(#arcadeLetterGreenGrad)">R</text>
    </g>

    <!-- SLOT 3: LETTER 'C' (cx: 218) -->
    <g>
      <text x="218" y="376" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">C</text>
      <text x="218" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">C</text>
      <text x="218" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="url(#arcadeLetterGreenGrad)">C</text>
    </g>

    <!-- SLOT 4: LETTER 'A' (cx: 293) -->
    <g>
      <text x="293" y="376" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">A</text>
      <text x="293" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">A</text>
      <text x="293" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="url(#arcadeLetterGreenGrad)">A</text>
    </g>

    <!-- SLOT 5: LETTER 'D' (cx: 368) -->
    <g>
      <text x="368" y="376" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">D</text>
      <text x="368" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">D</text>
      <text x="368" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="url(#arcadeLetterGreenGrad)">D</text>
    </g>

    <!-- SLOT 6: LETTER 'E' (cx: 443) -->
    <g>
      <text x="443" y="376" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">E</text>
      <text x="443" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">E</text>
      <text x="443" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="url(#arcadeLetterGreenGrad)">E</text>
    </g>
  </g>
</svg>

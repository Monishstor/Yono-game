<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Emerald Green Quilted Background Radial Gradient -->
    <radialGradient id="hiBgRadial" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#0b5e39"/>
      <stop offset="40%" stop-color="#054425"/>
      <stop offset="80%" stop-color="#022414"/>
      <stop offset="100%" stop-color="#011209"/>
    </radialGradient>

    <!-- Center Rotated Diamond Plate Gradient -->
    <linearGradient id="hiDiamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f6b41"/>
      <stop offset="50%" stop-color="#084d2d"/>
      <stop offset="100%" stop-color="#032a18"/>
    </linearGradient>

    <!-- 3D Gold Typography Face Gradient -->
    <linearGradient id="hiGoldFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="15%" stop-color="#fff59d"/>
      <stop offset="50%" stop-color="#ffd600"/>
      <stop offset="80%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>

    <!-- 3D Gold Extrusion / Bevel Gradient -->
    <linearGradient id="hiGoldBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="50%" stop-color="#ff8f00"/>
      <stop offset="100%" stop-color="#bf360c"/>
    </linearGradient>

    <!-- 3D Red Heart Radial Gradient for the dot of 'i' -->
    <radialGradient id="hiHeartGloss" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#ff5252"/>
      <stop offset="70%" stop-color="#d50000"/>
      <stop offset="100%" stop-color="#67000d"/>
    </radialGradient>

    <!-- Slot Roller Outer Metallic Green Frame -->
    <linearGradient id="hiReelGreenFrame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#16a34a"/>
      <stop offset="85%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>

    <!-- Slot Reel Body (White/Silver Cylinder) -->
    <linearGradient id="hiReelSilverCylinder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="12%" stop-color="#e2e8f0"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Emerald Green "RUMMY" Letter Face Gradient -->
    <linearGradient id="hiRummyGreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="40%" stop-color="#065f46"/>
      <stop offset="80%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c19"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="hiMainShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <filter id="hiHeartGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ff1744" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Base Squircle with Deep Green Texture -->
  <rect width="512" height="512" rx="112" fill="url(#hiBgRadial)"/>

  <!-- Checkerboard / Diamond Quilted Pattern -->
  <g opacity="0.25" stroke="#22c55e" stroke-width="1.2" fill="none">
    <path d="M-60 256 L256 -60 L572 256 L256 572 Z" />
    <path d="M0 256 L256 0 L512 256 L256 512 Z" />
    <path d="M64 256 L256 64 L448 256 L256 448 Z" />
    <path d="M128 256 L256 128 L384 256 L256 384 Z" />
    <path d="M192 256 L256 192 L320 256 L256 320 Z" />
    <line x1="64" y1="0" x2="512" y2="448" />
    <line x1="0" y1="64" x2="448" y2="512" />
    <line x1="0" y1="192" x2="320" y2="512" />
    <line x1="192" y1="0" x2="512" y2="320" />
    <line x1="448" y1="0" x2="0" y2="448" />
    <line x1="512" y1="64" x2="64" y2="512" />
    <line x1="320" y1="0" x2="0" y2="320" />
    <line x1="512" y1="192" x2="192" y2="512" />
  </g>

  <!-- Outer Rounded Neon Green Accent Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#22c55e" stroke-width="4.5" opacity="0.4"/>

  <!-- Center Rotated Diamond Plate with Neon Green Glow Border -->
  <g filter="url(#hiMainShadow)">
    <rect x="76" y="76" width="360" height="360" rx="44" transform="rotate(45 256 256)" fill="url(#hiDiamondGrad)" stroke="#22c55e" stroke-width="5" stroke-opacity="0.85"/>
  </g>

  <!-- ==================== 3D "Hi" TOP SECTION ==================== -->
  
  <g filter="url(#hiMainShadow)">
    
    <!-- ========== LETTER 'H' (3D Extruded Block) ========== -->
    <!-- 3D Shadow / Dark Bevel -->
    <path d="M130 58 L194 58 L194 126 L238 126 L238 58 L302 58 L302 248 L238 248 L238 180 L194 180 L194 248 L130 248 Z" fill="#3e1400" transform="translate(4, 6)"/>
    
    <!-- 3D Extrusion Sides -->
    <!-- Left Stem Left Bevel -->
    <polygon points="130,58 116,72 116,262 130,248" fill="#e65100"/>
    <!-- Left Stem Bottom Bevel -->
    <polygon points="130,248 116,262 180,262 194,248" fill="url(#hiGoldBevel)"/>
    <!-- Crossbar Bottom Bevel -->
    <polygon points="194,180 180,194 224,194 238,180" fill="url(#hiGoldBevel)"/>
    <!-- Right Stem Bottom Bevel -->
    <polygon points="238,248 224,262 288,262 302,248" fill="url(#hiGoldBevel)"/>
    <!-- Right Stem Top Bevel -->
    <polygon points="302,58 288,44 224,44 238,58" fill="#ffe082"/>
    <!-- Left Stem Top Bevel -->
    <polygon points="194,58 180,44 116,44 130,58" fill="#ffe082"/>
    <!-- Inner Crossbar Top Bevel -->
    <polygon points="238,126 224,112 180,112 194,126" fill="#ffd54f"/>

    <!-- Front Face 'H' -->
    <path d="M130 58 L194 58 L194 126 L238 126 L238 58 L302 58 L302 248 L238 248 L238 180 L194 180 L194 248 L130 248 Z" fill="url(#hiGoldFace)" stroke="#ffe082" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Highlights on 'H' -->
    <rect x="134" y="62" width="56" height="6" fill="#ffffff" opacity="0.8" rx="3"/>
    <rect x="242" y="62" width="56" height="6" fill="#ffffff" opacity="0.8" rx="3"/>
    <rect x="134" y="68" width="8" height="170" fill="#ffffff" opacity="0.3" rx="4"/>

    <!-- ========== LETTER 'i' (Stem + 3D Red Heart Dot) ========== -->
    
    <!-- Stem of 'i' -->
    <!-- 3D Shadow -->
    <rect x="324" y="118" width="70" height="130" rx="8" fill="#3e1400" transform="translate(4, 6)"/>
    <!-- 3D Bottom/Side Bevel -->
    <polygon points="324,248 310,262 380,262 394,248" fill="url(#hiGoldBevel)"/>
    <polygon points="324,118 310,132 310,262 324,248" fill="#e65100"/>
    <polygon points="394,118 380,104 310,104 324,118" fill="#ffe082"/>
    <!-- Front Face -->
    <rect x="324" y="118" width="70" height="130" rx="4" fill="url(#hiGoldFace)" stroke="#ffe082" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Highlight on 'i' stem -->
    <rect x="328" y="122" width="62" height="6" fill="#ffffff" opacity="0.8" rx="3"/>
    <rect x="328" y="128" width="8" height="110" fill="#ffffff" opacity="0.3" rx="4"/>

    <!-- ========== DOT OF 'i': 3D GLOSSY RED HEART ========== -->
    <g transform="translate(360, 84)" filter="url(#hiHeartGlow)">
      <!-- Heart Shadow -->
      <path d="M0 26 C-24 2 -42 16 -42 36 C-42 56 -18 78 0 94 C18 78 42 56 42 36 C42 16 24 2 0 26 Z" fill="#2d0006" transform="translate(0, 4) scale(0.85) translate(0, -36)"/>
      <!-- Heart 3D Gold/Crimson Rim -->
      <path d="M0 26 C-24 2 -42 16 -42 36 C-42 56 -18 78 0 94 C18 78 42 56 42 36 C42 16 24 2 0 26 Z" fill="#990012" stroke="#ffeb3b" stroke-width="3" transform="scale(0.85) translate(0, -36)"/>
      <!-- Heart Face -->
      <path d="M0 26 C-24 2 -42 16 -42 36 C-42 56 -18 78 0 94 C18 78 42 56 42 36 C42 16 24 2 0 26 Z" fill="url(#hiHeartGloss)" transform="scale(0.82) translate(0, -36)"/>
      <!-- Heart Top Gloss Reflection -->
      <ellipse cx="-12" cy="-14" rx="10" ry="6" transform="rotate(-30 -12 -14)" fill="#ffffff" opacity="0.85"/>
      <ellipse cx="12" cy="-14" rx="6" ry="3" transform="rotate(30 12 -14)" fill="#ffffff" opacity="0.6"/>
    </g>

    <!-- Golden Sparkles on 'Hi' -->
    <!-- Sparkle on Heart (Top Right) -->
    <path d="M394 64 Q394 74 404 74 Q394 74 394 84 Q394 74 384 74 Q394 74 394 64 Z" fill="#ffffff"/>
    <path d="M394 66 Q394 74 402 74 Q394 74 394 82 Q394 74 386 74 Q394 74 394 66 Z" fill="#fff59d"/>

    <!-- Sparkle on Left 'H' (Bottom Left) -->
    <path d="M128 184 Q128 194 138 194 Q128 194 128 204 Q128 194 118 194 Q128 194 128 184 Z" fill="#ffffff"/>
    <path d="M128 186 Q128 194 136 194 Q128 194 128 202 Q128 194 120 194 Q128 194 128 186 Z" fill="#fff59d"/>
  </g>


  <!-- ==================== 5-SLOT "[R] [U] [M] [M] [Y]" CYLINDER REEL ==================== -->
  <g filter="url(#hiMainShadow)">
    <!-- Slot Roller Outer Dark Rim -->
    <rect x="22" y="268" width="468" height="140" rx="70" fill="#011b10" stroke="#000000" stroke-width="6"/>

    <!-- Shiny Chrome Green Rim -->
    <rect x="26" y="272" width="460" height="132" rx="66" fill="url(#hiReelGreenFrame)" stroke="#166534" stroke-width="2"/>

    <!-- 5-Slot White/Silver Cylinder Reel Body -->
    <rect x="34" y="280" width="444" height="116" rx="58" fill="url(#hiReelSilverCylinder)"/>

    <!-- 4 Reel Column Dividers -->
    <!-- Col 1 (R) / Col 2 (U) -->
    <path d="M122 280 L122 396" stroke="#94a3b8" stroke-width="3" opacity="0.75"/>
    <path d="M124 280 L124 396" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Col 2 (U) / Col 3 (M) -->
    <path d="M212 280 L212 396" stroke="#94a3b8" stroke-width="3" opacity="0.75"/>
    <path d="M214 280 L214 396" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Col 3 (M) / Col 4 (M) -->
    <path d="M300 280 L300 396" stroke="#94a3b8" stroke-width="3" opacity="0.75"/>
    <path d="M302 280 L302 396" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Col 4 (M) / Col 5 (Y) -->
    <path d="M388 280 L388 396" stroke="#94a3b8" stroke-width="3" opacity="0.75"/>
    <path d="M390 280 L390 396" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Reel Cylindrical Gloss Highlight (Top white reflection) -->
    <rect x="54" y="284" width="404" height="22" rx="11" fill="#ffffff" opacity="0.75"/>
    <rect x="64" y="288" width="384" height="7" rx="3.5" fill="#ffffff" opacity="0.95"/>

    <!-- Bottom subtle reflection -->
    <rect x="74" y="378" width="364" height="8" rx="4" fill="#ffffff" opacity="0.3"/>

    <!-- ==================== 5 SLOTS: R - U - M - M - Y ==================== -->
    
    <!-- SLOT 1: LETTER 'R' (cx: 78) -->
    <g>
      <text x="78" y="376" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="96" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">R</text>
      <text x="78" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="96" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">R</text>
      <text x="78" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="96" fill="url(#hiRummyGreenGrad)">R</text>
    </g>

    <!-- SLOT 2: LETTER 'U' (cx: 167) -->
    <g>
      <text x="167" y="376" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="96" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">U</text>
      <text x="167" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="96" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">U</text>
      <text x="167" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="96" fill="url(#hiRummyGreenGrad)">U</text>
    </g>

    <!-- SLOT 3: LETTER 'M' (cx: 256) -->
    <g>
      <text x="256" y="376" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="96" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">M</text>
      <text x="256" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="96" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">M</text>
      <text x="256" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="96" fill="url(#hiRummyGreenGrad)">M</text>
    </g>

    <!-- SLOT 4: LETTER 'M' (cx: 345) -->
    <g>
      <text x="345" y="376" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="96" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">M</text>
      <text x="345" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="96" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">M</text>
      <text x="345" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="96" fill="url(#hiRummyGreenGrad)">M</text>
    </g>

    <!-- SLOT 5: LETTER 'Y' (cx: 434) -->
    <g>
      <text x="434" y="376" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="96" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">Y</text>
      <text x="434" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="96" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">Y</text>
      <text x="434" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="96" fill="url(#hiRummyGreenGrad)">Y</text>
    </g>
  </g>
</svg>

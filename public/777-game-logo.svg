<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Emerald Green Quilted Background Radial Gradient -->
    <radialGradient id="sevenBgRadial" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#0b5e39"/>
      <stop offset="40%" stop-color="#054425"/>
      <stop offset="80%" stop-color="#022414"/>
      <stop offset="100%" stop-color="#011209"/>
    </radialGradient>

    <!-- Center Rotated Diamond Plate Gradient -->
    <linearGradient id="sevenDiamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f6b41"/>
      <stop offset="50%" stop-color="#084d2d"/>
      <stop offset="100%" stop-color="#032a18"/>
    </linearGradient>

    <!-- 3D Triple 777 Red-to-Yellow Glossy Fire Gradient -->
    <linearGradient id="sevenRedYellowFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="12%" stop-color="#ff8a80"/>
      <stop offset="35%" stop-color="#ff1744"/>
      <stop offset="65%" stop-color="#ff5252"/>
      <stop offset="85%" stop-color="#ffd600"/>
      <stop offset="100%" stop-color="#ffff00"/>
    </linearGradient>

    <!-- 3D 777 Crimson Extrusion / Bevel Gradient -->
    <linearGradient id="sevenRedBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d50000"/>
      <stop offset="50%" stop-color="#880e4f"/>
      <stop offset="100%" stop-color="#3e0012"/>
    </linearGradient>

    <!-- Slot Roller Outer Metallic Green Frame -->
    <linearGradient id="sevenReelGreenFrame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#16a34a"/>
      <stop offset="85%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>

    <!-- Slot Reel Body (White/Silver Cylinder) -->
    <linearGradient id="sevenReelSilverCylinder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="12%" stop-color="#e2e8f0"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Emerald Green "GAME" Letter Face Gradient -->
    <linearGradient id="sevenGameGreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="40%" stop-color="#065f46"/>
      <stop offset="80%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c19"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="sevenMainShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <filter id="sevenGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ff1744" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Squircle with Deep Green Texture -->
  <rect width="512" height="512" rx="112" fill="url(#sevenBgRadial)"/>

  <!-- Checkerboard / Diamond Quilted Pattern -->
  <g opacity="0.25" stroke="#22c55e" stroke-width="1.2" fill="none">
    <path d="M-60 256 L256 -60 L572 256 L256 572 Z" />
    <path d="M0 256 L256 0 L512 256 L256 512 Z" />
    <path d="M64 256 L256 64 L448 256 L256 448 Z" />
    <path d="M128 256 L256 128 L384 256 L256 384 Z" />
    <path d="M192 256 L256 192 L320 256 L256 320 Z" />
    <line x1="64" y1="0" x2="512" y2="448" />
    <line x1="0" y1="64" x2="448" y2="512" />
    <line x1="0" y1="192" x2="320" y2="512" />
    <line x1="192" y1="0" x2="512" y2="320" />
    <line x1="448" y1="0" x2="0" y2="448" />
    <line x1="512" y1="64" x2="64" y2="512" />
    <line x1="320" y1="0" x2="0" y2="320" />
    <line x1="512" y1="192" x2="192" y2="512" />
  </g>

  <!-- Outer Rounded Neon Green Accent Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#22c55e" stroke-width="4.5" opacity="0.4"/>

  <!-- Center Rotated Diamond Plate with Neon Green Glow Border -->
  <g filter="url(#sevenMainShadow)">
    <rect x="76" y="76" width="360" height="360" rx="44" transform="rotate(45 256 256)" fill="url(#sevenDiamondGrad)" stroke="#22c55e" stroke-width="5" stroke-opacity="0.85"/>
  </g>

  <!-- ==================== 3D TRIPLE "7 7 7" TOP SECTION ==================== -->
  
  <g filter="url(#sevenMainShadow)">
    
    <!-- ========== LEFT '7' (Tilted Left, Behind Center) ========== -->
    <g transform="translate(68, 134) rotate(-14) scale(0.92)" filter="url(#sevenGlow)">
      <!-- 3D Extrusion -->
      <path d="M10 16 L124 16 L124 44 L66 142 L16 142 L72 48 L10 48 Z" fill="#2d020a" stroke="#2d020a" stroke-width="8"/>
      <path d="M10 16 L22 0 L136 0 L136 30 L80 128 L66 142 L124 44 L124 16 Z" fill="url(#sevenRedBevel)"/>
      <path d="M8 14 L122 14 L122 42 L64 140 L14 140 L70 46 L8 46 Z" fill="#b71c1c"/>
      <!-- Front Face -->
      <path d="M6 12 L120 12 L120 40 L62 138 L12 138 L68 44 L6 44 Z" fill="url(#sevenRedYellowFace)" stroke="#ffe082" stroke-width="3.5" stroke-linejoin="round"/>
      <!-- Highlight -->
      <path d="M12 16 L114 16 L114 26 L12 26 Z" fill="#ffffff" opacity="0.75" rx="3"/>
    </g>

    <!-- ========== RIGHT '7' (Tilted Right, Behind Center) ========== -->
    <g transform="translate(322, 136) rotate(14) scale(0.92)" filter="url(#sevenGlow)">
      <!-- 3D Extrusion -->
      <path d="M10 16 L124 16 L124 44 L66 142 L16 142 L72 48 L10 48 Z" fill="#2d020a" stroke="#2d020a" stroke-width="8"/>
      <path d="M10 16 L22 0 L136 0 L136 30 L80 128 L66 142 L124 44 L124 16 Z" fill="url(#sevenRedBevel)"/>
      <path d="M8 14 L122 14 L122 42 L64 140 L14 140 L70 46 L8 46 Z" fill="#b71c1c"/>
      <!-- Front Face -->
      <path d="M6 12 L120 12 L120 40 L62 138 L12 138 L68 44 L6 44 Z" fill="url(#sevenRedYellowFace)" stroke="#ffe082" stroke-width="3.5" stroke-linejoin="round"/>
      <!-- Highlight -->
      <path d="M12 16 L114 16 L114 26 L12 26 Z" fill="#ffffff" opacity="0.75" rx="3"/>
    </g>

    <!-- ========== CENTER '7' (Hero Big Center 7) ========== -->
    <g transform="translate(178, 64) scale(1.22)" filter="url(#sevenGlow)">
      <!-- 3D Depth Shadow -->
      <path d="M10 18 L138 18 L138 52 L74 162 L18 162 L82 56 L10 56 Z" fill="#200106" stroke="#200106" stroke-width="10"/>
      <!-- 3D Bevel -->
      <path d="M10 18 L24 0 L152 0 L152 36 L90 146 L74 162 L138 52 L138 18 Z" fill="url(#sevenRedBevel)"/>
      <path d="M8 16 L136 16 L136 50 L72 160 L16 160 L80 54 L8 54 Z" fill="#b71c1c"/>
      <!-- Front Face -->
      <path d="M6 14 L134 14 L134 48 L70 158 L14 158 L78 52 L6 52 Z" fill="url(#sevenRedYellowFace)" stroke="#fff59d" stroke-width="4" stroke-linejoin="round"/>
      <!-- Gloss Top Reflection -->
      <path d="M14 18 L126 18 L126 30 L14 30 Z" fill="#ffffff" opacity="0.8" rx="4"/>
      <!-- Diagonal Gloss Line -->
      <path d="M78 52 L120 22 L112 50 Z" fill="#ffffff" opacity="0.4"/>
    </g>

    <!-- Golden Sparkles on 777 -->
    <!-- Top Sparkle Center -->
    <path d="M344 76 Q344 90 358 90 Q344 90 344 104 Q344 90 330 90 Q344 90 344 76 Z" fill="#ffffff"/>
    <path d="M344 80 Q344 90 354 90 Q344 90 344 100 Q344 90 334 90 Q344 90 344 80 Z" fill="#fff59d"/>

    <!-- Left Sparkle -->
    <path d="M56 164 Q56 172 64 172 Q56 172 56 180 Q56 172 48 172 Q56 172 56 164 Z" fill="#ffffff"/>

    <!-- Right Sparkle -->
    <path d="M466 168 Q466 178 476 178 Q466 178 466 188 Q466 178 456 178 Q466 178 466 168 Z" fill="#fff59d"/>
  </g>


  <!-- ==================== 6-SLOT "[♠] [G] [A] [M] [E] [♠]" CYLINDER REEL ==================== -->
  <g filter="url(#sevenMainShadow)">
    <!-- Slot Roller Outer Dark Rim -->
    <rect x="30" y="270" width="452" height="136" rx="68" fill="#011b10" stroke="#000000" stroke-width="6"/>

    <!-- Shiny Chrome Green Rim -->
    <rect x="34" y="274" width="444" height="128" rx="64" fill="url(#sevenReelGreenFrame)" stroke="#166534" stroke-width="2"/>

    <!-- 6-Slot White/Silver Cylinder Reel Body -->
    <rect x="42" y="282" width="428" height="112" rx="56" fill="url(#sevenReelSilverCylinder)"/>

    <!-- 5 Reel Column Dividers -->
    <!-- Col 1 (♠) / Col 2 (G) -->
    <path d="M112 282 L112 394" stroke="#94a3b8" stroke-width="3" opacity="0.75"/>
    <path d="M114 282 L114 394" stroke="#ffffff" stroke-width="1.8" opacity="0.9"/>

    <!-- Col 2 (G) / Col 3 (A) -->
    <path d="M184 282 L184 394" stroke="#94a3b8" stroke-width="3" opacity="0.75"/>
    <path d="M186 282 L186 394" stroke="#ffffff" stroke-width="1.8" opacity="0.9"/>

    <!-- Col 3 (A) / Col 4 (M) -->
    <path d="M256 282 L256 394" stroke="#94a3b8" stroke-width="3" opacity="0.75"/>
    <path d="M258 282 L258 394" stroke="#ffffff" stroke-width="1.8" opacity="0.9"/>

    <!-- Col 4 (M) / Col 5 (E) -->
    <path d="M328 282 L328 394" stroke="#94a3b8" stroke-width="3" opacity="0.75"/>
    <path d="M330 282 L330 394" stroke="#ffffff" stroke-width="1.8" opacity="0.9"/>

    <!-- Col 5 (E) / Col 6 (♠) -->
    <path d="M400 282 L400 394" stroke="#94a3b8" stroke-width="3" opacity="0.75"/>
    <path d="M402 282 L402 394" stroke="#ffffff" stroke-width="1.8" opacity="0.9"/>

    <!-- Reel Cylindrical Gloss Highlight (Top white reflection) -->
    <rect x="62" y="286" width="388" height="20" rx="10" fill="#ffffff" opacity="0.75"/>
    <rect x="72" y="290" width="368" height="6" rx="3" fill="#ffffff" opacity="0.95"/>

    <!-- Bottom subtle reflection -->
    <rect x="80" y="376" width="352" height="8" rx="4" fill="#ffffff" opacity="0.3"/>

    <!-- ==================== 6 SLOTS: ♠ - G - A - M - E - ♠ ==================== -->
    
    <!-- SLOT 1: EMERALD SPADE ♠ (cx: 77, cy: 338) -->
    <g>
      <path d="M77 308 C68 322 55 334 55 347 C55 357 62 364 71 364 C75 364 79 360 79 360 C79 360 76 369 73 373 L81 373 C78 369 75 360 75 360 C75 360 79 364 83 364 C92 364 99 357 99 347 C99 334 86 322 77 308 Z" fill="#012417" stroke="#012417" stroke-width="7" stroke-linejoin="round" transform="translate(0, 3)"/>
      <path d="M77 308 C68 322 55 334 55 347 C55 357 62 364 71 364 C75 364 79 360 79 360 C79 360 76 369 73 373 L81 373 C78 369 75 360 75 360 C75 360 79 364 83 364 C92 364 99 357 99 347 C99 334 86 322 77 308 Z" fill="url(#sevenGameGreenGrad)" stroke="#047857" stroke-width="2"/>
    </g>

    <!-- SLOT 2: LETTER 'G' (cx: 148) -->
    <g>
      <text x="148" y="374" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="88" fill="#012417" stroke="#012417" stroke-width="7" stroke-linejoin="round">G</text>
      <text x="148" y="370" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="88" fill="#047857" stroke="#065f46" stroke-width="3.5" stroke-linejoin="round">G</text>
      <text x="148" y="370" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="88" fill="url(#sevenGameGreenGrad)">G</text>
    </g>

    <!-- SLOT 3: LETTER 'A' (cx: 220) -->
    <g>
      <text x="220" y="374" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="88" fill="#012417" stroke="#012417" stroke-width="7" stroke-linejoin="round">A</text>
      <text x="220" y="370" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="88" fill="#047857" stroke="#065f46" stroke-width="3.5" stroke-linejoin="round">A</text>
      <text x="220" y="370" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="88" fill="url(#sevenGameGreenGrad)">A</text>
    </g>

    <!-- SLOT 4: LETTER 'M' (cx: 292) -->
    <g>
      <text x="292" y="374" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="88" fill="#012417" stroke="#012417" stroke-width="7" stroke-linejoin="round">M</text>
      <text x="292" y="370" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="88" fill="#047857" stroke="#065f46" stroke-width="3.5" stroke-linejoin="round">M</text>
      <text x="292" y="370" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="88" fill="url(#sevenGameGreenGrad)">M</text>
    </g>

    <!-- SLOT 5: LETTER 'E' (cx: 364) -->
    <g>
      <text x="364" y="374" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="88" fill="#012417" stroke="#012417" stroke-width="7" stroke-linejoin="round">E</text>
      <text x="364" y="370" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="88" fill="#047857" stroke="#065f46" stroke-width="3.5" stroke-linejoin="round">E</text>
      <text x="364" y="370" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="88" fill="url(#sevenGameGreenGrad)">E</text>
    </g>

    <!-- SLOT 6: EMERALD SPADE ♠ (cx: 435, cy: 338) -->
    <g>
      <path d="M435 308 C426 322 413 334 413 347 C413 357 420 364 429 364 C433 364 437 360 437 360 C437 360 434 369 431 373 L439 373 C436 369 433 360 433 360 C433 360 437 364 441 364 C450 364 457 357 457 347 C457 334 444 322 435 308 Z" fill="#012417" stroke="#012417" stroke-width="7" stroke-linejoin="round" transform="translate(0, 3)"/>
      <path d="M435 308 C426 322 413 334 413 347 C413 357 420 364 429 364 C433 364 437 360 437 360 C437 360 434 369 431 373 L439 373 C436 369 433 360 433 360 C433 360 437 364 441 364 C450 364 457 357 457 347 C457 334 444 322 435 308 Z" fill="url(#sevenGameGreenGrad)" stroke="#047857" stroke-width="2"/>
    </g>
  </g>
</svg>

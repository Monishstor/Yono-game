<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Yono Emerald Green Rich Radial Gradient -->
    <radialGradient id="yonoGreenBg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="35%" stop-color="#0e6940"/>
      <stop offset="70%" stop-color="#054527"/>
      <stop offset="100%" stop-color="#022414"/>
    </radialGradient>

    <!-- Center Rotated Diamond Plate Gradient -->
    <linearGradient id="diamondPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="50%" stop-color="#0e6940"/>
      <stop offset="100%" stop-color="#032c19"/>
    </linearGradient>

    <!-- Royal Metallic 3D Gold Gradient -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffde7"/>
      <stop offset="20%" stop-color="#ffeb3b"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <!-- Warm Bevel Light Gold -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>

    <!-- Ruby Jewel Gradient -->
    <linearGradient id="rubyJewel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>

    <!-- Cyan/Diamond Jewel Gradient -->
    <linearGradient id="cyanJewel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow3D" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#fbbf24" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Base Squircle (Yono Green Luxury Canvas) -->
  <rect width="512" height="512" rx="120" fill="url(#yonoGreenBg)"/>

  <!-- Subtle Casino Quilted Diamond Grid Lines -->
  <g opacity="0.22" stroke="#4ade80" stroke-width="1.8" fill="none">
    <path d="M0 256 L256 0 L512 256 L256 512 Z" />
    <path d="M64 256 L256 64 L448 256 L256 448 Z" />
    <path d="M128 256 L256 128 L384 256 L256 384 Z" />
    <line x1="0" y1="128" x2="384" y2="512" />
    <line x1="128" y1="0" x2="512" y2="384" />
    <line x1="384" y1="0" x2="0" y2="384" />
    <line x1="512" y1="128" x2="128" y2="512" />
  </g>

  <!-- Outer Metallic Gold Beveled Rim -->
  <rect x="14" y="14" width="484" height="484" rx="108" fill="none" stroke="url(#goldLight)" stroke-width="8" opacity="0.95"/>
  <rect x="24" y="24" width="464" height="464" rx="98" fill="none" stroke="#22c55e" stroke-width="2.5" opacity="0.4"/>

  <!-- Center Rotated Diamond Shield with Gold Rim -->
  <g filter="url(#shadow3D)">
    <rect x="96" y="96" width="320" height="320" rx="44" transform="rotate(45 256 256)" fill="url(#diamondPlate)" stroke="url(#goldMetallic)" stroke-width="6"/>
  </g>

  <!-- ==================== SIGNATURE YONO ROYAL CROWN (TOP) ==================== -->
  <g filter="url(#shadow3D)">
    <!-- 5-Point Crown Shape -->
    <path d="M168 184 L146 116 L208 148 L256 88 L304 148 L366 116 L344 184 Z" 
          fill="url(#goldMetallic)" 
          stroke="#78350f" 
          stroke-width="3" 
          stroke-linejoin="round"
    />
    
    <!-- Crown Base Band Arch -->
    <path d="M162 180 Q256 194 350 180 L346 196 Q256 210 166 196 Z" 
          fill="url(#goldLight)" 
          stroke="#78350f" 
          stroke-width="2.5"
    />

    <!-- Crown Jewels on Band -->
    <circle cx="196" cy="190" r="5" fill="url(#rubyJewel)" stroke="#ffffff" stroke-width="1.2"/>
    <circle cx="256" cy="195" r="7" fill="url(#cyanJewel)" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="316" cy="190" r="5" fill="url(#rubyJewel)" stroke="#ffffff" stroke-width="1.2"/>

    <!-- Crown Peak Golden Spheres / Pearls -->
    <circle cx="146" cy="114" r="9" fill="#fef08a" stroke="#b45309" stroke-width="2.5"/>
    <circle cx="208" cy="146" r="8" fill="#fef08a" stroke="#b45309" stroke-width="2.5"/>
    <circle cx="256" cy="86" r="13" fill="#ffffff" stroke="#b45309" stroke-width="3"/>
    <circle cx="304" cy="146" r="8" fill="#fef08a" stroke="#b45309" stroke-width="2.5"/>
    <circle cx="366" cy="114" r="9" fill="#fef08a" stroke="#b45309" stroke-width="2.5"/>

    <!-- Center Ruby Diamond on Crown -->
    <polygon points="256,122 268,138 256,154 244,138" fill="url(#rubyJewel)" stroke="#fecaca" stroke-width="1.5"/>
  </g>

  <!-- ==================== SIGNATURE GOLDEN SPADE & CASINO EMBLEM (CENTER) ==================== -->
  <g filter="url(#goldGlow)">
    <!-- 3D Spade Insignia -->
    <!-- Spade Outer White/Gold Bevel -->
    <path d="M 256 220 
             C 292 270 338 304 338 344 
             C 338 376 312 400 280 400 
             C 264 400 252 392 244 380 
             C 236 392 224 400 208 400 
             C 176 400 150 376 150 344 
             C 150 304 196 270 232 220 
             Z" 
          fill="url(#goldMetallic)" 
          stroke="#ffffff" 
          stroke-width="5"
          stroke-linejoin="round"
    />

    <!-- Spade Stem / Pedestal -->
    <path d="M 248 370 L 230 422 L 282 422 L 264 370 Z" 
          fill="url(#goldMetallic)" 
          stroke="#78350f" 
          stroke-width="3"
    />

    <!-- Spade Inner Emerald Center Cutout -->
    <path d="M 256 250 
             C 280 286 314 314 314 342 
             C 314 364 296 380 274 380 
             C 262 380 252 374 246 364 
             L 256 350 
             L 266 364 
             C 260 374 250 380 238 380 
             C 216 380 198 364 198 342 
             C 198 314 232 286 256 250 
             Z" 
          fill="url(#diamondPlate)" 
          stroke="url(#goldLight)" 
          stroke-width="2.5"
    />

    <!-- Glowing Heart/Star at center of Spade -->
    <polygon points="256,310 264,324 280,324 266,334 272,348 256,338 240,348 246,334 232,324 248,324" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- Sparkle Stars -->
  <g fill="#ffffff">
    <!-- Left Star -->
    <polygon points="108,240 114,256 130,262 114,268 108,284 102,268 86,262 102,256" opacity="0.85"/>
    <!-- Right Star -->
    <polygon points="404,240 410,256 426,262 410,268 404,284 398,268 382,262 398,256" opacity="0.85"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Royal Gold & Emerald Quilted Radial Gradient -->
    <radialGradient id="yonoBgRadial" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#0e6940"/>
      <stop offset="40%" stop-color="#054527"/>
      <stop offset="75%" stop-color="#022414"/>
      <stop offset="100%" stop-color="#011209"/>
    </radialGradient>

    <!-- Center Rotated Diamond Plate Gradient -->
    <linearGradient id="yonoDiamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#147c4c"/>
      <stop offset="50%" stop-color="#095532"/>
      <stop offset="100%" stop-color="#032c19"/>
    </linearGradient>

    <!-- 3D Royal Gold Typography Gradient -->
    <linearGradient id="yonoGoldFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="15%" stop-color="#fff59d"/>
      <stop offset="45%" stop-color="#ffca28"/>
      <stop offset="75%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <!-- Crown & Stars Gold Gradient -->
    <linearGradient id="yonoCrownGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffde7"/>
      <stop offset="25%" stop-color="#fdd835"/>
      <stop offset="70%" stop-color="#f57f17"/>
      <stop offset="100%" stop-color="#bf360c"/>
    </linearGradient>

    <!-- Golden Metallic Outline Bevel Gradient -->
    <linearGradient id="yonoGoldBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fff59d"/>
      <stop offset="60%" stop-color="#ffb300"/>
      <stop offset="85%" stop-color="#e65100"/>
      <stop offset="100%" stop-color="#5d1600"/>
    </linearGradient>

    <!-- Slot Roller Outer Metallic Gold-Green Frame -->
    <linearGradient id="yonoReelGreenFrame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#16a34a"/>
      <stop offset="85%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>

    <!-- Slot Reel Cylinder Body (Silver/White Plate) -->
    <linearGradient id="yonoReelSilverCylinder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="12%" stop-color="#e2e8f0"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Emerald Green "GAMES" Letter Gradient -->
    <linearGradient id="yonoGamesGreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="40%" stop-color="#047857"/>
      <stop offset="80%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c19"/>
    </linearGradient>

    <!-- Drop Shadows & Glow -->
    <filter id="yonoMainShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <filter id="yonoStarGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Squircle with Deep Green Texture -->
  <rect width="512" height="512" rx="112" fill="url(#yonoBgRadial)"/>

  <!-- Checkerboard / Diamond Quilted Pattern -->
  <g opacity="0.25" stroke="#22c55e" stroke-width="1.2" fill="none">
    <path d="M-60 256 L256 -60 L572 256 L256 572 Z" />
    <path d="M0 256 L256 0 L512 256 L256 512 Z" />
    <path d="M64 256 L256 64 L448 256 L256 448 Z" />
    <path d="M128 256 L256 128 L384 256 L256 384 Z" />
    <path d="M192 256 L256 192 L320 256 L256 320 Z" />
    <line x1="64" y1="0" x2="512" y2="448" />
    <line x1="0" y1="64" x2="448" y2="512" />
    <line x1="0" y1="192" x2="320" y2="512" />
    <line x1="192" y1="0" x2="512" y2="320" />
    <line x1="448" y1="0" x2="0" y2="448" />
    <line x1="512" y1="64" x2="64" y2="512" />
    <line x1="320" y1="0" x2="0" y2="320" />
    <line x1="512" y1="192" x2="192" y2="512" />
  </g>

  <!-- Outer Rounded Neon Green Accent Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#22c55e" stroke-width="4.5" opacity="0.4"/>

  <!-- Center Rotated Diamond Plate with Neon Green Glow Border -->
  <g filter="url(#yonoMainShadow)">
    <rect x="76" y="76" width="360" height="360" rx="44" transform="rotate(45 256 256)" fill="url(#yonoDiamondGrad)" stroke="#22c55e" stroke-width="5" stroke-opacity="0.85"/>
  </g>

  <!-- Top Ribbon "NEW 2026" Badge -->
  <g filter="url(#yonoMainShadow)">
    <rect x="186" y="32" width="140" height="32" rx="16" fill="#dc2626" stroke="#fef08a" stroke-width="2"/>
    <text x="256" y="53" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="16" letter-spacing="2" fill="#ffffff">NEW 2026</text>
  </g>

  <!-- Top Royal 5-Point Crown -->
  <g filter="url(#yonoMainShadow)">
    <path d="M174 122 L152 76 L216 100 L256 56 L296 100 L360 76 L338 122 Z" fill="url(#yonoCrownGrad)" stroke="#5d1600" stroke-width="3.5" stroke-linejoin="round"/>
    
    <!-- Crown Base Band -->
    <path d="M168 118 Q256 128 344 118 L342 128 Q256 138 170 128 Z" fill="#ffd54f" stroke="#8d2b00" stroke-width="2"/>
    
    <!-- Jewels on Crown -->
    <circle cx="212" cy="123" r="3.5" fill="#e53935" />
    <circle cx="256" cy="125" r="4.5" fill="#1e88e5" />
    <circle cx="300" cy="123" r="3.5" fill="#e53935" />

    <!-- Crown Top Orbs -->
    <circle cx="152" cy="74" r="7" fill="#fff59d" stroke="#bf360c" stroke-width="2"/>
    <circle cx="216" cy="98" r="6" fill="#fff59d" stroke="#bf360c" stroke-width="2"/>
    <circle cx="256" cy="54" r="9" fill="#fff59d" stroke="#bf360c" stroke-width="2.5"/>
    <circle cx="296" cy="98" r="6" fill="#fff59d" stroke="#bf360c" stroke-width="2"/>
    <circle cx="360" cy="74" r="7" fill="#fff59d" stroke="#bf360c" stroke-width="2"/>

    <!-- Center Ruby Diamond on Crown -->
    <polygon points="256,78 265,90 256,102 247,90" fill="#d50000" stroke="#ff8a80" stroke-width="1.5"/>
  </g>

  <!-- Sparkle Stars near YONO -->
  <g filter="url(#yonoStarGlow)">
    <path d="M376 160 Q376 174 390 174 Q376 174 376 188 Q376 174 362 174 Q376 174 376 160 Z" fill="#ffffff" />
    <path d="M376 163 Q376 174 386 174 Q376 174 376 185 Q376 174 366 174 Q376 174 376 163 Z" fill="#ffd700" />
    <path d="M120 190 Q120 200 130 200 Q120 200 120 210 Q120 200 110 200 Q120 200 120 190 Z" fill="#ffd700" />
  </g>

  <!-- ==================== 3D "YONO" BOLD TYPOGRAPHY ==================== -->
  <g filter="url(#yonoMainShadow)">
    <!-- Deep Red / Crimson 3D Extrusion Shadow Layers -->
    <text x="256" y="254" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="144" letter-spacing="4" fill="#3b0800" stroke="#3b0800" stroke-width="24" stroke-linejoin="round">YONO</text>
    <text x="256" y="249" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="144" letter-spacing="4" fill="#6b1200" stroke="#6b1200" stroke-width="20" stroke-linejoin="round">YONO</text>
    <text x="256" y="244" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="144" letter-spacing="4" fill="#9e1e00" stroke="#9e1e00" stroke-width="16" stroke-linejoin="round">YONO</text>
    <text x="256" y="239" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="144" letter-spacing="4" fill="#d82d00" stroke="#d82d00" stroke-width="12" stroke-linejoin="round">YONO</text>

    <!-- Warm Golden Bevel Outline -->
    <text x="256" y="234" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="144" letter-spacing="4" fill="url(#yonoGoldBevel)" stroke="url(#yonoGoldBevel)" stroke-width="8" stroke-linejoin="round">YONO</text>

    <!-- Crisp Rich Yellow Gold Front Face -->
    <text x="256" y="234" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="144" letter-spacing="4" fill="url(#yonoGoldFace)">YONO</text>
  </g>

  <!-- ==================== 5-SLOT "GAMES" CYLINDER REEL ==================== -->
  <g filter="url(#yonoMainShadow)">
    <!-- Slot Roller Outer Dark Rim -->
    <rect x="36" y="270" width="440" height="136" rx="68" fill="#011b10" stroke="#000000" stroke-width="6"/>

    <!-- Shiny Chrome Green Rim -->
    <rect x="40" y="274" width="432" height="128" rx="64" fill="url(#yonoReelGreenFrame)" stroke="#166534" stroke-width="2"/>

    <!-- 5-Slot White/Silver Cylinder Reel Body -->
    <rect x="48" y="282" width="416" height="112" rx="56" fill="url(#yonoReelSilverCylinder)"/>

    <!-- 5 Individual Reel Column Dividers -->
    <!-- Col 1 (G) / Col 2 (A) -->
    <path d="M128 282 L128 394" stroke="#94a3b8" stroke-width="3.5" opacity="0.75"/>
    <path d="M131 282 L131 394" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Col 2 (A) / Col 3 (M) -->
    <path d="M212 282 L212 394" stroke="#94a3b8" stroke-width="3.5" opacity="0.75"/>
    <path d="M215 282 L215 394" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Col 3 (M) / Col 4 (E) -->
    <path d="M298 282 L298 394" stroke="#94a3b8" stroke-width="3.5" opacity="0.75"/>
    <path d="M301 282 L301 394" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Col 4 (E) / Col 5 (S) -->
    <path d="M382 282 L382 394" stroke="#94a3b8" stroke-width="3.5" opacity="0.75"/>
    <path d="M385 282 L385 394" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Reel Cylindrical Gloss Highlight (Top white reflection) -->
    <rect x="68" y="286" width="376" height="20" rx="10" fill="#ffffff" opacity="0.75"/>
    <rect x="78" y="290" width="356" height="6" rx="3" fill="#ffffff" opacity="0.95"/>

    <!-- Bottom subtle reflection -->
    <rect x="88" y="376" width="336" height="8" rx="4" fill="#ffffff" opacity="0.3"/>

    <!-- ==================== 5 EMERALD GREEN BOLD LETTERS: G - A - M - E - S ==================== -->
    
    <!-- LETTER 1: "G" (x: 88) -->
    <g>
      <text x="88" y="376" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">G</text>
      <text x="88" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">G</text>
      <text x="88" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="url(#yonoGamesGreenGrad)">G</text>
    </g>

    <!-- LETTER 2: "A" (x: 170) -->
    <g>
      <text x="170" y="376" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">A</text>
      <text x="170" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">A</text>
      <text x="170" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="url(#yonoGamesGreenGrad)">A</text>
    </g>

    <!-- LETTER 3: "M" (x: 255) -->
    <g>
      <text x="255" y="376" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">M</text>
      <text x="255" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">M</text>
      <text x="255" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="url(#yonoGamesGreenGrad)">M</text>
    </g>

    <!-- LETTER 4: "E" (x: 340) -->
    <g>
      <text x="340" y="376" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">E</text>
      <text x="340" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">E</text>
      <text x="340" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="url(#yonoGamesGreenGrad)">E</text>
    </g>

    <!-- LETTER 5: "S" (x: 424) -->
    <g>
      <text x="424" y="376" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">S</text>
      <text x="424" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">S</text>
      <text x="424" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="url(#yonoGamesGreenGrad)">S</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Emerald Green Quilted Background Gradient -->
    <radialGradient id="winBgRadial" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#0b5e39"/>
      <stop offset="40%" stop-color="#054425"/>
      <stop offset="80%" stop-color="#022414"/>
      <stop offset="100%" stop-color="#011209"/>
    </radialGradient>

    <!-- Center Rotated Diamond Plate Gradient -->
    <linearGradient id="winDiamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f6b41"/>
      <stop offset="50%" stop-color="#084d2d"/>
      <stop offset="100%" stop-color="#032a18"/>
    </linearGradient>

    <!-- Golden Crown Gradient -->
    <linearGradient id="winCrownGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff9c4"/>
      <stop offset="25%" stop-color="#fbc02d"/>
      <stop offset="70%" stop-color="#f57f17"/>
      <stop offset="100%" stop-color="#b75300"/>
    </linearGradient>

    <!-- 3D "WiN" Typography Gradients -->
    <linearGradient id="winGoldFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#fff59d"/>
      <stop offset="55%" stop-color="#ffca28"/>
      <stop offset="85%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>

    <!-- Slot Roller Outer Metallic Green Frame -->
    <linearGradient id="winReelGreenFrame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#16a34a"/>
      <stop offset="85%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>

    <!-- Slot Reel Body (White/Silver Cylinder) -->
    <linearGradient id="winReelSilverCylinder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="12%" stop-color="#e2e8f0"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Emerald Green "RUMMY" Letter Face Gradient -->
    <linearGradient id="winRummyGreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="40%" stop-color="#065f46"/>
      <stop offset="80%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c19"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="winMainShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <filter id="winGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Squircle with Deep Green Texture -->
  <rect width="512" height="512" rx="112" fill="url(#winBgRadial)"/>

  <!-- Checkerboard / Diamond Quilted Pattern -->
  <g opacity="0.25" stroke="#22c55e" stroke-width="1.2" fill="none">
    <path d="M-60 256 L256 -60 L572 256 L256 572 Z" />
    <path d="M0 256 L256 0 L512 256 L256 512 Z" />
    <path d="M64 256 L256 64 L448 256 L256 448 Z" />
    <path d="M128 256 L256 128 L384 256 L256 384 Z" />
    <path d="M192 256 L256 192 L320 256 L256 320 Z" />
    <line x1="64" y1="0" x2="512" y2="448" />
    <line x1="0" y1="64" x2="448" y2="512" />
    <line x1="0" y1="192" x2="320" y2="512" />
    <line x1="192" y1="0" x2="512" y2="320" />
    <line x1="448" y1="0" x2="0" y2="448" />
    <line x1="512" y1="64" x2="64" y2="512" />
    <line x1="320" y1="0" x2="0" y2="320" />
    <line x1="512" y1="192" x2="192" y2="512" />
  </g>

  <!-- Outer Rounded Neon Green Accent Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#22c55e" stroke-width="4.5" opacity="0.4"/>

  <!-- Center Rotated Diamond Plate with Neon Green Glow Border -->
  <g filter="url(#winMainShadow)">
    <rect x="76" y="76" width="360" height="360" rx="44" transform="rotate(45 256 256)" fill="url(#winDiamondGrad)" stroke="#22c55e" stroke-width="5" stroke-opacity="0.85"/>
  </g>

  <!-- ==================== TOP GOLDEN ROYAL CROWN ==================== -->
  <g filter="url(#winMainShadow)">
    <!-- Crown Body -->
    <path d="M174 136 L152 90 L216 114 L256 68 L296 114 L360 90 L338 136 Z" fill="url(#winCrownGrad)" stroke="#682100" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Crown Base Band -->
    <path d="M168 132 Q256 142 344 132 L342 142 Q256 152 170 142 Z" fill="#ffd54f" stroke="#8d2b00" stroke-width="2"/>
    
    <!-- Crown Base Jewels -->
    <circle cx="212" cy="137" r="3.5" fill="#e53935" />
    <circle cx="256" cy="139" r="4.5" fill="#1e88e5" />
    <circle cx="300" cy="137" r="3.5" fill="#e53935" />

    <!-- Crown Top Orbs -->
    <circle cx="152" cy="88" r="7.5" fill="#fff59d" stroke="#bf360c" stroke-width="2"/>
    <circle cx="216" cy="112" r="6.5" fill="#fff59d" stroke="#bf360c" stroke-width="2"/>
    <circle cx="256" cy="66" r="9.5" fill="#fff59d" stroke="#bf360c" stroke-width="2.5"/>
    <circle cx="296" cy="112" r="6.5" fill="#fff59d" stroke="#bf360c" stroke-width="2"/>
    <circle cx="360" cy="88" r="7.5" fill="#fff59d" stroke="#bf360c" stroke-width="2"/>

    <!-- Center Ruby Diamond on Crown -->
    <polygon points="256,92 265,104 256,116 247,104" fill="#d50000" stroke="#ff8a80" stroke-width="1.5"/>
  </g>

  <!-- ==================== 3D "WiN" BOLD TYPOGRAPHY ==================== -->
  <g filter="url(#winMainShadow)">
    <!-- Deep Red / Crimson 3D Extrusion Shadow Layers -->
    <text x="256" y="278" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="168" letter-spacing="2" fill="#3b0000" stroke="#3b0000" stroke-width="24" stroke-linejoin="round">WiN</text>
    <text x="256" y="273" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="168" letter-spacing="2" fill="#6a0000" stroke="#6a0000" stroke-width="20" stroke-linejoin="round">WiN</text>
    <text x="256" y="268" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="168" letter-spacing="2" fill="#990000" stroke="#990000" stroke-width="16" stroke-linejoin="round">WiN</text>
    <text x="256" y="263" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="168" letter-spacing="2" fill="#c62828" stroke="#c62828" stroke-width="12" stroke-linejoin="round">WiN</text>
    <text x="256" y="258" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="168" letter-spacing="2" fill="#d32f2f" stroke="#d32f2f" stroke-width="8" stroke-linejoin="round">WiN</text>

    <!-- Warm Rich Yellow Gold Front Face -->
    <text x="256" y="258" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="168" letter-spacing="2" fill="url(#winGoldFace)">WiN</text>
    
    <!-- White Top-Inner Gloss Arc Overlay on "i" Dot -->
    <circle cx="279" cy="151" r="17" fill="url(#winGoldFace)" stroke="#d32f2f" stroke-width="5"/>
    <circle cx="279" cy="151" r="13" fill="#fffde7"/>
  </g>

  <!-- ==================== 5-SLOT "RUMMY" CYLINDER REEL ==================== -->
  <g filter="url(#winMainShadow)">
    <!-- Slot Roller Outer Dark Rim -->
    <rect x="36" y="290" width="440" height="136" rx="68" fill="#011b10" stroke="#000000" stroke-width="6"/>

    <!-- Shiny Chrome Green Rim -->
    <rect x="40" y="294" width="432" height="128" rx="64" fill="url(#winReelGreenFrame)" stroke="#166534" stroke-width="2"/>

    <!-- 5-Slot White/Silver Cylinder Reel Body -->
    <rect x="48" y="302" width="416" height="112" rx="56" fill="url(#winReelSilverCylinder)"/>

    <!-- 5 Individual Reel Column Dividers -->
    <!-- Col 1 (R) / Col 2 (U) -->
    <path d="M128 302 L128 414" stroke="#94a3b8" stroke-width="3.5" opacity="0.75"/>
    <path d="M131 302 L131 414" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Col 2 (U) / Col 3 (M) -->
    <path d="M212 302 L212 414" stroke="#94a3b8" stroke-width="3.5" opacity="0.75"/>
    <path d="M215 302 L215 414" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Col 3 (M) / Col 4 (M) -->
    <path d="M298 302 L298 414" stroke="#94a3b8" stroke-width="3.5" opacity="0.75"/>
    <path d="M301 302 L301 414" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Col 4 (M) / Col 5 (Y) -->
    <path d="M382 302 L382 414" stroke="#94a3b8" stroke-width="3.5" opacity="0.75"/>
    <path d="M385 302 L385 414" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Reel Cylindrical Gloss Highlight (Top white reflection) -->
    <rect x="68" y="306" width="376" height="20" rx="10" fill="#ffffff" opacity="0.75"/>
    <rect x="78" y="310" width="356" height="6" rx="3" fill="#ffffff" opacity="0.95"/>

    <!-- Bottom subtle reflection -->
    <rect x="88" y="396" width="336" height="8" rx="4" fill="#ffffff" opacity="0.3"/>

    <!-- ==================== 5 EMERALD GREEN BOLD LETTERS: R - U - M - M - Y ==================== -->
    
    <!-- LETTER 1: "R" (x: 88) -->
    <g>
      <text x="88" y="396" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">R</text>
      <text x="88" y="392" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">R</text>
      <text x="88" y="392" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="url(#winRummyGreenGrad)">R</text>
    </g>

    <!-- LETTER 2: "U" (x: 170) -->
    <g>
      <text x="170" y="396" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">U</text>
      <text x="170" y="392" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">U</text>
      <text x="170" y="392" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="url(#winRummyGreenGrad)">U</text>
    </g>

    <!-- LETTER 3: "M" (x: 255) -->
    <g>
      <text x="255" y="396" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">M</text>
      <text x="255" y="392" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">M</text>
      <text x="255" y="392" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="url(#winRummyGreenGrad)">M</text>
    </g>

    <!-- LETTER 4: "M" (x: 340) -->
    <g>
      <text x="340" y="396" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">M</text>
      <text x="340" y="392" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">M</text>
      <text x="340" y="392" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="url(#winRummyGreenGrad)">M</text>
    </g>

    <!-- LETTER 5: "Y" (x: 424) -->
    <g>
      <text x="424" y="396" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">Y</text>
      <text x="424" y="392" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">Y</text>
      <text x="424" y="392" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="url(#winRummyGreenGrad)">Y</text>
    </g>
  </g>
</svg>

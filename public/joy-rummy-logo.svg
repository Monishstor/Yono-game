<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Emerald Green Quilted Background Gradient -->
    <radialGradient id="joyBgRadial" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#0b5e39"/>
      <stop offset="40%" stop-color="#054425"/>
      <stop offset="80%" stop-color="#022414"/>
      <stop offset="100%" stop-color="#011209"/>
    </radialGradient>

    <!-- Center Rotated Diamond Plate Gradient -->
    <linearGradient id="joyDiamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f6b41"/>
      <stop offset="50%" stop-color="#084d2d"/>
      <stop offset="100%" stop-color="#032a18"/>
    </linearGradient>

    <!-- 3D "JOY" Typography Gradients -->
    <linearGradient id="joyGoldFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffde7"/>
      <stop offset="15%" stop-color="#fff59d"/>
      <stop offset="50%" stop-color="#fbc02d"/>
      <stop offset="85%" stop-color="#f57f17"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="joyGoldBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fff9c4"/>
      <stop offset="65%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#bf360c"/>
    </linearGradient>

    <!-- Slot Roller Outer Metallic Green Frame -->
    <linearGradient id="joyReelGreenFrame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#16a34a"/>
      <stop offset="85%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>

    <!-- Slot Reel Body (White/Silver Cylinder) -->
    <linearGradient id="joyReelSilverCylinder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="12%" stop-color="#e2e8f0"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Emerald Green "RUMMY" Letter Face Gradient -->
    <linearGradient id="joyRummyGreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="30%" stop-color="#059669"/>
      <stop offset="70%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="joyMainShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <filter id="joyStarGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Squircle with Deep Green Texture -->
  <rect width="512" height="512" rx="112" fill="url(#joyBgRadial)"/>

  <!-- Checkerboard / Diamond Quilted Pattern -->
  <g opacity="0.25" stroke="#22c55e" stroke-width="1.2" fill="none">
    <path d="M-60 256 L256 -60 L572 256 L256 572 Z" />
    <path d="M0 256 L256 0 L512 256 L256 512 Z" />
    <path d="M64 256 L256 64 L448 256 L256 448 Z" />
    <path d="M128 256 L256 128 L384 256 L256 384 Z" />
    <path d="M192 256 L256 192 L320 256 L256 320 Z" />
    <line x1="64" y1="0" x2="512" y2="448" />
    <line x1="0" y1="64" x2="448" y2="512" />
    <line x1="0" y1="192" x2="320" y2="512" />
    <line x1="192" y1="0" x2="512" y2="320" />
    <line x1="448" y1="0" x2="0" y2="448" />
    <line x1="512" y1="64" x2="64" y2="512" />
    <line x1="320" y1="0" x2="0" y2="320" />
    <line x1="512" y1="192" x2="192" y2="512" />
  </g>

  <!-- Outer Rounded Neon Green Accent Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#22c55e" stroke-width="4.5" opacity="0.4"/>

  <!-- Center Rotated Diamond Plate with Neon Green Glow Border -->
  <g filter="url(#joyMainShadow)">
    <rect x="76" y="76" width="360" height="360" rx="44" transform="rotate(45 256 256)" fill="url(#joyDiamondGrad)" stroke="#22c55e" stroke-width="5" stroke-opacity="0.85"/>
  </g>

  <!-- Sparkle Stars near JOY text -->
  <g filter="url(#joyStarGlow)">
    <!-- Top Left Sparkle on O -->
    <path d="M280 110 Q280 124 294 124 Q280 124 280 138 Q280 124 266 124 Q280 124 280 110 Z" fill="#ffffff" />
    <path d="M280 113 Q280 124 290 124 Q280 124 280 135 Q280 124 270 124 Q280 124 280 113 Z" fill="#ffd700" />
    
    <!-- Right Sparkle on Y -->
    <path d="M378 170 Q378 184 392 184 Q378 184 378 198 Q378 184 364 184 Q378 184 378 170 Z" fill="#ffffff" />
    <path d="M378 173 Q378 184 388 184 Q378 184 378 195 Q378 184 368 184 Q378 184 378 173 Z" fill="#ffd700" />
  </g>

  <!-- ==================== 3D "JOY" BOLD TYPOGRAPHY ==================== -->
  <g filter="url(#joyMainShadow)">
    <!-- Deep Red/Brown 3D Extrusion Shadow Layers -->
    <text x="256" y="240" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="160" letter-spacing="4" fill="#3b0c00" stroke="#3b0c00" stroke-width="18" stroke-linejoin="round">JOY</text>
    <text x="256" y="235" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="160" letter-spacing="4" fill="#651800" stroke="#651800" stroke-width="15" stroke-linejoin="round">JOY</text>
    <text x="256" y="230" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="160" letter-spacing="4" fill="#992800" stroke="#992800" stroke-width="12" stroke-linejoin="round">JOY</text>
    <text x="256" y="225" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="160" letter-spacing="4" fill="#cf3f00" stroke="#cf3f00" stroke-width="10" stroke-linejoin="round">JOY</text>

    <!-- Warm Golden Bevel Outline -->
    <text x="256" y="220" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="160" letter-spacing="4" fill="url(#joyGoldBevel)" stroke="url(#joyGoldBevel)" stroke-width="8" stroke-linejoin="round">JOY</text>

    <!-- Crisp Rich Yellow Gold Front Face -->
    <text x="256" y="220" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="160" letter-spacing="4" fill="url(#joyGoldFace)">JOY</text>
  </g>

  <!-- ==================== 5-SLOT "RUMMY" CYLINDER REEL ==================== -->
  <g filter="url(#joyMainShadow)">
    <!-- Slot Roller Outer Dark Rim -->
    <rect x="36" y="258" width="440" height="136" rx="68" fill="#011b10" stroke="#000000" stroke-width="6"/>

    <!-- Shiny Chrome Green Rim -->
    <rect x="40" y="262" width="432" height="128" rx="64" fill="url(#joyReelGreenFrame)" stroke="#166534" stroke-width="2"/>

    <!-- 5-Slot White/Silver Cylinder Reel Body -->
    <rect x="48" y="270" width="416" height="112" rx="56" fill="url(#joyReelSilverCylinder)"/>

    <!-- 5 Individual Reel Column Dividers -->
    <!-- Col 1 (R) / Col 2 (U) -->
    <path d="M130 270 L130 382" stroke="#94a3b8" stroke-width="3.5" opacity="0.75"/>
    <path d="M133 270 L133 382" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Col 2 (U) / Col 3 (M) -->
    <path d="M214 270 L214 382" stroke="#94a3b8" stroke-width="3.5" opacity="0.75"/>
    <path d="M217 270 L217 382" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Col 3 (M) / Col 4 (M) -->
    <path d="M298 270 L298 382" stroke="#94a3b8" stroke-width="3.5" opacity="0.75"/>
    <path d="M301 270 L301 382" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Col 4 (M) / Col 5 (Y) -->
    <path d="M382 270 L382 382" stroke="#94a3b8" stroke-width="3.5" opacity="0.75"/>
    <path d="M385 270 L385 382" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Reel Cylindrical Gloss Highlight (Top white reflection) -->
    <rect x="68" y="274" width="376" height="20" rx="10" fill="#ffffff" opacity="0.75"/>
    <rect x="78" y="278" width="356" height="6" rx="3" fill="#ffffff" opacity="0.95"/>

    <!-- Bottom subtle reflection -->
    <rect x="88" y="364" width="336" height="8" rx="4" fill="#ffffff" opacity="0.3"/>

    <!-- ==================== 5 EMERALD GREEN BOLD LETTERS: R - U - M - M - Y ==================== -->
    
    <!-- LETTER 1: "R" (x: 88) -->
    <g>
      <text x="88" y="364" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">R</text>
      <text x="88" y="360" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">R</text>
      <text x="88" y="360" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="url(#joyRummyGreenGrad)">R</text>
    </g>

    <!-- LETTER 2: "U" (x: 172) -->
    <g>
      <text x="172" y="364" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">U</text>
      <text x="172" y="360" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">U</text>
      <text x="172" y="360" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="url(#joyRummyGreenGrad)">U</text>
    </g>

    <!-- LETTER 3: "M" (x: 256) -->
    <g>
      <text x="256" y="364" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">M</text>
      <text x="256" y="360" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">M</text>
      <text x="256" y="360" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="url(#joyRummyGreenGrad)">M</text>
    </g>

    <!-- LETTER 4: "M" (x: 340) -->
    <g>
      <text x="340" y="364" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">M</text>
      <text x="340" y="360" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">M</text>
      <text x="340" y="360" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="url(#joyRummyGreenGrad)">M</text>
    </g>

    <!-- LETTER 5: "Y" (x: 424) -->
    <g>
      <text x="424" y="364" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">Y</text>
      <text x="424" y="360" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">Y</text>
      <text x="424" y="360" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="url(#joyRummyGreenGrad)">Y</text>
    </g>
  </g>
</svg>

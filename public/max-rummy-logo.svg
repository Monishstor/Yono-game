<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Emerald Green Quilted Radial Gradient -->
    <radialGradient id="maxBgRadial" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#0c633c"/>
      <stop offset="40%" stop-color="#064828"/>
      <stop offset="80%" stop-color="#022816"/>
      <stop offset="100%" stop-color="#01130a"/>
    </radialGradient>

    <!-- Center Rotated Diamond Plate Gradient -->
    <linearGradient id="maxDiamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#117547"/>
      <stop offset="50%" stop-color="#095532"/>
      <stop offset="100%" stop-color="#04311c"/>
    </linearGradient>

    <!-- 3D MAX Gold Typography Face Gradient -->
    <linearGradient id="maxGoldFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="15%" stop-color="#fff59d"/>
      <stop offset="45%" stop-color="#ffd600"/>
      <stop offset="75%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>

    <!-- Slot Roller Outer Metallic Green Frame -->
    <linearGradient id="maxReelGreenFrame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#16a34a"/>
      <stop offset="85%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>

    <!-- Slot Reel Body (White/Silver Cylinder) -->
    <linearGradient id="maxReelSilverCylinder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="12%" stop-color="#e2e8f0"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Bright Green "RUMMY" Letter Face Gradient -->
    <linearGradient id="maxRummyGreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="40%" stop-color="#065f46"/>
      <stop offset="80%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c19"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="maxMainShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Base Squircle with Deep Green Texture -->
  <rect width="512" height="512" rx="112" fill="url(#maxBgRadial)"/>

  <!-- Checkerboard / Diamond Quilted Pattern -->
  <g opacity="0.25" stroke="#22c55e" stroke-width="1.2" fill="none">
    <path d="M-60 256 L256 -60 L572 256 L256 572 Z" />
    <path d="M0 256 L256 0 L512 256 L256 512 Z" />
    <path d="M64 256 L256 64 L448 256 L256 448 Z" />
    <path d="M128 256 L256 128 L384 256 L256 384 Z" />
    <path d="M192 256 L256 192 L320 256 L256 320 Z" />
    <line x1="64" y1="0" x2="512" y2="448" />
    <line x1="0" y1="64" x2="448" y2="512" />
    <line x1="0" y1="192" x2="320" y2="512" />
    <line x1="192" y1="0" x2="512" y2="320" />
    <line x1="448" y1="0" x2="0" y2="448" />
    <line x1="512" y1="64" x2="64" y2="512" />
    <line x1="320" y1="0" x2="0" y2="320" />
    <line x1="512" y1="192" x2="192" y2="512" />
  </g>

  <!-- Outer Rounded Neon Green Accent Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#22c55e" stroke-width="4.5" opacity="0.4"/>

  <!-- Center Rotated Diamond Plate with Neon Green Glow Border -->
  <g filter="url(#maxMainShadow)">
    <rect x="76" y="76" width="360" height="360" rx="44" transform="rotate(45 256 256)" fill="url(#maxDiamondGrad)" stroke="#22c55e" stroke-width="5" stroke-opacity="0.85"/>
  </g>

  <!-- ==================== 3D "MAX" TOP SECTION ==================== -->
  <g filter="url(#maxMainShadow)">
    <!-- Bottom Deep 3D Shadow -->
    <text x="256" y="248" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="168" letter-spacing="3" fill="#2d0c00" stroke="#2d0c00" stroke-width="20" stroke-linejoin="round">MAX</text>
    <!-- Extrusion Bevels -->
    <text x="256" y="242" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="168" letter-spacing="3" fill="#7c2d12" stroke="#7c2d12" stroke-width="16" stroke-linejoin="round">MAX</text>
    <text x="256" y="236" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="168" letter-spacing="3" fill="#c2410c" stroke="#c2410c" stroke-width="12" stroke-linejoin="round">MAX</text>
    <text x="256" y="230" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="168" letter-spacing="3" fill="#ea580c" stroke="#ea580c" stroke-width="8" stroke-linejoin="round">MAX</text>
    <text x="256" y="225" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="168" letter-spacing="3" fill="#f59e0b" stroke="#f59e0b" stroke-width="5" stroke-linejoin="round">MAX</text>
    <!-- Top Glowing Golden Face with Outline -->
    <text x="256" y="220" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="168" letter-spacing="3" fill="url(#maxGoldFace)" stroke="#fef08a" stroke-width="3.5" stroke-linejoin="round">MAX</text>

    <!-- Metallic Star Sparkle on 'X' top right tip -->
    <g transform="translate(438, 168)">
      <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4" fill="#ffffff"/>
      <polygon points="0,-10 2.5,-2.5 10,0 2.5,2.5 0,10 -2.5,2.5 -10,0 -2.5,-2.5" fill="#fef08a"/>
      <circle cx="0" cy="0" r="3" fill="#ffffff"/>
    </g>
  </g>

  <!-- ==================== 5-SLOT "[R] [U] [M] [M] [Y]" CYLINDER REEL ==================== -->
  <g filter="url(#maxMainShadow)">
    <!-- Slot Roller Outer Dark Rim -->
    <rect x="22" y="278" width="468" height="140" rx="70" fill="#011b10" stroke="#000000" stroke-width="6"/>

    <!-- Shiny Chrome Green Rim -->
    <rect x="26" y="282" width="460" height="132" rx="66" fill="url(#maxReelGreenFrame)" stroke="#166534" stroke-width="2"/>

    <!-- 5-Slot White/Silver Cylinder Reel Body -->
    <rect x="34" y="290" width="444" height="116" rx="58" fill="url(#maxReelSilverCylinder)"/>

    <!-- 4 Reel Column Dividers -->
    <!-- Col 1 (R) / Col 2 (U) -->
    <path d="M122 290 L122 406" stroke="#94a3b8" stroke-width="3" opacity="0.75"/>
    <path d="M124 290 L124 406" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Col 2 (U) / Col 3 (M) -->
    <path d="M212 290 L212 406" stroke="#94a3b8" stroke-width="3" opacity="0.75"/>
    <path d="M214 290 L214 406" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Col 3 (M) / Col 4 (M) -->
    <path d="M300 290 L300 406" stroke="#94a3b8" stroke-width="3" opacity="0.75"/>
    <path d="M302 290 L302 406" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Col 4 (M) / Col 5 (Y) -->
    <path d="M388 290 L388 406" stroke="#94a3b8" stroke-width="3" opacity="0.75"/>
    <path d="M390 290 L390 406" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Reel Cylindrical Gloss Highlight (Top white reflection) -->
    <rect x="54" y="294" width="404" height="22" rx="11" fill="#ffffff" opacity="0.75"/>
    <rect x="64" y="298" width="384" height="7" rx="3.5" fill="#ffffff" opacity="0.95"/>

    <!-- Bottom subtle reflection -->
    <rect x="74" y="388" width="364" height="8" rx="4" fill="#ffffff" opacity="0.3"/>

    <!-- ==================== 5 SLOTS: R - U - M - M - Y ==================== -->
    
    <!-- SLOT 1: LETTER 'R' (cx: 78) -->
    <g>
      <text x="78" y="386" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="96" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">R</text>
      <text x="78" y="382" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="96" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">R</text>
      <text x="78" y="382" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="96" fill="url(#maxRummyGreenGrad)">R</text>
    </g>

    <!-- SLOT 2: LETTER 'U' (cx: 167) -->
    <g>
      <text x="167" y="386" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="96" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">U</text>
      <text x="167" y="382" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="96" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">U</text>
      <text x="167" y="382" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="96" fill="url(#maxRummyGreenGrad)">U</text>
    </g>

    <!-- SLOT 3: LETTER 'M' (cx: 256) -->
    <g>
      <text x="256" y="386" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="96" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">M</text>
      <text x="256" y="382" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="96" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">M</text>
      <text x="256" y="382" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="96" fill="url(#maxRummyGreenGrad)">M</text>
    </g>

    <!-- SLOT 4: LETTER 'M' (cx: 345) -->
    <g>
      <text x="345" y="386" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="96" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">M</text>
      <text x="345" y="382" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="96" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">M</text>
      <text x="345" y="382" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="96" fill="url(#maxRummyGreenGrad)">M</text>
    </g>

    <!-- SLOT 5: LETTER 'Y' (cx: 434) -->
    <g>
      <text x="434" y="386" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="96" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">Y</text>
      <text x="434" y="382" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="96" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">Y</text>
      <text x="434" y="382" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="96" fill="url(#maxRummyGreenGrad)">Y</text>
    </g>
  </g>
</svg>

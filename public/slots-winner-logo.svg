<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Emerald Green Luxury Casino Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#0b5e39"/>
      <stop offset="45%" stop-color="#053e24"/>
      <stop offset="85%" stop-color="#022414"/>
      <stop offset="100%" stop-color="#01140b"/>
    </radialGradient>

    <!-- Center Rotated Diamond Plate Gradient -->
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e683f"/>
      <stop offset="50%" stop-color="#084d2d"/>
      <stop offset="100%" stop-color="#032e1a"/>
    </linearGradient>

    <!-- 3D "SLOTS" Gold Gradient -->
    <linearGradient id="goldFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffed6"/>
      <stop offset="15%" stop-color="#ffea3b"/>
      <stop offset="60%" stop-color="#fdb813"/>
      <stop offset="100%" stop-color="#f27d00"/>
    </linearGradient>

    <linearGradient id="goldBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ffec8b"/>
      <stop offset="75%" stop-color="#ffa000"/>
      <stop offset="100%" stop-color="#b73a00"/>
    </linearGradient>

    <!-- Slot Cylinder White/Silver Reel Gradient -->
    <linearGradient id="reelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="10%" stop-color="#e2e8f0"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Cylinder Outer Green Bevel Border -->
    <linearGradient id="reelBorderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="35%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <!-- Letters "WINNER" Green Gradient -->
    <linearGradient id="winnerTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="60%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="mainShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <filter id="textGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Icon Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Diamond Quilted Background Grid Lines -->
  <g opacity="0.25" stroke="#22c55e" stroke-width="1.5" fill="none">
    <path d="M-60 256 L256 -60 L572 256 L256 572 Z" />
    <path d="M0 256 L256 0 L512 256 L256 512 Z" />
    <path d="M64 256 L256 64 L448 256 L256 448 Z" />
    <path d="M128 256 L256 128 L384 256 L256 384 Z" />
    <path d="M192 256 L256 192 L320 256 L256 320 Z" />
    <line x1="64" y1="0" x2="512" y2="448" />
    <line x1="0" y1="64" x2="448" y2="512" />
    <line x1="0" y1="192" x2="320" y2="512" />
    <line x1="192" y1="0" x2="512" y2="320" />
    <line x1="448" y1="0" x2="0" y2="448" />
    <line x1="512" y1="64" x2="64" y2="512" />
    <line x1="320" y1="0" x2="0" y2="320" />
    <line x1="512" y1="192" x2="192" y2="512" />
  </g>

  <!-- Outer Rounded Green Neon Accent Line -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#22c55e" stroke-width="5" opacity="0.45"/>

  <!-- Center Rotated Diamond Plate with Neon Green Glow Border -->
  <g filter="url(#mainShadow)">
    <rect x="76" y="76" width="360" height="360" rx="44" transform="rotate(45 256 256)" fill="url(#diamondGrad)" stroke="#22c55e" stroke-width="5" stroke-opacity="0.85"/>
  </g>

  <!-- ================= 3D GOLDEN "SLOTS" TEXT ================= -->
  <g filter="url(#mainShadow)">
    <!-- 3D Extruded Deep Layers (Rich Amber / Cognac / Dark Orange) -->
    <text x="256" y="246" font-family="'Arial Black', 'Impact', sans-serif" font-size="124" font-weight="900" text-anchor="middle" fill="#2d0d00" letter-spacing="3">SLOTS</text>
    <text x="256" y="242" font-family="'Arial Black', 'Impact', sans-serif" font-size="124" font-weight="900" text-anchor="middle" fill="#4d1600" letter-spacing="3">SLOTS</text>
    <text x="256" y="238" font-family="'Arial Black', 'Impact', sans-serif" font-size="124" font-weight="900" text-anchor="middle" fill="#782300" letter-spacing="3">SLOTS</text>
    <text x="256" y="234" font-family="'Arial Black', 'Impact', sans-serif" font-size="124" font-weight="900" text-anchor="middle" fill="#a43300" letter-spacing="3">SLOTS</text>
    <text x="256" y="230" font-family="'Arial Black', 'Impact', sans-serif" font-size="124" font-weight="900" text-anchor="middle" fill="#d24800" letter-spacing="3">SLOTS</text>
    <text x="256" y="226" font-family="'Arial Black', 'Impact', sans-serif" font-size="124" font-weight="900" text-anchor="middle" fill="#f06100" letter-spacing="3">SLOTS</text>

    <!-- Front Beveled Golden Face -->
    <text x="256" y="222" font-family="'Arial Black', 'Impact', sans-serif" font-size="124" font-weight="900" text-anchor="middle" fill="url(#goldFace)" stroke="url(#goldBevel)" stroke-width="7" stroke-linejoin="round" letter-spacing="3">SLOTS</text>
  </g>

  <!-- Golden Brilliant Star Glint on Top Right of 'T' in SLOTS -->
  <g transform="translate(306, 126)" filter="url(#starGlow)">
    <circle cx="0" cy="0" r="18" fill="#ffd700" opacity="0.6"/>
    <!-- 4-point Diamond Star Flares -->
    <path d="M0 -34 Q2 -6 34 0 Q2 6 0 34 Q-2 6 -34 0 Q-2 -6 0 -34 Z" fill="#ffffff" />
    <path d="M0 -22 Q1.5 -4 22 0 Q1.5 4 0 22 Q-1.5 4 -22 0 Q-1.5 -4 0 -22 Z" fill="#fff9a6" />
    <!-- Diagonal Subtle Glints -->
    <path d="M-12 -12 L12 12 M-12 12 L12 -12" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <circle cx="0" cy="0" r="4.5" fill="#ffffff" />
  </g>

  <!-- ================= HORIZONTAL CYLINDER SLOT REEL "WINNER" ================= -->
  <g filter="url(#mainShadow)">
    <!-- Outer Metallic Cylinder Pill Frame with Neon Green Bevel Trim -->
    <rect x="18" y="260" width="476" height="130" rx="65" fill="url(#reelGrad)" stroke="url(#reelBorderGrad)" stroke-width="10"/>

    <!-- Cylinder Top Glass Reflection -->
    <rect x="32" y="266" width="448" height="18" rx="9" fill="#ffffff" opacity="0.9"/>
    <!-- Cylinder Bottom Curve Shadow -->
    <rect x="32" y="364" width="448" height="18" rx="9" fill="#334155" opacity="0.35"/>

    <!-- 6 Slot Segment Dividers: [ W | I | N | N | E | R ] -->
    <line x1="96" y1="262" x2="96" y2="388" stroke="#8a99a4" stroke-width="4" stroke-linecap="round"/>
    <line x1="172" y1="262" x2="172" y2="388" stroke="#8a99a4" stroke-width="4" stroke-linecap="round"/>
    <line x1="256" y1="262" x2="256" y2="388" stroke="#8a99a4" stroke-width="4" stroke-linecap="round"/>
    <line x1="338" y1="262" x2="338" y2="388" stroke="#8a99a4" stroke-width="4" stroke-linecap="round"/>
    <line x1="416" y1="262" x2="416" y2="388" stroke="#8a99a4" stroke-width="4" stroke-linecap="round"/>

    <!-- Highlights next to divider lines for 3D barrel reflection -->
    <line x1="99" y1="263" x2="99" y2="387" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
    <line x1="175" y1="263" x2="175" y2="387" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
    <line x1="259" y1="263" x2="259" y2="387" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
    <line x1="341" y1="263" x2="341" y2="387" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
    <line x1="419" y1="263" x2="419" y2="387" stroke="#ffffff" stroke-width="2" opacity="0.7"/>

    <!-- ================= 3D GREEN "W I N N E R" LETTERS ================= -->
    <!-- W -->
    <text x="56" y="354" font-family="'Arial Black', 'Impact', sans-serif" font-size="70" font-weight="900" text-anchor="middle" fill="#011e11">W</text>
    <text x="56" y="350" font-family="'Arial Black', 'Impact', sans-serif" font-size="70" font-weight="900" text-anchor="middle" fill="url(#winnerTextGrad)">W</text>

    <!-- I -->
    <text x="134" y="354" font-family="'Arial Black', 'Impact', sans-serif" font-size="70" font-weight="900" text-anchor="middle" fill="#011e11">I</text>
    <text x="134" y="350" font-family="'Arial Black', 'Impact', sans-serif" font-size="70" font-weight="900" text-anchor="middle" fill="url(#winnerTextGrad)">I</text>

    <!-- N -->
    <text x="214" y="354" font-family="'Arial Black', 'Impact', sans-serif" font-size="70" font-weight="900" text-anchor="middle" fill="#011e11">N</text>
    <text x="214" y="350" font-family="'Arial Black', 'Impact', sans-serif" font-size="70" font-weight="900" text-anchor="middle" fill="url(#winnerTextGrad)">N</text>

    <!-- N -->
    <text x="297" y="354" font-family="'Arial Black', 'Impact', sans-serif" font-size="70" font-weight="900" text-anchor="middle" fill="#011e11">N</text>
    <text x="297" y="350" font-family="'Arial Black', 'Impact', sans-serif" font-size="70" font-weight="900" text-anchor="middle" fill="url(#winnerTextGrad)">N</text>

    <!-- E -->
    <text x="377" y="354" font-family="'Arial Black', 'Impact', sans-serif" font-size="70" font-weight="900" text-anchor="middle" fill="#011e11">E</text>
    <text x="377" y="350" font-family="'Arial Black', 'Impact', sans-serif" font-size="70" font-weight="900" text-anchor="middle" fill="url(#winnerTextGrad)">E</text>

    <!-- R -->
    <text x="456" y="354" font-family="'Arial Black', 'Impact', sans-serif" font-size="70" font-weight="900" text-anchor="middle" fill="#011e11">R</text>
    <text x="456" y="350" font-family="'Arial Black', 'Impact', sans-serif" font-size="70" font-weight="900" text-anchor="middle" fill="url(#winnerTextGrad)">R</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient (Deep Emerald Green) -->
    <radialGradient id="hindiBgRadial" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#05532b"/>
      <stop offset="40%" stop-color="#03381d"/>
      <stop offset="75%" stop-color="#022312"/>
      <stop offset="100%" stop-color="#01130a"/>
    </radialGradient>

    <!-- Quilted Diamond Pattern -->
    <pattern id="quiltedDiamond" width="48" height="48" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="48" height="48" fill="none" stroke="#085a30" stroke-width="1.8" opacity="0.45"/>
      <circle cx="24" cy="24" r="2.5" fill="#10b981" opacity="0.3"/>
    </pattern>

    <!-- Center Diamond Gradient -->
    <linearGradient id="centerDiamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a6939"/>
      <stop offset="50%" stop-color="#043d1f"/>
      <stop offset="100%" stop-color="#022413"/>
    </linearGradient>

    <!-- Glowing Diamond Border Gradient -->
    <linearGradient id="diamondBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Outer Squircle Rim Gradient -->
    <linearGradient id="outerRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#059669" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#022c17" stop-opacity="0.8"/>
    </linearGradient>

    <!-- 3D "HINDI" Gold Gradient -->
    <linearGradient id="hindiGoldFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="15%" stop-color="#fffb99"/>
      <stop offset="45%" stop-color="#ffcc00"/>
      <stop offset="80%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Blue Glowing Star Gradient for dot of 'i' -->
    <linearGradient id="blueStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#7dd3fc"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Reel 3D Cylindrical Metallic Gradient -->
    <linearGradient id="reelCylinderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="8%" stop-color="#94a3b8"/>
      <stop offset="22%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="78%" stop-color="#cbd5e1"/>
      <stop offset="92%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Reel Outer Metallic Border Gradient -->
    <linearGradient id="reelBorderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="30%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Deep Green Gradient for '7' and Cherries -->
    <linearGradient id="reelGreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d7a43"/>
      <stop offset="40%" stop-color="#06542c"/>
      <stop offset="80%" stop-color="#03381d"/>
      <stop offset="100%" stop-color="#022412"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="mainShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <filter id="blueStarGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="sparkleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Background Squircle Base -->
  <rect width="512" height="512" rx="104" fill="url(#hindiBgRadial)"/>

  <!-- 2. Quilted Diamond Texture Overlay -->
  <rect width="512" height="512" rx="104" fill="url(#quiltedDiamond)"/>

  <!-- 3. Outer Subtle Squircle Rim -->
  <rect x="8" y="8" width="496" height="496" rx="96" fill="none" stroke="url(#outerRimGrad)" stroke-width="4"/>
  <rect x="14" y="14" width="484" height="484" rx="90" fill="none" stroke="#000000" stroke-width="2" opacity="0.6"/>

  <!-- 4. Center Rotated Green Diamond Frame with Glow -->
  <g filter="url(#mainShadow)">
    <rect x="126" y="126" width="260" height="260" rx="34" transform="rotate(45 256 256)" fill="url(#centerDiamondGrad)" stroke="url(#diamondBorderGrad)" stroke-width="8"/>
    <rect x="134" y="134" width="244" height="244" rx="28" transform="rotate(45 256 256)" fill="none" stroke="#6ee7b7" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- ========================================================
       5. 3D GOLDEN "HINDI" TYPOGRAPHY + BLUE STAR
  ======================================================== -->
  <g filter="url(#mainShadow)">
    <!-- Base Deep Shadow -->
    <text x="252" y="238" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="124" letter-spacing="1" fill="#1b0800" stroke="#1b0800" stroke-width="16" stroke-linejoin="round">HINDI</text>

    <!-- Deep Red-Brown Extrusion -->
    <text x="252" y="234" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="124" letter-spacing="1" fill="#7c2d12" stroke="#7c2d12" stroke-width="14" stroke-linejoin="round">HINDI</text>

    <!-- Warm Amber-Orange Bevel Layer -->
    <text x="252" y="228" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="124" letter-spacing="1" fill="#c2410c" stroke="#c2410c" stroke-width="10" stroke-linejoin="round">HINDI</text>
    <text x="252" y="222" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="124" letter-spacing="1" fill="#d97706" stroke="#d97706" stroke-width="6" stroke-linejoin="round">HINDI</text>
    <text x="252" y="216" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="124" letter-spacing="1" fill="#f59e0b" stroke="#f59e0b" stroke-width="3" stroke-linejoin="round">HINDI</text>

    <!-- Bright Glossy Golden Face -->
    <text x="252" y="214" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="124" letter-spacing="1" fill="url(#hindiGoldFace)" stroke="#ffffff" stroke-width="2" stroke-linejoin="round">HINDI</text>
  </g>

  <!-- Blue Glowing Star replacing/adorning the dot of the 'i' on top right -->
  <g transform="translate(422, 142)" filter="url(#blueStarGlow)">
    <!-- 5-Point Cyan/Blue Beveled Star -->
    <polygon points="0,-32 10,-10 32,-8 15,9 20,32 0,20 -20,32 -15,9 -32,-8 -10,-10" fill="url(#blueStarGrad)" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="5" fill="#ffffff"/>
  </g>

  <!-- Sparkles on H and N -->
  <g transform="translate(90, 148)" filter="url(#sparkleGlow)">
    <path d="M0 -18 Q2 -2 18 0 Q2 2 0 18 Q-2 2 -18 0 Q-2 -2 0 -18 Z" fill="#ffffff"/>
    <circle cx="0" cy="0" r="3" fill="#fef08a"/>
  </g>
  <g transform="translate(325, 142)" filter="url(#sparkleGlow)">
    <path d="M0 -16 Q1.5 -1.5 16 0 Q1.5 1.5 0 16 Q-1.5 1.5 -16 0 Q-1.5 -1.5 0 -16 Z" fill="#ffffff"/>
    <circle cx="0" cy="0" r="2.5" fill="#fef08a"/>
  </g>

  <!-- ========================================================
       6. 3D METALLIC SLOT MACHINE REEL [ 🍒 | 7 | 7 | 7 | 🍒 ]
  ======================================================== -->
  <g filter="url(#mainShadow)">
    <!-- Reel Outer Capsule Shadow -->
    <rect x="36" y="260" width="440" height="128" rx="64" fill="#000000" opacity="0.6"/>

    <!-- Reel Metallic Frame Outer Rim -->
    <rect x="34" y="256" width="444" height="132" rx="66" fill="url(#reelBorderGrad)" stroke="#1e293b" stroke-width="4"/>

    <!-- Reel Cylinder Body -->
    <rect x="42" y="262" width="428" height="120" rx="60" fill="url(#reelCylinderGrad)"/>

    <!-- Cylindrical Top Glass Highlight -->
    <path d="M102 270 Q256 266 410 270" stroke="#ffffff" stroke-width="6" opacity="0.85" stroke-linecap="round"/>

    <!-- 4 Vertical Reel Dividers (5 Columns) -->
    <g transform="translate(126, 262)">
      <line x1="0" y1="2" x2="0" y2="118" stroke="#334155" stroke-width="4"/>
      <line x1="2" y1="2" x2="2" y2="118" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
    </g>
    <g transform="translate(212, 262)">
      <line x1="0" y1="0" x2="0" y2="120" stroke="#334155" stroke-width="4"/>
      <line x1="2" y1="0" x2="2" y2="120" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
    </g>
    <g transform="translate(298, 262)">
      <line x1="0" y1="0" x2="0" y2="120" stroke="#334155" stroke-width="4"/>
      <line x1="2" y1="0" x2="2" y2="120" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
    </g>
    <g transform="translate(384, 262)">
      <line x1="0" y1="2" x2="0" y2="118" stroke="#334155" stroke-width="4"/>
      <line x1="2" y1="2" x2="2" y2="118" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
    </g>

    <!-- ==================== 5 SLOTS ( 🍒  7  7  7  🍒 ) ==================== -->
    <!-- Slot 1: DOUBLE CHERRIES 🍒 (Center ~ 84) -->
    <g transform="translate(84, 324)">
      <!-- Cherry Stems & Leaf -->
      <path d="M-12 -20 C-6 -26, 4 -28, 12 -24 C6 -18, -4 -16, -12 -20 Z" fill="#054a27" stroke="#011f0f" stroke-width="1.5"/>
      <path d="M0 -22 C-4 -8, -10 -2, -12 6" fill="none" stroke="#011f0f" stroke-width="4" stroke-linecap="round"/>
      <path d="M0 -22 C4 -6, 10 0, 14 6" fill="none" stroke="#011f0f" stroke-width="4" stroke-linecap="round"/>
      <!-- Left Cherry -->
      <circle cx="-14" cy="10" r="16" fill="#011f0f"/>
      <circle cx="-14" cy="8" r="15" fill="url(#reelGreenGrad)" stroke="#22c55e" stroke-width="1.5"/>
      <circle cx="-18" cy="4" r="4" fill="#86efac" opacity="0.7"/>
      <!-- Right Cherry -->
      <circle cx="12" cy="12" r="16" fill="#011f0f"/>
      <circle cx="12" cy="10" r="15" fill="url(#reelGreenGrad)" stroke="#22c55e" stroke-width="1.5"/>
      <circle cx="8" cy="6" r="4" fill="#86efac" opacity="0.7"/>
    </g>

    <!-- Slot 2: Number '7' (Center ~ 169) -->
    <g>
      <text x="169" y="348" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="82" fill="#011f0f" stroke="#011f0f" stroke-width="6" stroke-linejoin="round">7</text>
      <text x="169" y="344" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="82" fill="url(#reelGreenGrad)" stroke="#22c55e" stroke-width="1.5">7</text>
    </g>

    <!-- Slot 3: Number '7' (Center ~ 255) -->
    <g>
      <text x="255" y="348" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="82" fill="#011f0f" stroke="#011f0f" stroke-width="6" stroke-linejoin="round">7</text>
      <text x="255" y="344" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="82" fill="url(#reelGreenGrad)" stroke="#22c55e" stroke-width="1.5">7</text>
    </g>

    <!-- Slot 4: Number '7' (Center ~ 341) -->
    <g>
      <text x="341" y="348" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="82" fill="#011f0f" stroke="#011f0f" stroke-width="6" stroke-linejoin="round">7</text>
      <text x="341" y="344" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="82" fill="url(#reelGreenGrad)" stroke="#22c55e" stroke-width="1.5">7</text>
    </g>

    <!-- Slot 5: DOUBLE CHERRIES 🍒 (Center ~ 427) -->
    <g transform="translate(427, 324)">
      <!-- Cherry Stems & Leaf -->
      <path d="M-12 -20 C-6 -26, 4 -28, 12 -24 C6 -18, -4 -16, -12 -20 Z" fill="#054a27" stroke="#011f0f" stroke-width="1.5"/>
      <path d="M0 -22 C-4 -8, -10 -2, -12 6" fill="none" stroke="#011f0f" stroke-width="4" stroke-linecap="round"/>
      <path d="M0 -22 C4 -6, 10 0, 14 6" fill="none" stroke="#011f0f" stroke-width="4" stroke-linecap="round"/>
      <!-- Left Cherry -->
      <circle cx="-14" cy="10" r="16" fill="#011f0f"/>
      <circle cx="-14" cy="8" r="15" fill="url(#reelGreenGrad)" stroke="#22c55e" stroke-width="1.5"/>
      <circle cx="-18" cy="4" r="4" fill="#86efac" opacity="0.7"/>
      <!-- Right Cherry -->
      <circle cx="12" cy="12" r="16" fill="#011f0f"/>
      <circle cx="12" cy="10" r="15" fill="url(#reelGreenGrad)" stroke="#22c55e" stroke-width="1.5"/>
      <circle cx="8" cy="6" r="4" fill="#86efac" opacity="0.7"/>
    </g>

    <!-- Reel Lower Curve Shadow -->
    <path d="M52 360 C52 376 96 380 256 380 C416 380 460 376 460 360" stroke="#475569" stroke-width="3" opacity="0.6" fill="none"/>
  </g>
</svg>

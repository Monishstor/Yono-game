<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient (Deep Casino Emerald Green) -->
    <radialGradient id="rummyBgRadial" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#05532b"/>
      <stop offset="40%" stop-color="#03381d"/>
      <stop offset="75%" stop-color="#022312"/>
      <stop offset="100%" stop-color="#01130a"/>
    </radialGradient>

    <!-- Card Suit Background Pattern (Spades, Hearts, Clubs, Diamonds) -->
    <pattern id="cardSuitsPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <!-- Spade -->
      <path d="M15 10 C12 5, 6 9, 6 14 C6 17, 9 19, 13 21 C14 22, 14 24, 13 25 L17 25 C16 24, 16 22, 17 21 C21 19, 24 17, 24 14 C24 9, 18 5, 15 10 Z" fill="#0b5e32" opacity="0.3"/>
      <!-- Club -->
      <g transform="translate(42, 38) scale(0.65)" fill="#0b5e32" opacity="0.3">
        <circle cx="10" cy="7" r="4.5"/>
        <circle cx="5" cy="14" r="4.5"/>
        <circle cx="15" cy="14" r="4.5"/>
        <path d="M9 13 L11 13 L13 22 L7 22 Z"/>
      </g>
      <!-- Diamond -->
      <polygon points="45,12 50,18 45,24 40,18" fill="#0b5e32" opacity="0.25"/>
    </pattern>

    <!-- Center Diamond Gradient -->
    <linearGradient id="centerDiamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a6939"/>
      <stop offset="50%" stop-color="#043d1f"/>
      <stop offset="100%" stop-color="#022413"/>
    </linearGradient>

    <!-- Glowing Diamond Border Gradient -->
    <linearGradient id="diamondBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="45%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <!-- Outer Squircle Rim Gradient -->
    <linearGradient id="outerRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#16a34a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#022c17" stop-opacity="0.85"/>
    </linearGradient>

    <!-- 3D "RUMMY" Gold Gradient -->
    <linearGradient id="rummyGoldFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="15%" stop-color="#fffb99"/>
      <stop offset="45%" stop-color="#ffcc00"/>
      <stop offset="80%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Reel 3D Cylindrical Metallic Gradient -->
    <linearGradient id="reelCylinderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="8%" stop-color="#94a3b8"/>
      <stop offset="22%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="78%" stop-color="#cbd5e1"/>
      <stop offset="92%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Reel Outer Metallic Border Gradient -->
    <linearGradient id="reelBorderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="30%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Deep Green Gradient for Letters & Suit Symbols -->
    <linearGradient id="suitGreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d7a43"/>
      <stop offset="40%" stop-color="#06542c"/>
      <stop offset="80%" stop-color="#03381d"/>
      <stop offset="100%" stop-color="#022412"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="mainShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <filter id="sparkleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Background Squircle Base -->
  <rect width="512" height="512" rx="104" fill="url(#rummyBgRadial)"/>

  <!-- 2. Suit Pattern Overlay -->
  <rect width="512" height="512" rx="104" fill="url(#cardSuitsPattern)"/>

  <!-- 3. Outer Subtle Squircle Rim -->
  <rect x="8" y="8" width="496" height="496" rx="96" fill="none" stroke="url(#outerRimGrad)" stroke-width="4"/>
  <rect x="14" y="14" width="484" height="484" rx="90" fill="none" stroke="#000000" stroke-width="2" opacity="0.6"/>

  <!-- 4. Center Rotated Green Diamond Frame with Glowing Border & Perimeter Studs -->
  <g filter="url(#mainShadow)">
    <!-- Outer Diamond Glow/Stroke -->
    <rect x="126" y="126" width="260" height="260" rx="34" transform="rotate(45 256 256)" fill="url(#centerDiamondGrad)" stroke="url(#diamondBorderGrad)" stroke-width="8"/>
    <!-- Inner Diamond Inset Line -->
    <rect x="134" y="134" width="244" height="244" rx="28" transform="rotate(45 256 256)" fill="none" stroke="#86efac" stroke-width="2.5" opacity="0.55"/>

    <!-- Light bulb / Pearl studs along diamond edge -->
    <g transform="rotate(45 256 256)" fill="#fef08a" opacity="0.75">
      <circle cx="140" cy="140" r="3.5"/>
      <circle cx="180" cy="140" r="3"/>
      <circle cx="220" cy="140" r="3"/>
      <circle cx="260" cy="140" r="3"/>
      <circle cx="300" cy="140" r="3"/>
      <circle cx="340" cy="140" r="3"/>
      <circle cx="372" cy="140" r="3.5"/>

      <circle cx="372" cy="180" r="3"/>
      <circle cx="372" cy="220" r="3"/>
      <circle cx="372" cy="260" r="3"/>
      <circle cx="372" cy="300" r="3"/>
      <circle cx="372" cy="340" r="3"/>
      <circle cx="372" cy="372" r="3.5"/>

      <circle cx="140" cy="372" r="3.5"/>
      <circle cx="180" cy="372" r="3"/>
      <circle cx="220" cy="372" r="3"/>
      <circle cx="260" cy="372" r="3"/>
      <circle cx="300" cy="372" r="3"/>
      <circle cx="340" cy="372" r="3"/>

      <circle cx="140" cy="180" r="3"/>
      <circle cx="140" cy="220" r="3"/>
      <circle cx="140" cy="260" r="3"/>
      <circle cx="140" cy="300" r="3"/>
      <circle cx="140" cy="340" r="3"/>
    </g>
  </g>

  <!-- ========================================================
       5. 3D GOLDEN "RUMMY" TYPOGRAPHY
  ======================================================== -->
  <g filter="url(#mainShadow)">
    <!-- Deep Dark Base Shadow -->
    <text x="256" y="238" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="116" letter-spacing="1" fill="#1b0800" stroke="#1b0800" stroke-width="16" stroke-linejoin="round">RUMMY</text>

    <!-- Deep Red-Brown Extrusion -->
    <text x="256" y="234" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="116" letter-spacing="1" fill="#7c2d12" stroke="#7c2d12" stroke-width="14" stroke-linejoin="round">RUMMY</text>

    <!-- Warm Amber-Orange Bevel Layer -->
    <text x="256" y="228" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="116" letter-spacing="1" fill="#c2410c" stroke="#c2410c" stroke-width="10" stroke-linejoin="round">RUMMY</text>
    <text x="256" y="222" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="116" letter-spacing="1" fill="#d97706" stroke="#d97706" stroke-width="6" stroke-linejoin="round">RUMMY</text>
    <text x="256" y="216" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="116" letter-spacing="1" fill="#f59e0b" stroke="#f59e0b" stroke-width="3" stroke-linejoin="round">RUMMY</text>

    <!-- Bright Glossy Golden Face -->
    <text x="256" y="214" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="116" letter-spacing="1" fill="url(#rummyGoldFace)" stroke="#ffffff" stroke-width="2" stroke-linejoin="round">RUMMY</text>
  </g>

  <!-- Golden Flare Sparkle on 'M' & 'Y' -->
  <g transform="translate(325, 142)" filter="url(#sparkleGlow)">
    <path d="M0 -22 Q2 -2 22 0 Q2 2 0 22 Q-2 2 -22 0 Q-2 -2 0 -22 Z" fill="#ffffff"/>
    <path d="M0 -12 Q1 -1 12 0 Q1 1 0 12 Q-1 1 -12 0 Q-1 -1 0 -12 Z" fill="#fef08a"/>
    <circle cx="0" cy="0" r="3.5" fill="#ffffff"/>
  </g>
  <g transform="translate(108, 148)" filter="url(#sparkleGlow)">
    <path d="M0 -16 Q1.5 -1.5 16 0 Q1.5 1.5 0 16 Q-1.5 1.5 -16 0 Q-1.5 -1.5 0 -16 Z" fill="#ffffff"/>
    <circle cx="0" cy="0" r="2.5" fill="#fef08a"/>
  </g>

  <!-- ========================================================
       6. 3D METALLIC SLOT MACHINE REEL [ ♠ | 8 | 8 | 8 | ♣ ]
  ======================================================== -->
  <g filter="url(#mainShadow)">
    <!-- Reel Outer Capsule Shadow -->
    <rect x="36" y="260" width="440" height="128" rx="64" fill="#000000" opacity="0.6"/>

    <!-- Reel Metallic Frame Outer Rim -->
    <rect x="34" y="256" width="444" height="132" rx="66" fill="url(#reelBorderGrad)" stroke="#1e293b" stroke-width="4"/>

    <!-- Reel Cylinder Body -->
    <rect x="42" y="262" width="428" height="120" rx="60" fill="url(#reelCylinderGrad)"/>

    <!-- Cylindrical Top Glass Highlight -->
    <path d="M102 270 Q256 266 410 270" stroke="#ffffff" stroke-width="6" opacity="0.85" stroke-linecap="round"/>

    <!-- 4 Vertical Reel Dividers (5 Columns) -->
    <!-- Col 1 / Col 2 Divider -->
    <g transform="translate(126, 262)">
      <line x1="0" y1="2" x2="0" y2="118" stroke="#334155" stroke-width="4"/>
      <line x1="2" y1="2" x2="2" y2="118" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
    </g>

    <!-- Col 2 / Col 3 Divider -->
    <g transform="translate(212, 262)">
      <line x1="0" y1="0" x2="0" y2="120" stroke="#334155" stroke-width="4"/>
      <line x1="2" y1="0" x2="2" y2="120" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
    </g>

    <!-- Col 3 / Col 4 Divider -->
    <g transform="translate(298, 262)">
      <line x1="0" y1="0" x2="0" y2="120" stroke="#334155" stroke-width="4"/>
      <line x1="2" y1="0" x2="2" y2="120" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
    </g>

    <!-- Col 4 / Col 5 Divider -->
    <g transform="translate(384, 262)">
      <line x1="0" y1="2" x2="0" y2="118" stroke="#334155" stroke-width="4"/>
      <line x1="2" y1="2" x2="2" y2="118" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
    </g>

    <!-- ==================== 5 SLOTS ( ♠  8  8  8  ♣ ) ==================== -->
    <!-- Slot 1: SPADE ♠ (Center ~ 84) -->
    <g transform="translate(84, 322)">
      <!-- Outer shadow -->
      <path d="M0 -34 C-8 -22, -26 -14, -26 4 C-26 14, -18 20, -8 20 C-2 20, 0 16, 0 16 C0 16, 2 20, 8 20 C18 20, 26 14, 26 4 C26 -14, 8 -22, 0 -34 Z M-6 18 L-8 30 L8 30 L6 18 Z" fill="#011f0f" stroke="#011f0f" stroke-width="6" stroke-linejoin="round"/>
      <!-- Inner gradient -->
      <path d="M0 -34 C-8 -22, -26 -14, -26 4 C-26 14, -18 20, -8 20 C-2 20, 0 16, 0 16 C0 16, 2 20, 8 20 C18 20, 26 14, 26 4 C26 -14, 8 -22, 0 -34 Z M-6 18 L-8 30 L8 30 L6 18 Z" fill="url(#suitGreenGrad)" stroke="#22c55e" stroke-width="1.5"/>
    </g>

    <!-- Slot 2: Number '8' (Center ~ 169) -->
    <g>
      <text x="169" y="348" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="82" fill="#011f0f" stroke="#011f0f" stroke-width="6" stroke-linejoin="round">8</text>
      <text x="169" y="344" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="82" fill="url(#suitGreenGrad)" stroke="#22c55e" stroke-width="1.5">8</text>
    </g>

    <!-- Slot 3: Number '8' (Center ~ 255) -->
    <g>
      <text x="255" y="348" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="82" fill="#011f0f" stroke="#011f0f" stroke-width="6" stroke-linejoin="round">8</text>
      <text x="255" y="344" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="82" fill="url(#suitGreenGrad)" stroke="#22c55e" stroke-width="1.5">8</text>
    </g>

    <!-- Slot 4: Number '8' (Center ~ 341) -->
    <g>
      <text x="341" y="348" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="82" fill="#011f0f" stroke="#011f0f" stroke-width="6" stroke-linejoin="round">8</text>
      <text x="341" y="344" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="82" fill="url(#suitGreenGrad)" stroke="#22c55e" stroke-width="1.5">8</text>
    </g>

    <!-- Slot 5: CLUB ♣ (Center ~ 427) -->
    <g transform="translate(427, 322)">
      <!-- Outer shadow -->
      <g fill="#011f0f" stroke="#011f0f" stroke-width="6" stroke-linejoin="round">
        <circle cx="0" cy="-14" r="14"/>
        <circle cx="-14" cy="6" r="14"/>
        <circle cx="14" cy="6" r="14"/>
        <path d="M-6 8 L-8 30 L8 30 L6 8 Z"/>
      </g>
      <!-- Inner gradient -->
      <g fill="url(#suitGreenGrad)" stroke="#22c55e" stroke-width="1.5">
        <circle cx="0" cy="-14" r="14"/>
        <circle cx="-14" cy="6" r="14"/>
        <circle cx="14" cy="6" r="14"/>
        <path d="M-6 8 L-8 30 L8 30 L6 8 Z"/>
      </g>
    </g>

    <!-- Reel Lower Curve Shadow -->
    <path d="M52 360 C52 376 96 380 256 380 C416 380 460 376 460 360" stroke="#475569" stroke-width="3" opacity="0.6" fill="none"/>
  </g>
</svg>

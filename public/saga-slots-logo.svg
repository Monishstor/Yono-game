<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Emerald Green Quilted Background Gradient -->
    <radialGradient id="sagaBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0b5936"/>
      <stop offset="60%" stop-color="#043820"/>
      <stop offset="100%" stop-color="#021f12"/>
    </radialGradient>

    <!-- Diamond Badge Inner Gradient -->
    <linearGradient id="sagaDiamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#127344"/>
      <stop offset="50%" stop-color="#0a5231"/>
      <stop offset="100%" stop-color="#032b18"/>
    </linearGradient>

    <!-- Golden 3D Text Gradient for SAGA -->
    <linearGradient id="sagaGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff899"/>
      <stop offset="25%" stop-color="#ffd500"/>
      <stop offset="65%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="sagaGoldStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b86200"/>
    </linearGradient>

    <!-- Slot Machine Reel Metallic Cylinder Gradient -->
    <linearGradient id="sagaReel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8f9da6"/>
      <stop offset="15%" stop-color="#f2f6f9"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#dce4ea"/>
      <stop offset="100%" stop-color="#7a8791"/>
    </linearGradient>

    <!-- Reel Border Chrome Gradient -->
    <linearGradient id="sagaChromeBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="40%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Green Text Gradient for SLOTS -->
    <linearGradient id="sagaSlotsGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="60%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <!-- Heavy Drop Shadow -->
    <filter id="sagaShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.75"/>
    </filter>

    <filter id="sagaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Rounded Green Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#sagaBg)" />

  <!-- Quilted Diamond Pattern -->
  <g opacity="0.18" stroke="#10b981" stroke-width="1.5" fill="none">
    <path d="M-50 256 L256 -50 L562 256 L256 562 Z" />
    <path d="M0 256 L256 0 L512 256 L256 512 Z" />
    <path d="M60 256 L256 60 L452 256 L256 452 Z" />
    <path d="M120 256 L256 120 L392 256 L256 392 Z" />
    <path d="M180 256 L256 180 L332 256 L256 332 Z" />
  </g>

  <!-- Main Diamond Center Tile -->
  <g filter="url(#sagaShadow)">
    <rect x="56" y="56" width="400" height="400" rx="48" transform="rotate(45 256 256)" fill="url(#sagaDiamond)" stroke="#10b981" stroke-width="6" stroke-opacity="0.6"/>
  </g>

  <!-- Outer Rounded Border Glow -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#34d399" stroke-width="8" stroke-opacity="0.35" />

  <!-- 3D "SAGA" Text with Heavy Extrusion & Sparkle -->
  <g filter="url(#sagaShadow)">
    <!-- 3D Deep Brown/Gold Shadow Depth -->
    <text x="256" y="244" font-family="'Arial Black', 'Impact', sans-serif" font-size="142" font-weight="900" font-style="italic" text-anchor="middle" fill="#5c2600" letter-spacing="4">SAGA</text>
    <text x="256" y="240" font-family="'Arial Black', 'Impact', sans-serif" font-size="142" font-weight="900" font-style="italic" text-anchor="middle" fill="#7a3300" letter-spacing="4">SAGA</text>
    <text x="256" y="236" font-family="'Arial Black', 'Impact', sans-serif" font-size="142" font-weight="900" font-style="italic" text-anchor="middle" fill="#994000" letter-spacing="4">SAGA</text>
    <text x="256" y="232" font-family="'Arial Black', 'Impact', sans-serif" font-size="142" font-weight="900" font-style="italic" text-anchor="middle" fill="#b85300" letter-spacing="4">SAGA</text>
    <text x="256" y="228" font-family="'Arial Black', 'Impact', sans-serif" font-size="142" font-weight="900" font-style="italic" text-anchor="middle" fill="#d96b00" letter-spacing="4">SAGA</text>
    
    <!-- SAGA Main Golden Face -->
    <text x="256" y="224" font-family="'Arial Black', 'Impact', sans-serif" font-size="142" font-weight="900" font-style="italic" text-anchor="middle" fill="url(#sagaGold)" stroke="url(#sagaGoldStroke)" stroke-width="5" stroke-linejoin="round" letter-spacing="4">SAGA</text>
  </g>

  <!-- Bright Golden Star Sparkle on top-right of SAGA -->
  <g transform="translate(342, 126)">
    <!-- Glow -->
    <circle cx="0" cy="0" r="18" fill="#ffd700" opacity="0.4" filter="url(#sagaGlow)"/>
    <!-- 4-point Sparkle Star -->
    <path d="M0 -28 Q2 -6 28 0 Q2 6 0 28 Q-2 6 -28 0 Q-2 -6 0 -28 Z" fill="#ffffff" />
    <path d="M0 -20 Q1.5 -4 20 0 Q1.5 4 0 20 Q-1.5 4 -20 0 Q-1.5 -4 0 -20 Z" fill="#fff899" />
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
  </g>

  <!-- Slot Machine Cylinder Body for "SLOTS" -->
  <g filter="url(#sagaShadow)">
    <!-- Chrome Outline Cylinder Container -->
    <rect x="28" y="260" width="456" height="128" rx="64" fill="url(#sagaReel)" stroke="url(#sagaChromeBorder)" stroke-width="12"/>

    <!-- 5 Slot Machine Segment Divider Lines -->
    <line x1="116" y1="262" x2="116" y2="386" stroke="#9aa5ad" stroke-width="4" stroke-opacity="0.8"/>
    <line x1="204" y1="262" x2="204" y2="386" stroke="#9aa5ad" stroke-width="4" stroke-opacity="0.8"/>
    <line x1="308" y1="262" x2="308" y2="386" stroke="#9aa5ad" stroke-width="4" stroke-opacity="0.8"/>
    <line x1="396" y1="262" x2="396" y2="386" stroke="#9aa5ad" stroke-width="4" stroke-opacity="0.8"/>

    <!-- Cylinder Top & Bottom Highlights -->
    <rect x="40" y="266" width="432" height="18" rx="9" fill="#ffffff" opacity="0.75" />
    <rect x="40" y="364" width="432" height="16" rx="8" fill="#52606b" opacity="0.4" />

    <!-- "S L O T S" Bold Green Letters -->
    <!-- S -->
    <text x="74" y="356" font-family="'Arial Black', 'Impact', sans-serif" font-size="82" font-weight="900" text-anchor="middle" fill="url(#sagaSlotsGreen)">S</text>
    <!-- L -->
    <text x="160" y="356" font-family="'Arial Black', 'Impact', sans-serif" font-size="82" font-weight="900" text-anchor="middle" fill="url(#sagaSlotsGreen)">L</text>
    <!-- O -->
    <text x="256" y="356" font-family="'Arial Black', 'Impact', sans-serif" font-size="82" font-weight="900" text-anchor="middle" fill="url(#sagaSlotsGreen)">O</text>
    <!-- T -->
    <text x="352" y="356" font-family="'Arial Black', 'Impact', sans-serif" font-size="82" font-weight="900" text-anchor="middle" fill="url(#sagaSlotsGreen)">T</text>
    <!-- S -->
    <text x="438" y="356" font-family="'Arial Black', 'Impact', sans-serif" font-size="82" font-weight="900" text-anchor="middle" fill="url(#sagaSlotsGreen)">S</text>
  </g>
</svg>

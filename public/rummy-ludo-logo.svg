<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Emerald Green Quilted Background Gradient -->
    <radialGradient id="rlBgRadial" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#0b5e39"/>
      <stop offset="40%" stop-color="#054425"/>
      <stop offset="80%" stop-color="#022414"/>
      <stop offset="100%" stop-color="#011209"/>
    </radialGradient>

    <!-- Center Rotated Diamond Plate Gradient -->
    <linearGradient id="rlDiamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f6b41"/>
      <stop offset="50%" stop-color="#084d2d"/>
      <stop offset="100%" stop-color="#032a18"/>
    </linearGradient>

    <!-- Golden Crown Gradients -->
    <linearGradient id="crownGoldFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fff59d"/>
      <stop offset="60%" stop-color="#fbc02d"/>
      <stop offset="90%" stop-color="#f57f17"/>
      <stop offset="100%" stop-color="#d84315"/>
    </linearGradient>

    <linearGradient id="crownRimGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f57f17"/>
      <stop offset="25%" stop-color="#fff9c4"/>
      <stop offset="50%" stop-color="#fbc02d"/>
      <stop offset="75%" stop-color="#fff9c4"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <!-- 3D "RUMMY" Typography Gradients -->
    <linearGradient id="rummyGoldFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffde7"/>
      <stop offset="20%" stop-color="#ffeb3b"/>
      <stop offset="65%" stop-color="#fbc02d"/>
      <stop offset="95%" stop-color="#f57f17"/>
      <stop offset="100%" stop-color="#ef6c00"/>
    </linearGradient>

    <linearGradient id="rummyGoldBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fff59d"/>
      <stop offset="70%" stop-color="#ffa000"/>
      <stop offset="100%" stop-color="#bf360c"/>
    </linearGradient>

    <!-- Slot Roller Outer Metallic Green Frame -->
    <linearGradient id="reelOuterGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#16a34a"/>
      <stop offset="85%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>

    <!-- Slot Reel Body (White/Silver Cylinder) -->
    <linearGradient id="reelWhiteCylinder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="12%" stop-color="#e2e8f0"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Emerald Green "LUDO" Letter Face -->
    <linearGradient id="ludoGreenFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="30%" stop-color="#10b981"/>
      <stop offset="70%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="mainShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <filter id="goldStarGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Squircle with Deep Green Texture -->
  <rect width="512" height="512" rx="112" fill="url(#rlBgRadial)"/>

  <!-- Checkerboard / Diamond Quilted Pattern -->
  <g opacity="0.25" stroke="#22c55e" stroke-width="1.2" fill="none">
    <path d="M-60 256 L256 -60 L572 256 L256 572 Z" />
    <path d="M0 256 L256 0 L512 256 L256 512 Z" />
    <path d="M64 256 L256 64 L448 256 L256 448 Z" />
    <path d="M128 256 L256 128 L384 256 L256 384 Z" />
    <path d="M192 256 L256 192 L320 256 L256 320 Z" />
    <line x1="64" y1="0" x2="512" y2="448" />
    <line x1="0" y1="64" x2="448" y2="512" />
    <line x1="0" y1="192" x2="320" y2="512" />
    <line x1="192" y1="0" x2="512" y2="320" />
    <line x1="448" y1="0" x2="0" y2="448" />
    <line x1="512" y1="64" x2="64" y2="512" />
    <line x1="320" y1="0" x2="0" y2="320" />
    <line x1="512" y1="192" x2="192" y2="512" />
  </g>

  <!-- Outer Rounded Neon Green Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#22c55e" stroke-width="4.5" opacity="0.4"/>

  <!-- Center Rotated Diamond Plate with Neon Green Glow Border -->
  <g filter="url(#mainShadow)">
    <rect x="76" y="76" width="360" height="360" rx="44" transform="rotate(45 256 256)" fill="url(#rlDiamondGrad)" stroke="#22c55e" stroke-width="5" stroke-opacity="0.85"/>
  </g>

  <!-- ==================== TOP 3D GOLDEN CROWN ==================== -->
  <g filter="url(#mainShadow)">
    <!-- Crown Base Dark Shadow -->
    <path d="M176 142 L166 84 L212 110 L256 46 L300 110 L346 84 L336 142 Z" fill="#3e1a00" opacity="0.6" transform="translate(0, 4)"/>

    <!-- Crown Velvet Arch/Inner Cushion -->
    <path d="M180 138 C180 98 332 98 332 138 Z" fill="#7f1d1d" stroke="#450a0a" stroke-width="2"/>

    <!-- 3D Crown Body -->
    <path d="M178 138 L168 82 L216 108 L256 42 L296 108 L344 82 L334 138 Z" fill="url(#crownGoldFace)" stroke="#b45309" stroke-width="2.5"/>

    <!-- Crown Inner Shading & Highlights -->
    <path d="M256 42 L296 108 L256 138 L216 108 Z" fill="#ffffff" opacity="0.25"/>
    <path d="M256 42 L276 108 L256 138 Z" fill="#ffffff" opacity="0.45"/>

    <!-- Crown 5 Pearls / Golden Spheres on Peak Tips -->
    <!-- Left 1 -->
    <circle cx="168" cy="82" r="7" fill="#fff9c4" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="166" cy="80" r="2.5" fill="#ffffff"/>
    <!-- Left 2 -->
    <circle cx="216" cy="108" r="6" fill="#fff9c4" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="214" cy="106" r="2" fill="#ffffff"/>
    <!-- Center (Top Big Pearl) -->
    <circle cx="256" cy="40" r="9" fill="#fff9c4" stroke="#d97706" stroke-width="2"/>
    <circle cx="254" cy="37" r="3.5" fill="#ffffff"/>
    <!-- Right 2 -->
    <circle cx="296" cy="108" r="6" fill="#fff9c4" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="294" cy="106" r="2" fill="#ffffff"/>
    <!-- Right 1 -->
    <circle cx="344" cy="82" r="7" fill="#fff9c4" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="342" cy="80" r="2.5" fill="#ffffff"/>

    <!-- Crown Lower Embellished Rim Band -->
    <rect x="174" y="132" width="164" height="16" rx="8" fill="url(#crownRimGold)" stroke="#9a3412" stroke-width="2"/>
    <!-- Crown Jewels on Band -->
    <circle cx="196" cy="140" r="3.5" fill="#dc2626"/>
    <circle cx="226" cy="140" r="3.5" fill="#2563eb"/>
    <circle cx="256" cy="140" r="4.5" fill="#16a34a"/>
    <circle cx="286" cy="140" r="3.5" fill="#2563eb"/>
    <circle cx="316" cy="140" r="3.5" fill="#dc2626"/>
  </g>

  <!-- Sparkle Stars near RUMMY text corners -->
  <g filter="url(#goldStarGlow)">
    <!-- Left Sparkle -->
    <path d="M96 142 Q96 156 110 156 Q96 156 96 170 Q96 156 82 156 Q96 156 96 142 Z" fill="#ffffff" />
    <path d="M96 145 Q96 156 107 156 Q96 156 96 167 Q96 156 85 156 Q96 156 96 145 Z" fill="#ffd700" />
    
    <!-- Right Sparkle -->
    <path d="M406 150 Q406 164 420 164 Q406 164 406 178 Q406 164 392 164 Q406 164 406 150 Z" fill="#ffffff" />
    <path d="M406 153 Q406 164 417 164 Q406 164 406 175 Q406 164 395 164 Q406 164 406 153 Z" fill="#ffd700" />

    <!-- Center Glint on Rummy M -->
    <path d="M236 216 Q236 224 244 224 Q236 224 236 232 Q236 224 228 224 Q236 224 236 216 Z" fill="#ffffff" />
  </g>

  <!-- ==================== 3D "RUMMY" BLOCK TEXT ==================== -->
  <g filter="url(#mainShadow)">
    <!-- Deep Red/Brown 3D Extrusions -->
    <text x="256" y="244" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="128" letter-spacing="3" fill="#3b0a00" stroke="#3b0a00" stroke-width="16" stroke-linejoin="round">RUMMY</text>
    <text x="256" y="240" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="128" letter-spacing="3" fill="#651500" stroke="#651500" stroke-width="14" stroke-linejoin="round">RUMMY</text>
    <text x="256" y="236" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="128" letter-spacing="3" fill="#9a2800" stroke="#9a2800" stroke-width="12" stroke-linejoin="round">RUMMY</text>
    <text x="256" y="232" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="128" letter-spacing="3" fill="#d84315" stroke="#d84315" stroke-width="10" stroke-linejoin="round">RUMMY</text>

    <!-- Warm Golden Bevel Outline -->
    <text x="256" y="228" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="128" letter-spacing="3" fill="url(#rummyGoldBevel)" stroke="url(#rummyGoldBevel)" stroke-width="8" stroke-linejoin="round">RUMMY</text>

    <!-- Crisp Yellow Gold Front Face -->
    <text x="256" y="228" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="128" letter-spacing="3" fill="url(#rummyGoldFace)">RUMMY</text>
  </g>

  <!-- ==================== 4-SLOT "LUDO" CYLINDER REEL ==================== -->
  <g filter="url(#mainShadow)">
    <!-- Slot Roller Outer Dark Rim -->
    <rect x="36" y="258" width="440" height="136" rx="68" fill="#011b10" stroke="#000000" stroke-width="6"/>

    <!-- Shiny Chrome Green Rim -->
    <rect x="40" y="262" width="432" height="128" rx="64" fill="url(#reelOuterGreen)" stroke="#166534" stroke-width="2"/>

    <!-- 4-Slot White/Silver Cylinder Reel Body -->
    <rect x="48" y="270" width="416" height="112" rx="56" fill="url(#reelWhiteCylinder)"/>

    <!-- 4 Individual Reel Columns Dividers -->
    <!-- Column 1 (L) / Column 2 (U) divider -->
    <path d="M148 270 L148 382" stroke="#94a3b8" stroke-width="4" opacity="0.75"/>
    <path d="M152 270 L152 382" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Column 2 (U) / Column 3 (D) divider (Center) -->
    <path d="M254 270 L254 382" stroke="#94a3b8" stroke-width="4" opacity="0.75"/>
    <path d="M258 270 L258 382" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Column 3 (D) / Column 4 (O) divider -->
    <path d="M360 270 L360 382" stroke="#94a3b8" stroke-width="4" opacity="0.75"/>
    <path d="M364 270 L364 382" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Reel Cylindrical Gloss Highlight (Top white reflection) -->
    <rect x="68" y="274" width="376" height="20" rx="10" fill="#ffffff" opacity="0.75"/>
    <rect x="78" y="278" width="356" height="6" rx="3" fill="#ffffff" opacity="0.95"/>

    <!-- Bottom subtle reflection -->
    <rect x="88" y="364" width="336" height="8" rx="4" fill="#ffffff" opacity="0.3"/>

    <!-- ==================== 4 BOLD EMERALD GREEN LETTERS: L - U - D - O ==================== -->
    
    <!-- LETTER 1: "L" (x: 104) -->
    <g>
      <!-- Deep 3D Shadow -->
      <text x="104" y="364" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="102" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">L</text>
      <!-- Green Stroke -->
      <text x="104" y="360" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="102" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">L</text>
      <!-- Emerald Face -->
      <text x="104" y="360" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="102" fill="url(#ludoGreenFace)">L</text>
    </g>

    <!-- LETTER 2: "U" (x: 204) -->
    <g>
      <!-- Deep 3D Shadow -->
      <text x="204" y="364" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="102" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">U</text>
      <!-- Green Stroke -->
      <text x="204" y="360" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="102" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">U</text>
      <!-- Emerald Face -->
      <text x="204" y="360" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="102" fill="url(#ludoGreenFace)">U</text>
    </g>

    <!-- LETTER 3: "D" (x: 310) -->
    <g>
      <!-- Deep 3D Shadow -->
      <text x="310" y="364" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="102" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">D</text>
      <!-- Green Stroke -->
      <text x="310" y="360" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="102" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">D</text>
      <!-- Emerald Face -->
      <text x="310" y="360" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="102" fill="url(#ludoGreenFace)">D</text>
    </g>

    <!-- LETTER 4: "O" (x: 412) -->
    <g>
      <!-- Deep 3D Shadow -->
      <text x="412" y="364" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="102" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">O</text>
      <!-- Green Stroke -->
      <text x="412" y="360" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="102" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">O</text>
      <!-- Emerald Face -->
      <text x="412" y="360" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="102" fill="url(#ludoGreenFace)">O</text>
    </g>
  </g>
</svg>

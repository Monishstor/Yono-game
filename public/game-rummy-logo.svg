<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Emerald Green Quilted Background Gradient -->
    <radialGradient id="gameBgRadial" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#0b5e39"/>
      <stop offset="40%" stop-color="#054425"/>
      <stop offset="80%" stop-color="#022414"/>
      <stop offset="100%" stop-color="#011209"/>
    </radialGradient>

    <!-- Center Rotated Diamond Plate Gradient -->
    <linearGradient id="gameDiamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f6b41"/>
      <stop offset="50%" stop-color="#084d2d"/>
      <stop offset="100%" stop-color="#032a18"/>
    </linearGradient>

    <!-- 3D "GAME" Typography Gradients -->
    <linearGradient id="gameGoldFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffde7"/>
      <stop offset="15%" stop-color="#fff176"/>
      <stop offset="50%" stop-color="#fbc02d"/>
      <stop offset="85%" stop-color="#f57f17"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="gameGoldBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fff59d"/>
      <stop offset="65%" stop-color="#ffa000"/>
      <stop offset="100%" stop-color="#8a2b00"/>
    </linearGradient>

    <!-- Red Joystick Ball Gradient -->
    <radialGradient id="joystickRedBall" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="25%" stop-color="#ef4444"/>
      <stop offset="65%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#580808"/>
    </radialGradient>

    <!-- Joystick Base Gradient -->
    <linearGradient id="joystickBaseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Slot Roller Outer Metallic Green Frame -->
    <linearGradient id="gameReelGreenFrame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#16a34a"/>
      <stop offset="85%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>

    <!-- Slot Reel Body (White/Silver Cylinder) -->
    <linearGradient id="gameReelSilverCylinder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="12%" stop-color="#e2e8f0"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Emerald Green "RUMMY" Letter Face Gradient -->
    <linearGradient id="gameRummyGreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="30%" stop-color="#059669"/>
      <stop offset="70%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="gameMainShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <filter id="gameStarGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Squircle with Deep Green Texture -->
  <rect width="512" height="512" rx="112" fill="url(#gameBgRadial)"/>

  <!-- Checkerboard / Diamond Quilted Pattern -->
  <g opacity="0.25" stroke="#22c55e" stroke-width="1.2" fill="none">
    <path d="M-60 256 L256 -60 L572 256 L256 572 Z" />
    <path d="M0 256 L256 0 L512 256 L256 512 Z" />
    <path d="M64 256 L256 64 L448 256 L256 448 Z" />
    <path d="M128 256 L256 128 L384 256 L256 384 Z" />
    <path d="M192 256 L256 192 L320 256 L256 320 Z" />
    <line x1="64" y1="0" x2="512" y2="448" />
    <line x1="0" y1="64" x2="448" y2="512" />
    <line x1="0" y1="192" x2="320" y2="512" />
    <line x1="192" y1="0" x2="512" y2="320" />
    <line x1="448" y1="0" x2="0" y2="448" />
    <line x1="512" y1="64" x2="64" y2="512" />
    <line x1="320" y1="0" x2="0" y2="320" />
    <line x1="512" y1="192" x2="192" y2="512" />
  </g>

  <!-- Outer Rounded Neon Green Accent Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#22c55e" stroke-width="4.5" opacity="0.4"/>

  <!-- Center Rotated Diamond Plate with Neon Green Glow Border -->
  <g filter="url(#gameMainShadow)">
    <rect x="76" y="76" width="360" height="360" rx="44" transform="rotate(45 256 256)" fill="url(#gameDiamondGrad)" stroke="#22c55e" stroke-width="5" stroke-opacity="0.85"/>
  </g>

  <!-- Sparkle Stars near GAME text -->
  <g filter="url(#gameStarGlow)">
    <!-- Top Sparkle on G -->
    <path d="M140 134 Q140 148 154 148 Q140 148 140 162 Q140 148 126 148 Q140 148 140 134 Z" fill="#ffffff" />
    <path d="M140 137 Q140 148 150 148 Q140 148 140 159 Q140 148 130 148 Q140 148 140 137 Z" fill="#ffd700" />
    
    <!-- Top Sparkle on E -->
    <path d="M386 122 Q386 136 400 136 Q386 136 386 150 Q386 136 372 136 Q386 136 386 122 Z" fill="#ffffff" />
    <path d="M386 125 Q386 136 396 136 Q386 136 386 147 Q386 136 376 136 Q386 136 386 125 Z" fill="#ffd700" />
  </g>

  <!-- ==================== 3D "GAME" BOLD TYPOGRAPHY ==================== -->
  <g filter="url(#gameMainShadow)">
    <!-- Deep Crimson/Brown 3D Extrusion Shadow Layers -->
    <text x="256" y="248" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="146" letter-spacing="3" fill="#3b0800" stroke="#3b0800" stroke-width="20" stroke-linejoin="round">GAME</text>
    <text x="256" y="243" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="146" letter-spacing="3" fill="#6b1200" stroke="#6b1200" stroke-width="16" stroke-linejoin="round">GAME</text>
    <text x="256" y="238" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="146" letter-spacing="3" fill="#9e1e00" stroke="#9e1e00" stroke-width="13" stroke-linejoin="round">GAME</text>
    <text x="256" y="233" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="146" letter-spacing="3" fill="#d82d00" stroke="#d82d00" stroke-width="10" stroke-linejoin="round">GAME</text>

    <!-- Warm Golden Bevel Outline -->
    <text x="256" y="228" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="146" letter-spacing="3" fill="url(#gameGoldBevel)" stroke="url(#gameGoldBevel)" stroke-width="8" stroke-linejoin="round">GAME</text>

    <!-- Crisp Rich Yellow Gold Front Face -->
    <text x="256" y="228" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="146" letter-spacing="3" fill="url(#gameGoldFace)">GAME</text>

    <!-- ==================== ARCADE JOYSTICK IN "A" ==================== -->
    <g transform="translate(202, 192)" filter="url(#gameMainShadow)">
      <!-- Joystick Base Pad -->
      <ellipse cx="0" cy="18" rx="20" ry="10" fill="#0b0f19" stroke="#000000" stroke-width="2"/>
      <ellipse cx="0" cy="16" rx="17" ry="8" fill="url(#joystickBaseGrad)" stroke="#475569" stroke-width="1.5"/>

      <!-- Joystick Shaft / Stick -->
      <path d="M-4 16 L-2 -8 L2 -8 L4 16 Z" fill="#334155" stroke="#0f172a" stroke-width="1"/>
      <path d="M-1 16 L-0.5 -8 L1 -8 L1.5 16 Z" fill="#94a3b8" opacity="0.8"/>

      <!-- Red Arcade Ball Knob -->
      <circle cx="0" cy="-14" r="18" fill="url(#joystickRedBall)" stroke="#450a0a" stroke-width="2"/>
      <!-- Ball 3D Specular Highlight -->
      <ellipse cx="-6" cy="-20" rx="5" ry="3.5" fill="#ffffff" opacity="0.9" transform="rotate(-20 -6 -20)"/>
    </g>
  </g>

  <!-- ==================== 5-SLOT "RUMMY" CYLINDER REEL ==================== -->
  <g filter="url(#gameMainShadow)">
    <!-- Slot Roller Outer Dark Rim -->
    <rect x="36" y="260" width="440" height="136" rx="68" fill="#011b10" stroke="#000000" stroke-width="6"/>

    <!-- Shiny Chrome Green Rim -->
    <rect x="40" y="264" width="432" height="128" rx="64" fill="url(#gameReelGreenFrame)" stroke="#166534" stroke-width="2"/>

    <!-- 5-Slot White/Silver Cylinder Reel Body -->
    <rect x="48" y="272" width="416" height="112" rx="56" fill="url(#gameReelSilverCylinder)"/>

    <!-- 5 Individual Reel Column Dividers -->
    <!-- Col 1 (R) / Col 2 (U) -->
    <path d="M130 272 L130 384" stroke="#94a3b8" stroke-width="3.5" opacity="0.75"/>
    <path d="M133 272 L133 384" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Col 2 (U) / Col 3 (M) -->
    <path d="M214 272 L214 384" stroke="#94a3b8" stroke-width="3.5" opacity="0.75"/>
    <path d="M217 272 L217 384" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Col 3 (M) / Col 4 (M) -->
    <path d="M298 272 L298 384" stroke="#94a3b8" stroke-width="3.5" opacity="0.75"/>
    <path d="M301 272 L301 384" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Col 4 (M) / Col 5 (Y) -->
    <path d="M382 272 L382 384" stroke="#94a3b8" stroke-width="3.5" opacity="0.75"/>
    <path d="M385 272 L385 384" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Reel Cylindrical Gloss Highlight (Top white reflection) -->
    <rect x="68" y="276" width="376" height="20" rx="10" fill="#ffffff" opacity="0.75"/>
    <rect x="78" y="280" width="356" height="6" rx="3" fill="#ffffff" opacity="0.95"/>

    <!-- Bottom subtle reflection -->
    <rect x="88" y="366" width="336" height="8" rx="4" fill="#ffffff" opacity="0.3"/>

    <!-- ==================== 5 EMERALD GREEN BOLD LETTERS: R - U - M - M - Y ==================== -->
    
    <!-- LETTER 1: "R" (x: 88) -->
    <g>
      <text x="88" y="366" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">R</text>
      <text x="88" y="362" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">R</text>
      <text x="88" y="362" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="url(#gameRummyGreenGrad)">R</text>
    </g>

    <!-- LETTER 2: "U" (x: 172) -->
    <g>
      <text x="172" y="366" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">U</text>
      <text x="172" y="362" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">U</text>
      <text x="172" y="362" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="url(#gameRummyGreenGrad)">U</text>
    </g>

    <!-- LETTER 3: "M" (x: 256) -->
    <g>
      <text x="256" y="366" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">M</text>
      <text x="256" y="362" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">M</text>
      <text x="256" y="362" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="url(#gameRummyGreenGrad)">M</text>
    </g>

    <!-- LETTER 4: "M" (x: 340) -->
    <g>
      <text x="340" y="366" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">M</text>
      <text x="340" y="362" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">M</text>
      <text x="340" y="362" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="url(#gameRummyGreenGrad)">M</text>
    </g>

    <!-- LETTER 5: "Y" (x: 424) -->
    <g>
      <text x="424" y="366" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">Y</text>
      <text x="424" y="362" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">Y</text>
      <text x="424" y="362" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="url(#gameRummyGreenGrad)">Y</text>
    </g>
  </g>
</svg>

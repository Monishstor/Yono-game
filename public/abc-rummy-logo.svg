<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Deep Emerald Green) -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#0b5e39"/>
      <stop offset="45%" stop-color="#053e24"/>
      <stop offset="85%" stop-color="#022414"/>
      <stop offset="100%" stop-color="#01140b"/>
    </radialGradient>

    <!-- Center Diamond Tile Gradient -->
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e683f"/>
      <stop offset="50%" stop-color="#084d2d"/>
      <stop offset="100%" stop-color="#032e1a"/>
    </linearGradient>

    <!-- 3D "ABC" Gold Gradient -->
    <linearGradient id="goldFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbb3"/>
      <stop offset="20%" stop-color="#ffd700"/>
      <stop offset="65%" stop-color="#ff9d00"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>

    <linearGradient id="goldBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#ffec8b"/>
      <stop offset="70%" stop-color="#ffa000"/>
      <stop offset="100%" stop-color="#bf360c"/>
    </linearGradient>

    <!-- Slot Cylinder White/Silver Reel Gradient -->
    <linearGradient id="reelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8c9da8"/>
      <stop offset="12%" stop-color="#e8eef3"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#dde5ec"/>
      <stop offset="100%" stop-color="#73828d"/>
    </linearGradient>

    <!-- Cylinder Green Bevel Border -->
    <linearGradient id="reelBorderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="30%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>

    <!-- Letters "RUMMY" Green Gradient -->
    <linearGradient id="rummyTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="60%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <!-- Deep Drop Shadow -->
    <filter id="mainShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.8"/>
    </filter>

    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Icon Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Diamond Quilted Background Grid Lines -->
  <g opacity="0.22" stroke="#22c55e" stroke-width="1.5" fill="none">
    <path d="M-60 256 L256 -60 L572 256 L256 572 Z" />
    <path d="M0 256 L256 0 L512 256 L256 512 Z" />
    <path d="M64 256 L256 64 L448 256 L256 448 Z" />
    <path d="M128 256 L256 128 L384 256 L256 384 Z" />
    <path d="M192 256 L256 192 L320 256 L256 320 Z" />
    <line x1="64" y1="0" x2="512" y2="448" />
    <line x1="0" y1="64" x2="448" y2="512" />
    <line x1="0" y1="192" x2="320" y2="512" />
    <line x1="192" y1="0" x2="512" y2="320" />
    <line x1="448" y1="0" x2="0" y2="448" />
    <line x1="512" y1="64" x2="64" y2="512" />
    <line x1="320" y1="0" x2="0" y2="320" />
    <line x1="512" y1="192" x2="192" y2="512" />
  </g>

  <!-- Outer Rounded Green Neon Accent Line -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#22c55e" stroke-width="6" opacity="0.35"/>

  <!-- Center Rotated Diamond Plate with Neon Green Border -->
  <g filter="url(#mainShadow)">
    <rect x="76" y="76" width="360" height="360" rx="44" transform="rotate(45 256 256)" fill="url(#diamondGrad)" stroke="#22c55e" stroke-width="6" stroke-opacity="0.8"/>
  </g>

  <!-- ================= TOP 3D GOLDEN "ABC" TEXT ================= -->
  <g filter="url(#mainShadow)">
    <!-- 3D Extruded Layers (Warm Amber / Red Orange Depth) -->
    <text x="256" y="254" font-family="'Arial Black', 'Impact', sans-serif" font-size="156" font-weight="900" font-style="italic" text-anchor="middle" fill="#3e1400" letter-spacing="2">ABC</text>
    <text x="256" y="250" font-family="'Arial Black', 'Impact', sans-serif" font-size="156" font-weight="900" font-style="italic" text-anchor="middle" fill="#5a1d00" letter-spacing="2">ABC</text>
    <text x="256" y="246" font-family="'Arial Black', 'Impact', sans-serif" font-size="156" font-weight="900" font-style="italic" text-anchor="middle" fill="#782700" letter-spacing="2">ABC</text>
    <text x="256" y="242" font-family="'Arial Black', 'Impact', sans-serif" font-size="156" font-weight="900" font-style="italic" text-anchor="middle" fill="#993400" letter-spacing="2">ABC</text>
    <text x="256" y="238" font-family="'Arial Black', 'Impact', sans-serif" font-size="156" font-weight="900" font-style="italic" text-anchor="middle" fill="#bd4400" letter-spacing="2">ABC</text>
    <text x="256" y="234" font-family="'Arial Black', 'Impact', sans-serif" font-size="156" font-weight="900" font-style="italic" text-anchor="middle" fill="#df5900" letter-spacing="2">ABC</text>

    <!-- Main Front Beveled Gold Face -->
    <text x="256" y="230" font-family="'Arial Black', 'Impact', sans-serif" font-size="156" font-weight="900" font-style="italic" text-anchor="middle" fill="url(#goldFace)" stroke="url(#goldBevel)" stroke-width="6" stroke-linejoin="round" letter-spacing="2">ABC</text>
  </g>

  <!-- Left Star Sparkle on 'A' -->
  <g transform="translate(98, 114)" filter="url(#starGlow)">
    <circle cx="0" cy="0" r="16" fill="#ffd700" opacity="0.5"/>
    <path d="M0 -22 Q1.5 -5 22 0 Q1.5 5 0 22 Q-1.5 5 -22 0 Q-1.5 -5 0 -22 Z" fill="#ffffff" />
    <path d="M0 -14 Q1 -3 14 0 Q1 3 0 14 Q-1 3 -14 0 Q-1 -3 0 -14 Z" fill="#fff9a6" />
    <circle cx="0" cy="0" r="3.5" fill="#ffffff" />
  </g>

  <!-- Right Star Sparkle on 'C' -->
  <g transform="translate(426, 186)" filter="url(#starGlow)">
    <circle cx="0" cy="0" r="16" fill="#ffd700" opacity="0.5"/>
    <path d="M0 -20 Q1.5 -4 20 0 Q1.5 4 0 20 Q-1.5 4 -20 0 Q-1.5 -4 0 -20 Z" fill="#ffffff" />
    <path d="M0 -13 Q1 -3 13 0 Q1 3 0 13 Q-1 3 -13 0 Q-1 -3 0 -13 Z" fill="#fff9a6" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
  </g>

  <!-- ================= HORIZONTAL CYLINDER SLOT REEL "RUMMY" ================= -->
  <g filter="url(#mainShadow)">
    <!-- Outer Metallic Cylinder Pill Frame with Green/Chrome Trim -->
    <rect x="22" y="262" width="468" height="130" rx="65" fill="url(#reelGrad)" stroke="url(#reelBorderGrad)" stroke-width="12"/>

    <!-- Cylinder Glass Highlight (Top Specular Reflection) -->
    <rect x="34" y="268" width="444" height="18" rx="9" fill="#ffffff" opacity="0.85"/>
    <!-- Cylinder Glass Shadow (Bottom Curve Reflection) -->
    <rect x="34" y="366" width="444" height="16" rx="8" fill="#475569" opacity="0.35"/>

    <!-- 5 Slot Segment Vertical Dividers [ R | U | M | M | Y ] -->
    <line x1="114" y1="264" x2="114" y2="390" stroke="#8a99a4" stroke-width="4" stroke-linecap="round"/>
    <line x1="206" y1="264" x2="206" y2="390" stroke="#8a99a4" stroke-width="4" stroke-linecap="round"/>
    <line x1="306" y1="264" x2="306" y2="390" stroke="#8a99a4" stroke-width="4" stroke-linecap="round"/>
    <line x1="398" y1="264" x2="398" y2="390" stroke="#8a99a4" stroke-width="4" stroke-linecap="round"/>

    <!-- Highlights next to divider lines for 3D curved barrel look -->
    <line x1="117" y1="265" x2="117" y2="389" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
    <line x1="209" y1="265" x2="209" y2="389" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
    <line x1="309" y1="265" x2="309" y2="389" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
    <line x1="401" y1="265" x2="401" y2="389" stroke="#ffffff" stroke-width="2" opacity="0.7"/>

    <!-- ================= 3D GREEN "R U M M Y" LETTERS ================= -->
    <!-- R -->
    <text x="68" y="360" font-family="'Arial Black', 'Impact', sans-serif" font-size="86" font-weight="900" text-anchor="middle" fill="#011e11">R</text>
    <text x="68" y="356" font-family="'Arial Black', 'Impact', sans-serif" font-size="86" font-weight="900" text-anchor="middle" fill="url(#rummyTextGrad)">R</text>

    <!-- U -->
    <text x="160" y="360" font-family="'Arial Black', 'Impact', sans-serif" font-size="86" font-weight="900" text-anchor="middle" fill="#011e11">U</text>
    <text x="160" y="356" font-family="'Arial Black', 'Impact', sans-serif" font-size="86" font-weight="900" text-anchor="middle" fill="url(#rummyTextGrad)">U</text>

    <!-- M -->
    <text x="256" y="360" font-family="'Arial Black', 'Impact', sans-serif" font-size="84" font-weight="900" text-anchor="middle" fill="#011e11">M</text>
    <text x="256" y="356" font-family="'Arial Black', 'Impact', sans-serif" font-size="84" font-weight="900" text-anchor="middle" fill="url(#rummyTextGrad)">M</text>

    <!-- M -->
    <text x="352" y="360" font-family="'Arial Black', 'Impact', sans-serif" font-size="84" font-weight="900" text-anchor="middle" fill="#011e11">M</text>
    <text x="352" y="356" font-family="'Arial Black', 'Impact', sans-serif" font-size="84" font-weight="900" text-anchor="middle" fill="url(#rummyTextGrad)">M</text>

    <!-- Y -->
    <text x="444" y="360" font-family="'Arial Black', 'Impact', sans-serif" font-size="86" font-weight="900" text-anchor="middle" fill="#011e11">Y</text>
    <text x="444" y="356" font-family="'Arial Black', 'Impact', sans-serif" font-size="86" font-weight="900" text-anchor="middle" fill="url(#rummyTextGrad)">Y</text>
  </g>
</svg>

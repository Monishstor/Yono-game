<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Emerald Green Quilted Background Radial Gradient -->
    <radialGradient id="jaihoBgRadial" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#0c633c"/>
      <stop offset="40%" stop-color="#064828"/>
      <stop offset="80%" stop-color="#022816"/>
      <stop offset="100%" stop-color="#01130a"/>
    </radialGradient>

    <!-- Center Rotated Diamond Plate Gradient -->
    <linearGradient id="jaihoDiamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#117547"/>
      <stop offset="50%" stop-color="#095532"/>
      <stop offset="100%" stop-color="#04311c"/>
    </linearGradient>

    <!-- 3D Gold Typography Face Gradient -->
    <linearGradient id="jaihoGoldFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="15%" stop-color="#fff59d"/>
      <stop offset="45%" stop-color="#ffd600"/>
      <stop offset="75%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>

    <!-- Slot Roller Outer Metallic Green Frame -->
    <linearGradient id="jaihoReelGreenFrame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#16a34a"/>
      <stop offset="85%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>

    <!-- Slot Reel Body (White/Silver Cylinder) -->
    <linearGradient id="jaihoReelSilverCylinder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="12%" stop-color="#e2e8f0"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Bright Green "WIN" Letter & Spade Face Gradient -->
    <linearGradient id="jaihoWinGreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="40%" stop-color="#065f46"/>
      <stop offset="80%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c19"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="jaihoMainShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Base Squircle with Deep Green Texture -->
  <rect width="512" height="512" rx="112" fill="url(#jaihoBgRadial)"/>

  <!-- Checkerboard / Diamond Quilted Pattern -->
  <g opacity="0.25" stroke="#22c55e" stroke-width="1.2" fill="none">
    <path d="M-60 256 L256 -60 L572 256 L256 572 Z" />
    <path d="M0 256 L256 0 L512 256 L256 512 Z" />
    <path d="M64 256 L256 64 L448 256 L256 448 Z" />
    <path d="M128 256 L256 128 L384 256 L256 384 Z" />
    <path d="M192 256 L256 192 L320 256 L256 320 Z" />
    <line x1="64" y1="0" x2="512" y2="448" />
    <line x1="0" y1="64" x2="448" y2="512" />
    <line x1="0" y1="192" x2="320" y2="512" />
    <line x1="192" y1="0" x2="512" y2="320" />
    <line x1="448" y1="0" x2="0" y2="448" />
    <line x1="512" y1="64" x2="64" y2="512" />
    <line x1="320" y1="0" x2="0" y2="320" />
    <line x1="512" y1="192" x2="192" y2="512" />
  </g>

  <!-- Outer Rounded Neon Green Accent Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#22c55e" stroke-width="4.5" opacity="0.4"/>

  <!-- Center Rotated Diamond Plate with Neon Green Glow Border -->
  <g filter="url(#jaihoMainShadow)">
    <rect x="76" y="76" width="360" height="360" rx="44" transform="rotate(45 256 256)" fill="url(#jaihoDiamondGrad)" stroke="#22c55e" stroke-width="5" stroke-opacity="0.85"/>
  </g>

  <!-- ==================== 3D "JAIHO" TOP SECTION ==================== -->
  <g filter="url(#jaihoMainShadow)">
    <!-- Bottom Deep 3D Shadow -->
    <text x="256" y="232" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="134" letter-spacing="2" fill="#2d0c00" stroke="#2d0c00" stroke-width="16" stroke-linejoin="round">JAIHO</text>
    <!-- Extrusion Bevels -->
    <text x="256" y="226" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="134" letter-spacing="2" fill="#7c2d12" stroke="#7c2d12" stroke-width="14" stroke-linejoin="round">JAIHO</text>
    <text x="256" y="220" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="134" letter-spacing="2" fill="#c2410c" stroke="#c2410c" stroke-width="10" stroke-linejoin="round">JAIHO</text>
    <text x="256" y="215" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="134" letter-spacing="2" fill="#ea580c" stroke="#ea580c" stroke-width="8" stroke-linejoin="round">JAIHO</text>
    <text x="256" y="210" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="134" letter-spacing="2" fill="#f59e0b" stroke="#f59e0b" stroke-width="5" stroke-linejoin="round">JAIHO</text>
    <!-- Top Glowing Golden Face with Outline -->
    <text x="256" y="206" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="134" letter-spacing="2" fill="url(#jaihoGoldFace)" stroke="#fef08a" stroke-width="3" stroke-linejoin="round">JAIHO</text>

    <!-- Sparkle on J (Left) -->
    <path d="M120 186 Q120 196 128 196 Q120 196 120 206 Q120 196 112 196 Q120 196 120 186 Z" fill="#ffffff"/>
    <path d="M120 188 Q120 196 126 196 Q120 196 120 204 Q120 196 114 196 Q120 196 120 188 Z" fill="#fef08a"/>

    <!-- Sparkle on H (Right) -->
    <path d="M336 138 Q336 150 346 150 Q336 150 336 162 Q336 150 326 150 Q336 150 336 138 Z" fill="#ffffff"/>
    <path d="M336 141 Q336 150 343 150 Q336 150 336 159 Q336 150 329 150 Q336 150 336 141 Z" fill="#fef08a"/>
  </g>

  <!-- ==================== 5-SLOT "[♠] [W] [I] [N] [♠]" CYLINDER REEL ==================== -->
  <g filter="url(#jaihoMainShadow)">
    <!-- Slot Roller Outer Dark Rim -->
    <rect x="22" y="268" width="468" height="140" rx="70" fill="#011b10" stroke="#000000" stroke-width="6"/>

    <!-- Shiny Chrome Green Rim -->
    <rect x="26" y="272" width="460" height="132" rx="66" fill="url(#jaihoReelGreenFrame)" stroke="#166534" stroke-width="2"/>

    <!-- 5-Slot White/Silver Cylinder Reel Body -->
    <rect x="34" y="280" width="444" height="116" rx="58" fill="url(#jaihoReelSilverCylinder)"/>

    <!-- 4 Reel Column Dividers -->
    <!-- Col 1 (♠) / Col 2 (W) -->
    <path d="M122 280 L122 396" stroke="#94a3b8" stroke-width="3" opacity="0.75"/>
    <path d="M124 280 L124 396" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Col 2 (W) / Col 3 (I) -->
    <path d="M212 280 L212 396" stroke="#94a3b8" stroke-width="3" opacity="0.75"/>
    <path d="M214 280 L214 396" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Col 3 (I) / Col 4 (N) -->
    <path d="M300 280 L300 396" stroke="#94a3b8" stroke-width="3" opacity="0.75"/>
    <path d="M302 280 L302 396" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Col 4 (N) / Col 5 (♠) -->
    <path d="M388 280 L388 396" stroke="#94a3b8" stroke-width="3" opacity="0.75"/>
    <path d="M390 280 L390 396" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

    <!-- Reel Cylindrical Gloss Highlight (Top white reflection) -->
    <rect x="54" y="284" width="404" height="22" rx="11" fill="#ffffff" opacity="0.75"/>
    <rect x="64" y="288" width="384" height="7" rx="3.5" fill="#ffffff" opacity="0.95"/>

    <!-- Bottom subtle reflection -->
    <rect x="74" y="378" width="364" height="8" rx="4" fill="#ffffff" opacity="0.3"/>

    <!-- ==================== 5 SLOTS: ♠ - W - I - N - ♠ ==================== -->
    
    <!-- SLOT 1: EMERALD SPADE ♠ (cx: 78, cy: 338) -->
    <g>
      <path d="M78 308 C69 322 56 334 56 347 C56 357 63 364 72 364 C76 364 80 360 80 360 C80 360 77 369 74 373 L82 373 C79 369 76 360 76 360 C76 360 80 364 84 364 C93 364 100 357 100 347 C100 334 87 322 78 308 Z" fill="#012417" stroke="#012417" stroke-width="7" stroke-linejoin="round" transform="translate(0, 3)"/>
      <path d="M78 308 C69 322 56 334 56 347 C56 357 63 364 72 364 C76 364 80 360 80 360 C80 360 77 369 74 373 L82 373 C79 369 76 360 76 360 C76 360 80 364 84 364 C93 364 100 357 100 347 C100 334 87 322 78 308 Z" fill="url(#jaihoWinGreenGrad)" stroke="#047857" stroke-width="2"/>
    </g>

    <!-- SLOT 2: LETTER 'W' (cx: 167) -->
    <g>
      <text x="167" y="376" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">W</text>
      <text x="167" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">W</text>
      <text x="167" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="url(#jaihoWinGreenGrad)">W</text>
    </g>

    <!-- SLOT 3: LETTER 'I' (cx: 256) -->
    <g>
      <text x="256" y="376" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">I</text>
      <text x="256" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">I</text>
      <text x="256" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="url(#jaihoWinGreenGrad)">I</text>
    </g>

    <!-- SLOT 4: LETTER 'N' (cx: 345) -->
    <g>
      <text x="345" y="376" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#012417" stroke="#012417" stroke-width="8" stroke-linejoin="round">N</text>
      <text x="345" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round">N</text>
      <text x="345" y="372" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="url(#jaihoWinGreenGrad)">N</text>
    </g>

    <!-- SLOT 5: EMERALD SPADE ♠ (cx: 434, cy: 338) -->
    <g>
      <path d="M434 308 C425 322 412 334 412 347 C412 357 419 364 428 364 C432 364 436 360 436 360 C436 360 433 369 430 373 L438 373 C435 369 432 360 432 360 C432 360 436 364 440 364 C449 364 456 357 456 347 C456 334 443 322 434 308 Z" fill="#012417" stroke="#012417" stroke-width="7" stroke-linejoin="round" transform="translate(0, 3)"/>
      <path d="M434 308 C425 322 412 334 412 347 C412 357 419 364 428 364 C432 364 436 360 436 360 C436 360 433 369 430 373 L438 373 C435 369 432 360 432 360 C432 360 436 364 440 364 C449 364 456 357 456 347 C456 334 443 322 434 308 Z" fill="url(#jaihoWinGreenGrad)" stroke="#047857" stroke-width="2"/>
    </g>
  </g>
</svg>

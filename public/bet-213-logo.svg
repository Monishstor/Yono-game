<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Emerald Green Radial Background -->
    <radialGradient id="bet213Bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#144d37"/>
      <stop offset="45%" stop-color="#0a2a1e"/>
      <stop offset="100%" stop-color="#03120c"/>
    </radialGradient>

    <!-- Outer Squircle Bezel -->
    <linearGradient id="bet213SquircleBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d6a4f"/>
      <stop offset="50%" stop-color="#081c15"/>
      <stop offset="100%" stop-color="#52b788"/>
    </linearGradient>

    <!-- Vegas Gold Gradient for Marquee Frame -->
    <linearGradient id="bet213Gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5ba"/>
      <stop offset="25%" stop-color="#ffd000"/>
      <stop offset="50%" stop-color="#d48b00"/>
      <stop offset="75%" stop-color="#ffea75"/>
      <stop offset="100%" stop-color="#8a5300"/>
    </linearGradient>

    <!-- 3D Gold Extrusion for BET 213 Text -->
    <linearGradient id="bet213TextGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#fff6a3"/>
      <stop offset="45%" stop-color="#ffb703"/>
      <stop offset="50%" stop-color="#e07a00"/>
      <stop offset="80%" stop-color="#ffc837"/>
      <stop offset="100%" stop-color="#995800"/>
    </linearGradient>

    <!-- Red Marquee Face Gradient -->
    <radialGradient id="bet213RedSign" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="60%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </radialGradient>

    <!-- Red 3D Text Gradient for SLOTS -->
    <linearGradient id="bet213SlotsRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff8585"/>
      <stop offset="25%" stop-color="#e11d48"/>
      <stop offset="55%" stop-color="#9f1239"/>
      <stop offset="85%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>

    <!-- Silver White Slot Reel Cylinder -->
    <linearGradient id="bet213ReelWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="15%" stop-color="#f1f5f9"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Light Bulb Glow Gradient -->
    <radialGradient id="bulbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </radialGradient>

    <!-- Deep Drop Shadow Filter -->
    <filter id="betShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <!-- Glint Star Filter -->
    <filter id="glintGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="8" y="8" width="496" height="496" rx="100" fill="url(#bet213Bg)" stroke="url(#bet213SquircleBezel)" stroke-width="4"/>

  <!-- Diamond Harlequin Background Pattern -->
  <g opacity="0.18" fill="#52b788">
    <!-- Diamond Row 1 -->
    <polygon points="256,20 296,60 256,100 216,60"/>
    <polygon points="176,20 216,60 176,100 136,60"/>
    <polygon points="336,20 376,60 336,100 296,60"/>
    <polygon points="96,20 136,60 96,100 56,60"/>
    <polygon points="416,20 456,60 416,100 376,60"/>

    <!-- Diamond Row 2 -->
    <polygon points="256,100 296,140 256,180 216,140"/>
    <polygon points="176,100 216,140 176,180 136,140"/>
    <polygon points="336,100 376,140 336,180 296,140"/>
    <polygon points="96,100 136,140 96,180 56,140"/>
    <polygon points="416,100 456,140 416,180 376,140"/>

    <!-- Diamond Row 3 -->
    <polygon points="256,180 296,220 256,260 216,220"/>
    <polygon points="176,180 216,220 176,260 136,220"/>
    <polygon points="336,180 376,220 336,260 296,220"/>
    <polygon points="96,180 136,220 96,260 56,220"/>
    <polygon points="416,180 456,220 416,260 376,220"/>

    <!-- Diamond Row 4 -->
    <polygon points="256,260 296,300 256,340 216,300"/>
    <polygon points="176,260 216,300 176,340 136,300"/>
    <polygon points="336,260 376,300 336,340 296,300"/>
    <polygon points="96,260 136,300 96,340 56,300"/>
    <polygon points="416,260 456,300 416,340 376,300"/>

    <!-- Diamond Row 5 -->
    <polygon points="256,340 296,380 256,420 216,380"/>
    <polygon points="176,340 216,380 176,420 136,380"/>
    <polygon points="336,340 376,380 336,420 296,380"/>
    <polygon points="96,340 136,380 96,420 56,380"/>
    <polygon points="416,340 456,380 416,420 376,380"/>

    <!-- Diamond Row 6 -->
    <polygon points="256,420 296,460 256,500 216,460"/>
    <polygon points="176,420 216,460 176,500 136,460"/>
    <polygon points="336,420 376,460 336,500 296,460"/>
  </g>

  <!-- ==================== VEGAS MARQUEE SIGN (BET 213) ==================== -->
  <g filter="url(#betShadow)">
    <!-- Outer Gold Diamond/Hexagon Marquee Frame -->
    <path d="M 256 120 L 404 186 L 492 246 L 416 296 L 96 296 L 20 246 L 108 186 Z" 
          fill="url(#bet213Gold)" stroke="#663d00" stroke-width="5" stroke-linejoin="round"/>

    <!-- Inner Red Marquee Board -->
    <path d="M 256 132 L 396 194 L 476 246 L 406 286 L 106 286 L 36 246 L 116 194 Z" 
          fill="url(#bet213RedSign)" stroke="#ffea75" stroke-width="2"/>

    <!-- Light Bulbs along Top Triangle -->
    <!-- Left Top Slope -->
    <circle cx="256" cy="142" r="4.5" fill="url(#bulbGlow)"/>
    <circle cx="230" cy="154" r="4" fill="url(#bulbGlow)"/>
    <circle cx="204" cy="166" r="4" fill="url(#bulbGlow)"/>
    <circle cx="178" cy="178" r="4" fill="url(#bulbGlow)"/>
    <circle cx="152" cy="190" r="4" fill="url(#bulbGlow)"/>
    <circle cx="126" cy="202" r="4" fill="url(#bulbGlow)"/>
    <circle cx="98" cy="216" r="4" fill="url(#bulbGlow)"/>
    <circle cx="68" cy="232" r="4" fill="url(#bulbGlow)"/>
    <circle cx="42" cy="246" r="4.5" fill="url(#bulbGlow)"/>

    <!-- Right Top Slope -->
    <circle cx="282" cy="154" r="4" fill="url(#bulbGlow)"/>
    <circle cx="308" cy="166" r="4" fill="url(#bulbGlow)"/>
    <circle cx="334" cy="178" r="4" fill="url(#bulbGlow)"/>
    <circle cx="360" cy="190" r="4" fill="url(#bulbGlow)"/>
    <circle cx="386" cy="202" r="4" fill="url(#bulbGlow)"/>
    <circle cx="414" cy="216" r="4" fill="url(#bulbGlow)"/>
    <circle cx="444" cy="232" r="4" fill="url(#bulbGlow)"/>
    <circle cx="470" cy="246" r="4.5" fill="url(#bulbGlow)"/>

    <!-- Bottom Bulbs -->
    <circle cx="70" cy="264" r="4" fill="url(#bulbGlow)"/>
    <circle cx="442" cy="264" r="4" fill="url(#bulbGlow)"/>

    <!-- Slot Lever Knob on Right Side -->
    <g transform="translate(422, 252)">
      <line x1="-10" y1="12" x2="6" y2="-4" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round"/>
      <circle cx="6" cy="-4" r="18" fill="#dc2626" stroke="#fca5a5" stroke-width="2"/>
      <circle cx="2" cy="-8" r="5" fill="#ffffff" opacity="0.8"/>
    </g>

    <!-- ==================== 3D "BET 213" GOLD TEXT ==================== -->
    <!-- Extrusion Shadows -->
    <text x="256" y="260" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="112" letter-spacing="3" fill="#3b1d00" stroke="#3b1d00" stroke-width="16" stroke-linejoin="round">BET 213</text>
    <text x="256" y="254" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="112" letter-spacing="3" fill="#78350f" stroke="#78350f" stroke-width="12" stroke-linejoin="round">BET 213</text>
    <text x="256" y="248" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="112" letter-spacing="3" fill="#b45309" stroke="#b45309" stroke-width="8" stroke-linejoin="round">BET 213</text>
    <!-- Main 3D Gold Face -->
    <text x="256" y="242" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="112" letter-spacing="3" fill="url(#bet213TextGold)" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round">BET 213</text>

    <!-- Star Glints on Marquee & Text -->
    <!-- Top Peak Glint -->
    <g transform="translate(256, 126)" filter="url(#glintGlow)">
      <polygon points="0,-18 4,-4 18,0 4,4 0,18 -4,4 -18,0 -4,-4" fill="#ffffff"/>
      <circle cx="0" cy="0" r="3.5" fill="#ffffff"/>
    </g>
    <!-- Left Star Glint -->
    <g transform="translate(18, 246)" filter="url(#glintGlow)">
      <polygon points="0,-16 3.5,-3.5 16,0 3.5,3.5 0,16 -3.5,3.5 -16,0 -3.5,-3.5" fill="#ffffff"/>
      <circle cx="0" cy="0" r="3" fill="#ffffff"/>
    </g>
    <!-- Right Star Glint -->
    <g transform="translate(492, 246)" filter="url(#glintGlow)">
      <polygon points="0,-16 3.5,-3.5 16,0 3.5,3.5 0,16 -3.5,3.5 -16,0 -3.5,-3.5" fill="#ffffff"/>
      <circle cx="0" cy="0" r="3" fill="#ffffff"/>
    </g>
    <!-- Glint on Letter B -->
    <g transform="translate(74, 214)" filter="url(#glintGlow)">
      <polygon points="0,-14 3,-3 14,0 3,3 0,14 -3,3 -14,0 -3,-3" fill="#ffffff"/>
      <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>
    </g>
    <!-- Glint on Number 3 -->
    <g transform="translate(416, 206)" filter="url(#glintGlow)">
      <polygon points="0,-14 3,-3 14,0 3,3 0,14 -3,3 -14,0 -3,-3" fill="#ffffff"/>
      <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>
    </g>
  </g>

  <!-- ==================== 5-COLUMN "SLOTS" REEL CONTAINER ==================== -->
  <g filter="url(#betShadow)">
    <!-- Golden Reel Outer Frame with Filigree Wings -->
    <!-- Left Wing -->
    <path d="M 104 330 C 88 320, 84 370, 104 380 Z" fill="url(#bet213Gold)" stroke="#78350f" stroke-width="2"/>
    <!-- Right Wing -->
    <path d="M 408 330 C 424 320, 428 370, 408 380 Z" fill="url(#bet213Gold)" stroke="#78350f" stroke-width="2"/>

    <!-- Main Gold Frame Box -->
    <rect x="100" y="278" width="312" height="98" rx="20" fill="url(#bet213Gold)" stroke="#5e3000" stroke-width="4"/>
    <rect x="106" y="284" width="300" height="86" rx="15" fill="#3b1d00"/>

    <!-- 5 Slot Columns Base Cylinder -->
    <rect x="112" y="288" width="288" height="78" rx="12" fill="url(#bet213ReelWhite)" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Top & Bottom Curved Gloss Reflection -->
    <rect x="114" y="290" width="284" height="14" rx="7" fill="#ffffff" opacity="0.8"/>
    <rect x="114" y="356" width="284" height="8" rx="4" fill="#ffffff" opacity="0.3"/>

    <!-- 4 Vertical Reel Dividers -->
    <!-- Divider 1: S / L (x ~ 170) -->
    <line x1="169" y1="288" x2="169" y2="366" stroke="#475569" stroke-width="3"/>
    <line x1="171" y1="288" x2="171" y2="366" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>

    <!-- Divider 2: L / O (x ~ 227) -->
    <line x1="226" y1="288" x2="226" y2="366" stroke="#475569" stroke-width="3"/>
    <line x1="228" y1="288" x2="228" y2="366" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>

    <!-- Divider 3: O / T (x ~ 284) -->
    <line x1="284" y1="288" x2="284" y2="366" stroke="#475569" stroke-width="3"/>
    <line x1="286" y1="288" x2="286" y2="366" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>

    <!-- Divider 4: T / S (x ~ 341) -->
    <line x1="342" y1="288" x2="342" y2="366" stroke="#475569" stroke-width="3"/>
    <line x1="344" y1="288" x2="344" y2="366" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>

    <!-- ==================== 5 LETTERS: S - L - O - T - S ==================== -->
    <!-- Letter 1: S (cx: 141) -->
    <text x="141" y="354" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="64" fill="#38030e" stroke="#38030e" stroke-width="6" stroke-linejoin="round">S</text>
    <text x="141" y="350" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="64" fill="url(#bet213SlotsRed)" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round">S</text>

    <!-- Letter 2: L (cx: 198) -->
    <text x="198" y="354" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="64" fill="#38030e" stroke="#38030e" stroke-width="6" stroke-linejoin="round">L</text>
    <text x="198" y="350" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="64" fill="url(#bet213SlotsRed)" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round">L</text>

    <!-- Letter 3: O (cx: 256) -->
    <text x="256" y="354" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="64" fill="#38030e" stroke="#38030e" stroke-width="6" stroke-linejoin="round">O</text>
    <text x="256" y="350" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="64" fill="url(#bet213SlotsRed)" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round">O</text>

    <!-- Letter 4: T (cx: 313) -->
    <text x="313" y="354" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="64" fill="#38030e" stroke="#38030e" stroke-width="6" stroke-linejoin="round">T</text>
    <text x="313" y="350" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="64" fill="url(#bet213SlotsRed)" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round">T</text>

    <!-- Letter 5: S (cx: 371) -->
    <text x="371" y="354" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="64" fill="#38030e" stroke="#38030e" stroke-width="6" stroke-linejoin="round">S</text>
    <text x="371" y="350" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="64" fill="url(#bet213SlotsRed)" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round">S</text>

    <!-- Glint on Reel Frame -->
    <g transform="translate(256, 376)" filter="url(#glintGlow)">
      <polygon points="0,-12 2.5,-2.5 12,0 2.5,2.5 0,12 -2.5,2.5 -12,0 -2.5,-2.5" fill="#ffffff"/>
      <circle cx="0" cy="0" r="2" fill="#ffffff"/>
    </g>
  </g>
</svg>
